# SPDX-License-Identifier: MIT
openapi: 3.1.0
info:
  title: Perxona Connect API
  description: The Perxona Connect API — authentication, avatar catalog, and TTS token routes for the sv-presenter Web Component.
  version: 0.1.0
servers: []
paths:
  /api/v1/connect/auth/login:
    post:
      tags:
        - connect
      summary: Authenticate a Connect user and issue an access token
      description: >-
        Authenticate with email/password and receive a JWT access token signed with the dedicated Connect secret. Pass
        the token as `Authorization: Bearer <token>` on subsequent Connect API calls.


        ## Rate Limit 

        This endpoint is limit __5 calls / 1 seconds__
      operationId: post_v1_connect_connect_login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectLoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connect/auth/forgot-password:
    post:
      tags:
        - connect
      summary: Start a Connect forgot-password flow
      description: |-
        Send a password-reset email without exposing whether the user exists.

        ## Rate Limit 
        This endpoint is limit __5 calls / 60 seconds__
      operationId: post_v1_connect_connect_forgot_password
      parameters:
        - name: lang
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/Language'
              - type: 'null'
            title: Lang
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connect/auth/reset-password:
    post:
      tags:
        - connect
      summary: Reset a Connect user's password from a forgot-password token
      description: |-
        Reset a password without issuing a Connect access token.

        ## Rate Limit 
        This endpoint is limit __5 calls / 60 seconds__
      operationId: post_v1_connect_connect_reset_password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connect/auth/signup:
    post:
      tags:
        - connect
      summary: Start a token-only Connect sign-up flow
      description: |-
        Send a Connect sign-up token without sending a browser URL.

        ## Rate Limit 
        This endpoint is limit __10 calls / 60 seconds__
      operationId: post_v1_connect_connect_signup
      parameters:
        - name: lang
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/Language'
              - type: 'null'
            title: Lang
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectSignupRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '409':
          description: A confirmed account already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Too many sign-up requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/connect/auth/confirm-signup:
    post:
      tags:
        - connect
      summary: Complete a Connect sign-up and issue an access token
      description: |-
        Confirm a Connect sign-up token and return a Connect JWT.

        ## Rate Limit 
        This endpoint is limit __10 calls / 60 seconds__
      operationId: post_v1_connect_confirm_connect_signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectConfirmSignupRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectLoginResponse'
        '400':
          description: The token is invalid or not a sign-up token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The token belongs to a different sign-up flow (e.g. a web sign-up token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The user has already completed sign-up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: The token has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Too many confirmation requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/connect/auth/logout:
    post:
      tags:
        - connect
      summary: Revoke the Connect access token
      description: >-
        Adds the current Connect Bearer token to the revocation set. Subsequent requests using the same token will be
        rejected with 401.
      operationId: post_v1_connect_connect_logout
      responses:
        '204':
          description: Successful Response
      security:
        - HTTPBearer: []
  /api/v1/connect/assets/avatars:
    get:
      tags:
        - connect
      summary: List avatars
      description: >-
        Return a paginated list of active avatars accessible to the authenticated user's organization or the default
        organization scope.
      operationId: get_v1_connect_list_avatars
      security:
        - HTTPBearer: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            title: Page
        - name: size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 50
            title: Size
        - name: sort_by
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AssetSortEnum'
            default: created_at
        - name: direction
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SortDirection'
            default: desc
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ConnectListAvatarResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connect/assets/avatars/{avatar_id}:
    get:
      tags:
        - connect
      summary: Get avatar detail
      description: Return full detail for a single active avatar including LOD URLs and lipsync support.
      operationId: get_v1_connect_get_avatar
      security:
        - HTTPBearer: []
      parameters:
        - name: avatar_id
          in: path
          required: true
          schema:
            type: string
            title: Avatar Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectAvatarDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connect/assets/avatars/{avatar_id}/motions:
    get:
      tags:
        - connect
      summary: List avatar motions
      description: >-
        Return a paginated list of active motions compatible with the avatar's skeleton, optionally filtered by pose tag
        or one or more motion IDs.
      operationId: get_v1_connect_list_connect_avatar_motions
      security:
        - HTTPBearer: []
      parameters:
        - name: avatar_id
          in: path
          required: true
          schema:
            type: string
            title: Avatar Id
        - name: pose_tag
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                pattern: ^pose:[a-z0-9_]+$
              - type: 'null'
            title: Pose Tag
        - name: motion_ids
          in: query
          required: false
          schema:
            anyOf:
              - type: array
                items:
                  type: string
                  minLength: 1
              - type: 'null'
            title: Motion Ids
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            title: Page
        - name: size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 50
            title: Size
        - name: sort_by
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AssetSortEnum'
            default: created_at
        - name: direction
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SortDirection'
            default: desc
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ConnectMotionAssetResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connect/assets/scenes:
    get:
      tags:
        - connect
      summary: List scenes
      description: >-
        Return a paginated list of active scenes accessible to the authenticated user's organization or the default
        organization scope.
      operationId: get_v1_connect_list_scenes
      security:
        - HTTPBearer: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            title: Page
        - name: size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 50
            title: Size
        - name: sort_by
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AssetSortEnum'
            default: created_at
        - name: direction
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SortDirection'
            default: desc
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ConnectListSceneResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connect/assets/scenes/{scene_id}:
    get:
      tags:
        - connect
      summary: Get scene detail
      description: Return full detail for a single active scene including LOD URLs.
      operationId: get_v1_connect_get_scene
      security:
        - HTTPBearer: []
      parameters:
        - name: scene_id
          in: path
          required: true
          schema:
            type: string
            title: Scene Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectSceneDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connect/assets/vrm/upload:
    post:
      tags:
        - connect
      summary: Upload a VRM file and register it as an avatar
      description: >-
        Accepts a VRM file, converts it to a Cocos-compatible bundle, uploads the bundle to S3, and registers the result
        as a new active avatar asset in the caller's organization. This call blocks until conversion and upload
        complete.


        ## Rate Limit 

        This endpoint is limit __5 calls / 60 seconds__
      operationId: post_v1_connect_upload_vrm
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_vrm_api_v1_connect_assets_vrm_upload_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectVRMUploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: []
  /api/v1/connect/voices:
    get:
      tags:
        - connect
      summary: List available custom voice models
      description: >-
        Return a paginated list of custom voices available to the organization. Supports filtering by language and
        provider.


        ## Rate Limit 

        This endpoint is limit __30 calls / 1 seconds__
      operationId: get_v1_connect_connect_list_voices
      security:
        - HTTPBearer: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            title: Page
        - name: size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 50
            title: Size
        - name: search_term
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Search Term
        - name: date_range_type
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/DateRangeStrEnum'
              - type: 'null'
            title: Date Range Type
        - name: start_at
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
              - type: 'null'
            title: Start At
        - name: end_at
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
              - type: 'null'
            title: End At
        - name: language
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/Language'
              - type: 'null'
            title: Language
        - name: provider
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/VoiceProvider'
              - type: 'null'
            title: Provider
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ConnectVoiceResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connect/voices/{voice_id}:
    get:
      tags:
        - connect
      summary: Get Connect voice synthesis details
      description: >-
        Return the public provider-specific synthesis configuration for a custom voice visible to the current
        organization.


        ## Rate Limit 

        This endpoint is limit __30 calls / 1 seconds__
      operationId: get_v1_connect_connect_get_voice_detail
      security:
        - HTTPBearer: []
      parameters:
        - name: voice_id
          in: path
          required: true
          schema:
            type: string
            title: Voice Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ConnectGoogleVoiceDetailResponse'
                  - $ref: '#/components/schemas/ConnectAzureVoiceDetailResponse'
                discriminator:
                  propertyName: provider
                  mapping:
                    google: '#/components/schemas/ConnectGoogleVoiceDetailResponse'
                    azure: '#/components/schemas/ConnectAzureVoiceDetailResponse'
                title: Response Connect Get Voice Detail Api V1 Connect Voices  Voice Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connect/voice-tokens/tts:
    post:
      tags:
        - connect
      summary: Generate a text-to-speech token
      description: |-
        Issue a TTS token for the given custom voice ID.

        ## Rate Limit 
        This endpoint is limit __5 calls / 1 seconds__
      operationId: post_v1_connect_connect_generate_text_to_speech_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectVoiceTextToSpeechTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectVoiceTextToSpeechTokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: []
  /api/v1/connect/presentation:
    post:
      tags:
        - connect
      summary: Generate presentation payload
      description: >-
        Generate a one-shot presentation payload for SDK consumers. The endpoint accepts an avatar asset, a custom
        voice, and text to speak, then returns clean display text, formatted speech content, and a performance manifest
        of motion assets.


        ## Rate Limit 

        This endpoint is limit __10 calls / 1 seconds__
      operationId: post_v1_connect_create_presentation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectPresentationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectPresentationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: []
  /api/v1/connect/chatbots:
    post:
      tags:
        - connect
      summary: Create a chat bot
      description: >-
        Create a new Connect chat bot, optionally seeding its knowledge file and tools. Knowledge file upload and tool
        creation are best-effort: their failure does not roll back the created chat bot.


        ## Rate Limit 

        This endpoint is limit __5 calls / 60 seconds__
      operationId: post_v1_connect_create_chat_bot
      security:
        - HTTPBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_chat_bot_api_v1_connect_chatbots_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatBotDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
        - connect
      summary: List chat bots
      description: >-
        List all non-deleted chat bots (including disabled ones) for the caller's organization as paginated lightweight
        summaries.
      operationId: get_v1_connect_list_chat_bots
      security:
        - HTTPBearer: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            title: Page
        - name: size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 50
            title: Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ChatBotSummaryResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connect/chatbots/{chat_bot_id}:
    get:
      tags:
        - connect
      summary: Get chat bot detail
      description: Get full detail for a single chat bot, including its knowledge status and tools.
      operationId: get_v1_connect_get_chat_bot
      security:
        - HTTPBearer: []
      parameters:
        - name: chat_bot_id
          in: path
          required: true
          schema:
            type: string
            title: Chat Bot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatBotDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
        - connect
      summary: Update a chat bot
      description: >-
        Partially update a chat bot's fields, knowledge file, and/or tools. Only fields actually provided are changed.
        knowledge_file and remove_knowledge are mutually exclusive. Omit tools to leave the tool set unchanged; pass an
        empty array to clear it. Knowledge operations commit independently, so they remain applied if a subsequent tool
        or field update fails.


        ## Rate Limit 

        This endpoint is limit __5 calls / 60 seconds__
      operationId: patch_v1_connect_update_chat_bot
      security:
        - HTTPBearer: []
      parameters:
        - name: chat_bot_id
          in: path
          required: true
          schema:
            type: string
            title: Chat Bot Id
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_update_chat_bot_api_v1_connect_chatbots__chat_bot_id__patch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatBotDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
        - connect
      summary: Delete a chat bot
      description: Soft-delete a chat bot and clean up its knowledge/tool bindings.
      operationId: delete_v1_connect_delete_chat_bot
      security:
        - HTTPBearer: []
      parameters:
        - name: chat_bot_id
          in: path
          required: true
          schema:
            type: string
            title: Chat Bot Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connect/chatbots/{chat_bot_id}/chat:
    post:
      tags:
        - connect
      summary: Send a message to a chat bot
      operationId: post_v1_connect_chat_with_chat_bot
      security:
        - HTTPBearer: []
      parameters:
        - name: chat_bot_id
          in: path
          required: true
          schema:
            type: string
            title: Chat Bot Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectChatBotChatRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectChatBotChatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: |-


        ## Rate Limit 
        This endpoint is limit __30 calls / 60 seconds__
components:
  schemas:
    AssetLOD:
      type: string
      enum:
        - lod0
        - lod1
        - lod2
      title: AssetLOD
      description: The level of detail for the asset
    AssetLodCdnUrl:
      $defs:
        AssetType:
          description: The type of the asset
          enum:
            - avatar
            - scene
            - motion
            - facial_motion
          title: AssetType
          type: string
      description: The CDN URLs for each LOD level
      properties:
        type:
          anyOf:
            - $ref: '#/components/schemas/AssetType'
            - type: 'null'
          default: null
        lod0:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          title: Lod0
        lod1:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          title: Lod1
        lod2:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          title: Lod2
      title: AssetLodCdnUrl
      type: object
    AssetSortEnum:
      type: string
      enum:
        - created_at
        - updated_at
        - bundle_id
        - display_order
      title: AssetSortEnum
    AssetType:
      type: string
      enum:
        - avatar
        - scene
        - motion
        - facial_motion
      title: AssetType
      description: The type of the asset
    AudioEncoding:
      type: string
      enum:
        - LINEAR16
        - MP3
        - OGG_OPUS
        - MULAW
        - ALAW
      title: AudioEncoding
    AvatarThumbnailType:
      type: string
      enum:
        - default
        - head
        - upper_body
        - full_body
        - three_quarter_face
        - animated_full_body
        - hd
        - loading
      title: AvatarThumbnailType
      description: The type of thumbnail for the asset
