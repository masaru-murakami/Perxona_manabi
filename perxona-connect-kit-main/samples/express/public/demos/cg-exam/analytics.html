<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>質問ログ分析 — CG検定模擬試験</title>
<style>
:root{
  --paper:#E9EBF0; --surface:#FFFFFF; --line:#C9CEDA; --ink:#171A22; --muted:#666E80;
  --key:#D98A24; --fill:#2F7E97; --back:#A8477A; --ok:#2E7D5B; --ng:#B03A3A;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --gothic:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",Meiryo,sans-serif;
  --display:"Iowan Old Style",Georgia,"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 60px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.3;margin:8px 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
h2{font-family:var(--display);font-size:16px;font-weight:600;margin:0 0 12px}
.gate{max-width:360px;margin:60px auto 0}
.gate input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:var(--mono);margin-bottom:10px}
.gate button, .btn{padding:9px 16px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-size:13px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.err{color:var(--ng);font-size:12.5px;margin-top:8px}
.hint{color:var(--muted);font-size:12.5px;margin-top:8px}
[hidden]{display:none!important}

.stat-row{display:flex;gap:14px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat .n{font-family:var(--mono);font-size:26px;font-weight:600}
.stat .l{font-size:11px;color:var(--muted);letter-spacing:.04em}

.bar-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12.5px}
.bar-row .label{flex:0 0 150px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .track{flex:1;background:var(--paper);border-radius:5px;height:14px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--fill);border-radius:5px}
.bar-row .count{flex:0 0 34px;text-align:right;font-family:var(--mono);color:var(--muted)}

.days-scroll{overflow-x:auto;margin-top:6px}
.days{display:flex;align-items:flex-end;gap:4px;height:100px;min-width:min-content}
.days .day{flex:0 0 36px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.days .day .col{width:100%;background:var(--key);border-radius:3px 3px 0 0;min-height:2px}
.days .day .lbl{font-family:var(--mono);font-size:9px;color:var(--muted);white-space:nowrap}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar input[type=search]{flex:1;min-width:180px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.toolbar .count-note{font-size:12px;color:var(--muted)}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
td.q, td.r{max-width:280px}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.ng{color:var(--ng);border-color:var(--ng)}
.tag.hint{color:var(--back);border-color:var(--back)}
.tag.ask{color:var(--fill);border-color:var(--fill)}
.table-wrap{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">CG-ARTS EXAM PREP / INTERNAL</div>
  <h1>質問ログ分析</h1>
  <p class="sub">「AIに質問する」フォームに学習者が送った質問を集計・一覧します。</p>

  <div class="gate card" id="gate">
    <h2>パスワード</h2>
    <input type="password" id="gate-pw" placeholder="ANALYTICS_PASSWORD" autocomplete="off">
    <button class="btn" id="gate-submit">見る</button>
    <p class="err" id="gate-err" hidden></p>
    <p class="hint" id="gate-hint" hidden></p>
  </div>

  <div id="view" hidden>
    <div class="stat-row">
      <div class="stat"><div class="n" id="stat-total">–</div><div class="l">総件数</div></div>
      <div class="stat"><div class="n" id="stat-ask">–</div><div class="l">自由質問</div></div>
      <div class="stat"><div class="n" id="stat-hint">–</div><div class="l">ヒント</div></div>
      <div class="stat"><div class="n" id="stat-success">–</div><div class="l">回答成功</div></div>
      <div class="stat"><div class="n" id="stat-ja">–</div><div class="l">日本語</div></div>
      <div class="stat"><div class="n" id="stat-en">–</div><div class="l">English</div></div>
    </div>

    <div class="card">
      <h2>分野別</h2>
      <div id="by-domain"></div>
    </div>

    <div class="card">
      <h2>日別件数(直近14日)</h2>
      <div class="days-scroll" id="by-day-scroll"><div class="days" id="by-day"></div></div>
    </div>

    <div class="card">
      <h2>質問一覧</h2>
      <div class="toolbar">
        <input type="search" id="search" placeholder="質問・回答をキーワード検索…">
        <span class="count-note" id="table-count"></span>
        <button class="btn ghost" id="refresh">更新</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>日時</th><th>種別</th><th>言語</th><th>分野</th><th>質問</th><th>回答</th><th>結果</th></tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "cg-exam-analytics-pw";
const TABLE_ROW_LIMIT = 300; // render cap after filtering — keeps the DOM light on a large log

const gate = document.getElementById("gate");
const gatePw = document.getElementById("gate-pw");
const gateSubmit = document.getElementById("gate-submit");
const gateErr = document.getElementById("gate-err");
const gateHint = document.getElementById("gate-hint");
const view = document.getElementById("view");
const searchInput = document.getElementById("search");
const refreshBtn = document.getElementById("refresh");
const tableBody = document.getElementById("table-body");
const tableCount = document.getElementById("table-count");

let entries = [];

async function fetchAnalytics(password) {
  const res = await fetch("/api/analytics", {
    headers: { "x-analytics-password": password },
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(body.error ?? res.statusText);
    err.status = res.status;
    throw err;
  }
  return body;
}

function showGateError(message) {
  gateErr.textContent = message;
  gateErr.hidden = false;
}

function showGateHint(message) {
  gateHint.textContent = message;
  gateHint.hidden = false;
}

async function tryLoad(password) {
  gateErr.hidden = true;
  gateHint.hidden = true;
  try {
    const data = await fetchAnalytics(password);
    try {
      sessionStorage.setItem(STORAGE_KEY, password);
    } catch {
      // sessionStorage unavailable — fine, just re-prompt next reload.
    }
    entries = data.entries ?? [];
    gate.hidden = true;
    view.hidden = false;
    render();
  } catch (error) {
    try {
      sessionStorage.removeItem(STORAGE_KEY);
    } catch {}
    if (error.status === 501) {
      showGateHint(
        "ANALYTICS_PASSWORD がサーバーに設定されていません。.env（本番は Netlify の環境変数）に設定し、サーバーを再起動/再デプロイしてください。",
      );
    } else if (error.status === 401) {
      showGateError("パスワードが違います。");
    } else {
      showGateError(`読み込みに失敗しました: ${error.message}`);
    }
  }
}

gateSubmit.addEventListener("click", () => {
  const pw = gatePw.value.trim();
  if (!pw) return;
  tryLoad(pw);
});
gatePw.addEventListener("keydown", (e) => {
  if (e.key === "Enter") gateSubmit.click();
});

refreshBtn.addEventListener("click", () => {
  const pw = (() => {
    try {
      return sessionStorage.getItem(STORAGE_KEY);
    } catch {
      return null;
    }
  })();
  if (pw) tryLoad(pw);
});

searchInput.addEventListener("input", () => renderTable());

function barList(container, counts, total) {
  container.innerHTML = "";
  const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (rows.length === 0) {
    container.innerHTML = '<p class="hint">まだデータがありません。</p>';
    return;
  }
  const max = rows[0][1];
  for (const [label, count] of rows) {
    const row = document.createElement("div");
    row.className = "bar-row";
    const pct = total > 0 ? Math.round((count / max) * 100) : 0;
    row.innerHTML = `
      <span class="label">${escapeHtml(label)}</span>
      <span class="track"><span class="fill" style="width:${pct}%"></span></span>
      <span class="count">${count}</span>`;
    container.appendChild(row);
  }
}

function renderDays(container, entries) {
  container.innerHTML = "";
  const days = [];
  const now = new Date();
  for (let i = 13; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    days.push(d.toISOString().slice(0, 10));
  }
  const counts = Object.fromEntries(days.map((d) => [d, 0]));
  for (const e of entries) {
    const day = (e.ts ?? "").slice(0, 10);
    if (day in counts) counts[day]++;
  }
  const max = Math.max(1, ...Object.values(counts));
  for (const day of days) {
    const el = document.createElement("div");
    el.className = "day";
    const h = Math.max(2, Math.round((counts[day] / max) * 90));
    const mmdd = day.slice(5).replace("-", "/");
    el.innerHTML = `<span class="lbl">${counts[day] || ""}</span><span class="col" style="height:${h}px"></span><span class="lbl">${mmdd}</span>`;
    container.appendChild(el);
  }
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function formatTs(iso) {
  try {
    return new Date(iso).toLocaleString("ja-JP", {
      month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit",
    });
  } catch {
    return iso ?? "";
  }
}

function renderTable() {
  const q = searchInput.value.trim().toLowerCase();
  const filtered = q
    ? entries.filter(
        (e) =>
          (e.question ?? "").toLowerCase().includes(q) ||
          (e.reply ?? "").toLowerCase().includes(q) ||
          (e.domain ?? "").toLowerCase().includes(q),
      )
    : entries;
  const shown = filtered.slice(0, TABLE_ROW_LIMIT);
  tableCount.textContent =
    filtered.length > shown.length
      ? `${shown.length} / ${filtered.length} 件を表示（全 ${entries.length} 件）`
      : `${filtered.length} 件（全 ${entries.length} 件）`;
  tableBody.innerHTML = shown
    .map(
      (e) => `
    <tr>
      <td>${formatTs(e.ts)}</td>
      <td>${e.kind === "hint" ? '<span class="tag hint">ヒント</span>' : '<span class="tag ask">質問</span>'}</td>
      <td>${e.lang === "en" ? "EN" : "JA"}</td>
      <td>${escapeHtml(e.domain ?? "—")}</td>
      <td class="q">${escapeHtml(e.question)}</td>
      <td class="r">${escapeHtml(e.reply ?? (e.errorMessage ?? "—"))}</td>
      <td>${e.success ? '<span class="tag ok">成功</span>' : '<span class="tag ng">失敗</span>'}</td>
    </tr>`,
    )
    .join("");
}

function render() {
  const total = entries.length;
  const askCount = entries.filter((e) => e.kind !== "hint").length;
  const hintCount = entries.filter((e) => e.kind === "hint").length;
  const success = entries.filter((e) => e.success).length;
  const ja = entries.filter((e) => e.lang !== "en").length;
  const en = entries.filter((e) => e.lang === "en").length;
  document.getElementById("stat-total").textContent = total;
  document.getElementById("stat-ask").textContent = askCount;
  document.getElementById("stat-hint").textContent = hintCount;
  document.getElementById("stat-success").textContent = success;
  document.getElementById("stat-ja").textContent = ja;
  document.getElementById("stat-en").textContent = en;

  const domainCounts = {};
  for (const e of entries) {
    const key = e.domain || "(未分類)";
    domainCounts[key] = (domainCounts[key] ?? 0) + 1;
  }
  barList(document.getElementById("by-domain"), domainCounts, total);
  renderDays(document.getElementById("by-day"), entries);
  // Scroll the day chart to the right so today is visible by default when
  // the 14-day chart is wider than the card (narrow viewports).
  const daysScroll = document.getElementById("by-day-scroll");
  daysScroll.scrollLeft = daysScroll.scrollWidth;
  renderTable();
}

// Auto-load if a password was already entered earlier this tab session.
(() => {
  let saved = null;
  try {
    saved = sessionStorage.getItem(STORAGE_KEY);
  } catch {}
  if (saved) tryLoad(saved);
})();
</script>
</body>
</html>
