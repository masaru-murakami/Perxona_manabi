<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CG Creator Certification Basic — Mock Exams</title>
<style>
:root{
  --paper:#E9EBF0; --surface:#FFFFFF; --line:#C9CEDA; --ink:#171A22; --muted:#666E80;
  --key:#D98A24; --fill:#2F7E97; --back:#A8477A; --ok:#2E7D5B; --ng:#B03A3A;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --gothic:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",Meiryo,sans-serif;
  --display:"Iowan Old Style",Georgia,"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:840px;margin:0 auto;padding:0 20px 96px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--fill);outline-offset:2px}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:11px 22px;border-radius:2px;letter-spacing:.02em;transition:opacity .15s}
.btn:hover{opacity:.82}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:rgba(23,26,34,.06);opacity:1}
.btn:disabled{opacity:.3;cursor:not-allowed}

header.masthead{border-bottom:1px solid var(--line);background:var(--surface);margin-bottom:40px}
header.masthead .wrap{padding-top:30px;padding-bottom:28px;position:relative}
h1{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.3;letter-spacing:.01em;margin:10px 0 6px}
.sub{color:var(--muted);font-size:13px;margin:0}
.lightbar{display:flex;height:3px;margin-top:22px}
.lightbar i{flex:1}
.lightbar i:nth-child(1){background:var(--key)}
.lightbar i:nth-child(2){background:var(--fill)}
.lightbar i:nth-child(3){background:var(--back)}
.langtoggle{position:fixed;right:18px;top:18px;z-index:50;display:flex;align-items:center;
  background:var(--surface);border:1px solid var(--ink);border-radius:999px;padding:3px;
  box-shadow:0 6px 20px rgba(23,26,34,.20)}
.langtoggle .knob{position:absolute;top:3px;left:3px;width:82px;height:calc(100% - 6px);
  background:var(--ink);border-radius:999px;transition:transform .22s cubic-bezier(.4,0,.2,1)}
.langtoggle[data-lang="en"] .knob{transform:translateX(82px)}
.langtoggle button{position:relative;z-index:1;width:82px;border:0;background:transparent;
  padding:9px 0;border-radius:999px;font-size:12.5px;letter-spacing:.04em;color:var(--muted);
  transition:color .2s}
.langtoggle button[aria-pressed="true"]{color:#fff;font-weight:600}

.spec{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);background:var(--surface);margin-bottom:34px}
.spec div{padding:13px 15px;border-right:1px solid var(--line)}
.spec div:last-child{border-right:none}
.spec dt{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);margin:0}
.spec dd{margin:4px 0 0;font-size:15px;font-weight:600}

h2{font-family:var(--display);font-size:19px;font-weight:600;margin:0 0 14px;letter-spacing:.02em}
.modes{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.mode{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:2px;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600;box-shadow:inset 0 -3px 0 var(--key)}
.modenote{color:var(--muted);font-size:13px;margin:0 0 30px}

.setgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.setbtn{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:14px 6px 11px;color:inherit;text-align:center;transition:border-color .15s,transform .15s}
.setbtn:hover{border-color:var(--ink);transform:translateY(-2px)}
.setbtn .n{display:block;font-family:var(--mono);font-size:20px;line-height:1}
.setbtn .l{display:block;font-size:11px;color:var(--muted);margin-top:5px}
.setbtn .b{display:block;font-family:var(--mono);font-size:11px;color:var(--fill);margin-top:3px;min-height:1.2em}
.setbtn.cleared{box-shadow:inset 0 -3px 0 var(--ok)}
.randombtn{width:100%;background:var(--surface);border:1px dashed var(--muted);border-radius:2px;padding:15px;color:inherit;margin-bottom:34px}
.randombtn:hover{border-color:var(--ink);border-style:solid}
.randombtn b{font-weight:600}
.randombtn span{color:var(--muted);font-size:13px;display:block}

.hud{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hud .wrap{display:flex;align-items:center;gap:16px;padding-top:12px;padding-bottom:12px}
.hud .set-label{font-family:var(--mono);font-size:12px;color:var(--muted)}
.clock{font-family:var(--mono);font-size:20px;margin-left:auto;letter-spacing:.06em}
.clock.warn{color:var(--ng)}
.progress{height:2px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--key);transition:width .25s}

.qhead{display:flex;align-items:baseline;gap:14px;margin:34px 0 6px;flex-wrap:wrap}
.qno{font-family:var(--mono);font-size:13px;color:var(--key);letter-spacing:.08em}
.qdomain{font-size:12px;color:var(--muted)}
.qtext{font-size:17px;line-height:1.75;margin:0 0 22px}
.choices{display:grid;gap:9px;margin-bottom:26px}
.choice{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);padding:14px 18px;text-align:left;color:inherit;border-radius:2px;transition:border-color .12s,background .12s;line-height:1.55}
.choice:hover{border-color:var(--muted)}
.choice .mark{font-family:var(--mono);color:var(--muted);min-width:1.2em}
.choice[aria-pressed="true"]{border-color:var(--ink);background:#FBF6EE}
.choice[aria-pressed="true"] .mark{color:var(--key);font-weight:700}
.choice.correct{border-color:var(--ok);background:#F0F7F3}
.choice.correct .mark{color:var(--ok)}
.choice.wrong{border-color:var(--ng);background:#FBF1F1}
.choice.wrong .mark{color:var(--ng)}
.feedback{border-left:3px solid var(--fill);background:var(--surface);padding:14px 18px;margin-bottom:24px;font-size:14px}
.feedback .verdict{font-weight:700;margin-right:10px}
.feedback .verdict.o{color:var(--ok)}
.feedback .verdict.x{color:var(--ng)}
.navrow{display:flex;gap:10px;align-items:center;margin-bottom:34px;flex-wrap:wrap}
.navrow .spacer{flex:1}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;padding:18px;background:var(--surface);border:1px solid var(--line)}
.grid button{aspect-ratio:1;border:1px solid var(--line);background:transparent;font-family:var(--mono);font-size:12px;color:var(--muted);border-radius:2px}
.grid button.answered{background:#EFE3D0;border-color:#D9C4A2;color:var(--ink)}
.grid button.current{border-color:var(--ink);border-width:2px;color:var(--ink);font-weight:700}
.gridnote{font-family:var(--mono);font-size:11px;color:var(--muted);margin:10px 0 0;letter-spacing:.06em}

.score{display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:26px;margin-bottom:34px}
.score .big{font-family:var(--mono);font-size:76px;line-height:.9;letter-spacing:-.02em}
.score .of{font-family:var(--mono);font-size:18px;color:var(--muted)}
.verdictpill{font-family:var(--mono);font-size:13px;letter-spacing:.1em;padding:7px 16px;border:1px solid currentColor;border-radius:2px}
.verdictpill.pass{color:var(--ok)}
.verdictpill.fail{color:var(--ng)}
.score .meta{margin-left:auto;text-align:right;color:var(--muted);font-size:13px;font-family:var(--mono)}
.radarwrap{background:var(--surface);border:1px solid var(--line);padding:22px 10px 10px;margin-bottom:14px}
.radar{display:block;width:100%;height:auto;max-width:540px;margin:0 auto}
.radar .ring{fill:none;stroke:var(--line);stroke-width:1}
.radar .pass-ring{fill:none;stroke:var(--key);stroke-width:1;stroke-dasharray:3 4}
.radar .axis{stroke:var(--line);stroke-width:1}
.radar .mesh{fill:rgba(47,126,151,.16);stroke:var(--fill);stroke-width:2;stroke-linejoin:round}
.radar .vert{fill:var(--fill)}
.radar text{font-family:var(--gothic);font-size:9.5px;fill:var(--muted)}
.radar .passlabel{font-family:var(--mono);font-size:8px;fill:var(--key)}
.bars{margin-bottom:34px}
.bar{display:grid;grid-template-columns:1fr 132px 42px;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.bar .nm{font-size:13.5px}
.bar .track{height:8px;background:#DDE1E9;position:relative}
.bar .track i{display:block;height:100%;background:var(--fill)}
.bar .track.low i{background:var(--ng)}
.bar .track::after{content:"";position:absolute;left:70%;top:-3px;bottom:-3px;width:1px;background:var(--key)}
.bar .val{font-family:var(--mono);font-size:13px;text-align:right;color:var(--muted)}
.review{display:grid;gap:12px;margin-bottom:30px}
.rev{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ok);padding:16px 18px}
.rev.miss{border-left-color:var(--ng)}
.rev .rq{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.rev .rt{font-size:14.5px;margin:0 0 10px;line-height:1.65}
.rev .ra{font-size:13.5px;margin:0 0 4px}
.rev .ra.yours{color:var(--ng)}
.rev .re{font-size:13.5px;color:var(--muted);margin:8px 0 0;line-height:1.7}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:2px;font-size:13px;color:var(--muted)}
.filters button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.hint{background:#FBF6EE;border:1px solid #E3D3B6;padding:16px 18px;font-size:13.5px;margin-bottom:30px;line-height:1.7}
.hint b{display:block;margin-bottom:4px}
footer{border-top:1px solid var(--line);margin-top:60px;padding-top:18px;color:var(--muted);font-size:12px}
.hint-row{margin:12px 0}
.hint-row .btn{font-size:12px}
.admin-link{color:var(--muted);text-decoration:none;font-family:var(--mono)}
.admin-link:hover{color:var(--fill);text-decoration:underline}
.examgrid{display:grid;gap:14px;margin:40px 0}
.examcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px 22px;color:inherit;cursor:pointer;transition:border-color .15s,transform .15s}
.examcard:hover{border-color:var(--ink);transform:translateY(-2px)}
.examcard .t{font-family:var(--display);font-size:19px;font-weight:600;margin-bottom:6px}
.examcard .s{color:var(--muted);font-size:13px}
.switch-exam{display:block;background:none;border:none;color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-decoration:underline;cursor:pointer;padding:0;margin-bottom:24px}
.switch-exam:hover{color:var(--fill)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 22px;border-radius:2px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.toast.show{opacity:1}
.screen{display:none}
.screen.active{display:block;animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:640px){
  h1{font-size:23px}
  .langtoggle{right:12px;top:12px}
  .langtoggle .knob,.langtoggle button{width:70px}
  .langtoggle[data-lang="en"] .knob{transform:translateX(70px)}
  .toast{bottom:76px}
  .spec{grid-template-columns:repeat(2,1fr)}
  .setgrid{grid-template-columns:repeat(4,1fr)}
  .grid{grid-template-columns:repeat(8,1fr)}
  .score .big{font-size:56px}
  .score .meta{margin-left:0;text-align:left;width:100%}
  .bar{grid-template-columns:1fr 80px 40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="./avatar.css">
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <p class="eyebrow" id="t-eyebrow"></p>
    <h1 id="t-title"></h1>
    <p class="sub" id="t-sub"></p>
    <div class="lightbar"><i></i><i></i><i></i></div>
  </div>
</header>

<section class="screen active" id="s-select">
  <div class="wrap">
    <div class="examgrid" id="examgrid"></div>
  </div>
</section>

<section class="screen" id="s-start">
  <div class="wrap">
    <button class="switch-exam" id="switch-exam"></button>
    <dl class="spec" id="spec"></dl>
    <h2 id="t-h-mode"></h2>
    <div class="modes">
      <button class="mode" id="m-study" aria-pressed="true"></button>
      <button class="mode" id="m-exam" aria-pressed="false"></button>
    </div>
    <p class="modenote" id="modenote"></p>
    <h2 id="t-h-sets"></h2>
    <div class="setgrid" id="setgrid"></div>
    <button class="randombtn" id="rand"><b id="t-rand-b"></b><span id="t-rand-s"></span></button>
    <div class="hint" id="hint1"></div>
    <div class="hint" id="hint2"></div>
    <footer><a class="admin-link" href="analytics.html">質問ログ分析(運営者用)</a></footer>
  </div>
</section>

<section class="screen" id="s-exam">
  <div class="hud">
    <div class="wrap">
      <span class="set-label" id="hud-set"></span>
      <span class="set-label" id="hud-count"></span>
      <span class="clock" id="clock">60:00</span>
    </div>
    <div class="progress"><i id="prog" style="width:0%"></i></div>
  </div>
  <div class="wrap">
    <div class="qhead"><span class="qno" id="qno"></span><span class="qdomain" id="qdomain"></span></div>
    <p class="qtext" id="qtext"></p>
    <div class="choices" id="choices"></div>
    <div class="hint-row" id="hint-row" hidden>
      <button class="btn ghost" id="hint-btn"></button>
    </div>
    <div id="feedback"></div>
    <div class="navrow">
      <button class="btn ghost" id="prev"></button>
      <button class="btn ghost" id="next"></button>
      <span class="spacer"></span>
      <button class="btn" id="submit"></button>
    </div>
    <div class="grid" id="grid"></div>
    <p class="gridnote" id="gridnote"></p>
    <p style="margin-top:22px"><button class="btn ghost" id="abort"></button></p>
  </div>
</section>

<section class="screen" id="s-result">
  <div class="wrap">
    <p class="eyebrow" id="r-eyebrow"></p>
    <div class="score">
      <div><span class="big" id="r-score">0</span><span class="of"> / 100</span></div>
      <span class="verdictpill" id="r-pill"></span>
      <div class="meta" id="r-meta"></div>
    </div>
    <h2 id="t-h-radar"></h2>
    <div class="radarwrap"><svg class="radar" id="radar" viewBox="0 0 540 470" role="img"></svg></div>
    <div class="bars" id="bars"></div>
    <div class="hint" id="advice"></div>
    <h2 id="t-h-review"></h2>
    <div class="filters">
      <button id="f-all" aria-pressed="true"></button>
      <button id="f-miss" aria-pressed="false"></button>
    </div>
    <div class="review" id="review"></div>
    <div class="navrow">
      <button class="btn" id="copy"></button>
      <button class="btn ghost" id="retry"></button>
      <button class="btn ghost" id="home"></button>
    </div>
    <footer id="t-footer"></footer>
  </div>
</section>

<div class="toast" id="toast"></div>

<div class="langtoggle" id="langtoggle" data-lang="en" role="group" aria-label="Language / 表示言語">
  <span class="knob" aria-hidden="true"></span>
  <button id="lang-ja" aria-pressed="false">日本語</button>
  <button id="lang-en" aria-pressed="true">English</button>
</div>

<!--
  Perxona Connect Kit integration: a floating avatar companion that reacts to
  the quiz (greeting on start, correct/wrong reactions, an on-demand deeper
  explanation via LLM, and a spoken summary on the result screen). See
  avatar.js — it only talks to the quiz engine above through the
  window.CGExamAvatar hook functions called from start()/renderQ()/showResult().
-->
<div class="avatar-panel" id="avatar-panel">
  <div class="avatar-stage">
    <sv-presenter class="avatar-presenter"></sv-presenter>
    <p class="avatar-status" id="avatar-status">Avatar loading…</p>
  </div>
  <select class="avatar-scene-select" id="avatar-scene-select">
    <option value="">Default scene</option>
    <option value="01KPW5ES2MXZS4VMVW20J4GSK4">Outdoor school</option>
  </select>
  <label class="avatar-accent">
    <input type="checkbox" id="avatar-accent-toggle">
    <span id="avatar-accent-label">Japanese accent</span>
  </label>
  <p class="avatar-bubble" id="avatar-bubble" hidden></p>
  <form class="avatar-ask-form" id="avatar-ask-form">
    <input type="text" class="avatar-ask-input" id="avatar-ask-input"
      placeholder="AIに質問する…" maxlength="300" autocomplete="off">
    <button type="button" class="avatar-ask-mic" id="avatar-ask-mic"
      aria-label="音声入力" title="音声入力" aria-pressed="false" hidden>🎤</button>
    <button type="submit" class="avatar-ask-submit" id="avatar-ask-submit">質問する</button>
  </form>
</div>

<script>
let MANIFEST=null,EXAM=null,POOL=null,CFG=null;
let EXAM_I18N={ja:{},en:{}};

const APP_I18N={
ja:{
 htmlLang:"ja", marks:"アイウエ",
 selectH:"検定を選ぶ", selectSub:"挑戦したい検定の模擬試験を選んでください。",
 loading:"読み込み中…", loadFail:m=>"読み込みに失敗しました: "+m,
 hMode:"解き方を選ぶ", hSets:"回を選ぶ", hRadar:"領域別の到達度", hReview:"解答と解説",
 modeExam:"本番モード", modeStudy:"演習モード",
 noteStudy:"1問ごとにその場で正誤と解説を表示します。時間制限はありません。",
 setLabel:n=>"第"+n+"回", pt:"点",
 randB:"ランダム出題", randomLabel:"ランダム出題",
 prev:"前の問題", next:"次の問題", submit:"採点する", abort:"中断してトップへ", hintBtn:"ヒント", switchExam:"別の検定を選ぶ",
 qno:(a,b)=>"問 "+a+"-"+b,
 correct:"正解", wrong:"不正解",
 fbCorrect:m=>"正答は "+m+" 。",
 confirmAbort:"解答内容は保存されません。トップに戻りますか？",
 confirmSubmit:n=>"未解答が"+n+"問あります。このまま採点しますか？",
 timeUp:"時間切れです。採点します",
 modeName:m=>m==="exam"?"本番モード":"演習モード",
 pass:"合格ライン到達", short:d=>"あと "+d+" 点",
 elapsed:m=>"所要 "+m+"分", noLimit:"時間制限なし",
 fMiss:"まちがえた問題だけ",
 revAnswer:"正答　", revYours:"あなたの解答　", unansweredWord:"未解答", noMiss:"まちがえた問題はありません。",
 copy:"結果をコピー", retry:"同じ回をもう一度", home:"トップへ",
 copied:"結果をコピーしました", copyFail:"コピーできませんでした",
 copyDom:"---- 領域別 ----"
},
en:{
 htmlLang:"en", marks:"ABCD",
 selectH:"Choose a certification", selectSub:"Pick which certification's mock exam you'd like to try.",
 loading:"Loading…", loadFail:m=>"Failed to load: "+m,
 hMode:"Choose how to take it", hSets:"Choose a set", hRadar:"Score by subject area", hReview:"Answers and explanations",
 modeExam:"Exam mode", modeStudy:"Practice mode",
 noteStudy:"Each question is marked and explained immediately. No time limit.",
 setLabel:n=>"Set "+n, pt:" pts",
 randB:"Random set", randomLabel:"Random set",
 prev:"Previous", next:"Next", submit:"Score my answers", abort:"Quit and return to the start", hintBtn:"Hint", switchExam:"Choose another exam",
 qno:(a,b)=>"Q "+a+"-"+b,
 correct:"Correct", wrong:"Incorrect",
 fbCorrect:m=>"The answer is "+m+".",
 confirmAbort:"Your answers will not be saved. Return to the start screen?",
 confirmSubmit:n=>"You have "+n+" unanswered questions. Score anyway?",
 timeUp:"Time is up. Scoring your answers.",
 modeName:m=>m==="exam"?"Exam mode":"Practice mode",
 pass:"PASS MARK CLEARED", short:d=>d+" POINTS SHORT",
 elapsed:m=>m+" min taken", noLimit:"no time limit",
 fMiss:"Only what I missed",
 revAnswer:"Answer　", revYours:"You chose　", unansweredWord:"no answer", noMiss:"You did not miss any questions.",
 copy:"Copy my results", retry:"Retake this set", home:"Back to start",
 copied:"Results copied", copyFail:"Could not copy",
 copyDom:"---- by subject area ----"
}};

/* Builds the exam-dependent half of T()'s merged result from a loaded exam
   JSON (see data/manifest.json + data/<id>.json) — everything here depends
   on that exam's shape (domain count, questions-per-set, pass mark, time
   limit), unlike APP_I18N above which is the same for any exam. */
function buildExamI18N(exam){
  const D=exam.domains.ja.length, Q=exam.questionsPerDomain, TOTAL=D*Q;
  const NSETS=exam.nsets, PASS=exam.passMark, TIME_MIN=exam.timeLimitMinutes, PPQ=exam.pointsPerQuestion;
  const BANK=D*exam.pool.ja[0].length;
  return {
    ja:{

let lang="en";
const T=()=>({...APP_I18N[lang], ...EXAM_I18N[lang]});

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffled(arr,rnd){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* Shuffles question order across domains and stamps each item with its 1-based
   ordinal within its own domain (qn), since renderQ/renderReview label questions
   as "domain-qn" and can no longer assume domain-block order in the array. */
function withOrdinals(paper){
  const count={};
  paper.forEach(item=>{count[item.d]=(count[item.d]||0)+1;item.qn=count[item.d];});
  return paper;
}
function buildSets(){
  const rnd=mulberry32(20260806);
  const D=CFG.D,Q=CFG.Q;
  const use=POOL.ja.map(p=>p.map(()=>0));
  const sets=[];
  for(let s=0;s<CFG.NSETS;s++){
    const paper=[];
    for(let d=0;d<D;d++){
      const idx=shuffled(POOL.ja[d].map((_,i)=>i),rnd);
      idx.sort((a,b)=>use[d][a]-use[d][b]);
      const pick=idx.slice(0,Q);
      pick.forEach(i=>{use[d][i]++;});
      pick.forEach(i=>paper.push({d:d,i:i,ord:shuffled([0,1,2,3],rnd)}));
    }
    sets.push(withOrdinals(shuffled(paper,rnd)));
  }
  return sets;
}
function randomPaper(){
  const rnd=mulberry32(Math.floor(Math.random()*1e9));
  const D=CFG.D,Q=CFG.Q;
  const paper=[];
  for(let d=0;d<D;d++)shuffled(POOL.ja[d].map((_,i)=>i),rnd).slice(0,Q).forEach(i=>paper.push({d:d,i:i,ord:shuffled([0,1,2,3],rnd)}));
  return withOrdinals(shuffled(paper,rnd));
}
/* 同じ設問を現在の言語で展開。選択肢の並べ替えは両言語で共通 */
function view(slot){
  const src=POOL[lang][slot.d][slot.i];
  return {q:src.q,e:src.e,d:slot.d,qn:slot.qn,c:slot.ord.map(k=>src.c[k]),a:slot.ord.indexOf(src.a)};
}

function renderExamGrid(){
  const g=$("examgrid");
  if(!g)return;
  if(!MANIFEST){g.innerHTML="";return;}
  g.innerHTML="";
  MANIFEST.exams.forEach(item=>{
    const b=document.createElement("button");
    b.className="examcard";
    const ttl=document.createElement("div");ttl.className="t";ttl.textContent=item.title[lang]||item.title.ja;
    const sub=document.createElement("div");sub.className="s";sub.textContent=item.summary[lang]||item.summary.ja;
    b.appendChild(ttl);b.appendChild(sub);
    b.onclick=()=>loadExam(item);
    g.appendChild(b);
  });
}

async function loadExam(item){
  const t=T(),g=$("examgrid");
  g.innerHTML='<p class="hint">'+t.loading+'</p>';
  try{
    const res=await fetch("data/"+item.file);
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    EXAM=data;
    POOL=data.pool;
    CFG={
      D:data.domains.ja.length,
      Q:data.questionsPerDomain,
      TOTAL:data.domains.ja.length*data.questionsPerDomain,
      NSETS:data.nsets,
      PASS:data.passMark,
      TIME_MIN:data.timeLimitMinutes,
      PPQ:data.pointsPerQuestion,
      WEAK:Math.floor(data.questionsPerDomain/2)
    };
    EXAM_I18N=buildExamI18N(data);
    SETS=buildSets();
    best=new Array(CFG.NSETS).fill(null);
    remain=CFG.TIME_MIN*60;
    window.CGExamAvatar?.onExamLoad(item.title);
    applyStatic();
    show("s-start");
  }catch(err){
    console.error("[exam] failed to load",item.file,err);
    g.innerHTML='<p class="hint">'+t.loadFail(err.message)+'</p>';
  }
}

async function initApp(){
  applyStatic();
  try{
    const res=await fetch("data/manifest.json");
    if(!res.ok)throw new Error("HTTP "+res.status);
    MANIFEST=await res.json();
  }catch(err){
    console.error("[exam] failed to load manifest",err);
    $("examgrid").innerHTML='<p class="hint">'+T().loadFail(err.message)+'</p>';
    return;
  }
  renderExamGrid();
}

$("lang-en").onclick=()=>setLang("en");
$("lang-ja").onclick=()=>setLang("ja");

function renderSets(){
  const g=$("setgrid");g.innerHTML="";
  for(let i=0;i<CFG.NSETS;i++){
    const b=document.createElement("button");
    b.className="setbtn"+(best[i]!==null&&best[i]>=CFG.PASS?" cleared":"");
    b.innerHTML='<span class="n">'+(i+1)+'</span><span class="l">'+T().setLabel(i+1)+'</span><span class="b">'+(best[i]===null?"":best[i]+T().pt)+'</span>';
    b.onclick=()=>start(SETS[i],i);

$("rand").onclick=()=>start(randomPaper(),-1);
$("m-exam").onclick=()=>setMode("exam");
$("m-study").onclick=()=>setMode("study");
function setMode(m){
  mode=m;
  $("m-exam").setAttribute("aria-pressed",m==="exam");
  $("m-study").setAttribute("aria-pressed",m==="study");
  $("modenote").textContent=m==="exam"?T().noteExam:T().noteStudy;
}

function start(s,idx){
  slots=s;setIdx=idx;paper=slots.map(view);
  cur=0;reviewFilter="all";graded=false;
  answers=new Array(CFG.TOTAL).fill(null);
  $("hud-set").textContent=labelText();
  clearInterval(timer);
  if(mode==="exam"){remain=CFG.TIME_MIN*60;$("clock").style.display="";tick();timer=setInterval(tick,1000);}
  else{$("clock").style.display="none";}
  buildGrid();renderQ();show("s-exam");
  window.CGExamAvatar?.onStart(lang);
}
function tick(){
  const m=String(Math.floor(remain/60)).padStart(2,"0"),s=String(remain%60).padStart(2,"0");
  $("clock").textContent=m+":"+s;
  $("clock").classList.toggle("warn",remain<=300);
  if(remain<=0){clearInterval(timer);toast(T().timeUp);grade();return;}
  remain--;
}
function buildGrid(){
  const g=$("grid");g.innerHTML="";
  for(let i=0;i<CFG.TOTAL;i++){const b=document.createElement("button");b.textContent=i+1;b.onclick=()=>{cur=i;renderQ();};g.appendChild(b);}
}
function refreshGrid(){
  [...$("grid").children].forEach((b,i)=>{b.classList.toggle("answered",answers[i]!==null);b.classList.toggle("current",i===cur);});
  const n=answers.filter(a=>a!==null).length;
  $("hud-count").textContent=T().answered(n);
  $("gridnote").textContent=T().unanswered(CFG.TOTAL-n);
  $("prog").style.width=(n/CFG.TOTAL*100)+"%";
}
function renderQ(){
  const t=T(),item=paper[cur];
  window.CGExamAvatar?.onQuestion(item,lang,t.domains[item.d]);
  $("qno").textContent=t.qno(item.d+1,item.qn);
  $("qdomain").textContent=t.domains[item.d];
  $("qtext").textContent=item.q;
  const reveal=(mode==="study"&&answers[cur]!==null);
  $("hint-row").hidden=!(mode==="study"&&answers[cur]===null);
  const box=$("choices");box.innerHTML="";
  item.c.forEach((txt,i)=>{
    const b=document.createElement("button");
    b.className="choice";
    b.setAttribute("aria-pressed",answers[cur]===i);
    if(reveal){
      if(i===item.a)b.classList.add("correct");
      else if(answers[cur]===i)b.classList.add("wrong");
      b.disabled=true;
    }
    const m=document.createElement("span");m.className="mark";m.textContent=t.marks[i];
    const s=document.createElement("span");s.textContent=txt;
    b.appendChild(m);b.appendChild(s);
    b.onclick=()=>choose(i);
    box.appendChild(b);
  });
  const fb=$("feedback");fb.innerHTML="";
  if(reveal){
    const ok=answers[cur]===item.a;
    const d=document.createElement("div");d.className="feedback";
    const v=document.createElement("span");v.className="verdict "+(ok?"o":"x");v.textContent=ok?t.correct:t.wrong;
    const p=document.createElement("span");p.textContent=t.fbCorrect(t.marks[item.a]);
    const e=document.createElement("div");e.style.marginTop="8px";e.style.color="var(--muted)";e.textContent=item.e;
    d.appendChild(v);d.appendChild(p);d.appendChild(e);
    const why=document.createElement("button");
    why.className="btn ghost";why.style.marginTop="10px";why.style.fontSize="12px";
    why.textContent=lang==="ja"?"アバターにもっと聞く":"Ask the avatar more";
    why.onclick=()=>window.CGExamAvatar?.explain(item,ok,lang,t.domains[item.d]);
    d.appendChild(why);
    fb.appendChild(d);
    window.CGExamAvatar?.onReveal(item,ok,lang,t.domains[item.d]);
  }
  $("prev").disabled=cur===0;$("next").disabled=cur===CFG.TOTAL-1;
  refreshGrid();
}
function choose(i){
  if(mode==="study"&&answers[cur]!==null)return;
  answers[cur]=i;renderQ();
  if(mode==="exam"&&cur<CFG.TOTAL-1)setTimeout(()=>{cur++;renderQ();},180);
}
$("prev").onclick=()=>{if(cur>0){cur--;renderQ();}};
$("next").onclick=()=>{if(cur<CFG.TOTAL-1){cur++;renderQ();}};
$("hint-btn").onclick=()=>window.CGExamAvatar?.hint();
$("abort").onclick=()=>{if(confirm(T().confirmAbort)){clearInterval(timer);renderSets();show("s-start");}};
$("submit").onclick=()=>{
  const un=answers.filter(a=>a===null).length;
  if(un>0&&!confirm(T().confirmSubmit(un)))return;
  grade();
};
$("switch-exam").onclick=()=>{clearInterval(timer);EXAM=null;applyStatic();show("s-select");};
document.addEventListener("keydown",e=>{
  if(!$("s-exam").classList.contains("active"))return;
  if(e.key==="ArrowRight"&&cur<CFG.TOTAL-1){cur++;renderQ();}
  if(e.key==="ArrowLeft"&&cur>0){cur--;renderQ();}
  const k="123456789".slice(0,paper[cur].c.length).split("").indexOf(e.key);
  if(k>=0)choose(k);
});

function tally(){
  const dom=new Array(CFG.D).fill(0);let correct=0;
  paper.forEach((item,i)=>{if(answers[i]===item.a){correct++;dom[item.d]++;}});
  return{dom:dom,correct:correct,score:correct*CFG.PPQ};
}
let elapsedMin=0;
function grade(){
  clearInterval(timer);
  elapsedMin=Math.floor((CFG.TIME_MIN*60-remain)/60);
  graded=true;
  const t=tally();
  if(setIdx>=0&&(best[setIdx]===null||t.score>best[setIdx]))best[setIdx]=t.score;
  showResult();show("s-result");
}
function showResult(){
  const t=T(),r=tally();
  $("r-eyebrow").textContent=labelText()+" / "+t.modeName(mode);
  $("r-score").textContent=(r.score%1===0)?r.score:r.score.toFixed(1);
  const pass=r.score>=CFG.PASS;
  $("r-pill").textContent=pass?t.pass:t.short((CFG.PASS-r.score).toFixed(1));
  $("r-pill").className="verdictpill "+(pass?"pass":"fail");
  $("r-meta").textContent=t.meta(r.correct,mode==="exam"?t.elapsed(elapsedMin):t.noLimit);
  drawRadar(r.dom);drawBars(r.dom);drawAdvice(r.dom,r.score);renderReview();
  window.CGExamAvatar?.onResult(r,t.domains,lang);
}
function drawRadar(dom){
  const t=T(),cx=270,cy=230,R=150,N=CFG.D;
  const pt=(i,r)=>{const ang=-Math.PI/2+i*2*Math.PI/N;return[cx+Math.cos(ang)*R*r,cy+Math.sin(ang)*R*r];};
  let s="";
  [0.25,0.5,0.75,1].forEach(r=>{let d="";for(let i=0;i<N;i++){const p=pt(i,r);d+=(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)+" ";}s+='<path class="ring" d="'+d+'Z"/>';});
  let dp="";for(let i=0;i<N;i++){const p=pt(i,0.7);dp+=(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)+" ";}
  s+='<path class="pass-ring" d="'+dp+'Z"/>';
  for(let i=0;i<N;i++){const p=pt(i,1);s+='<line class="axis" x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'"/>';}
  let mesh="";for(let i=0;i<N;i++){const p=pt(i,Math.max(dom[i]/CFG.Q,0.02));mesh+=(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)+" ";}
  s+='<path class="mesh" d="'+mesh+'Z"/>';
  for(let i=0;i<N;i++){const p=pt(i,Math.max(dom[i]/CFG.Q,0.02));s+='<circle class="vert" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3"/>';}
  for(let i=0;i<N;i++){
    const p=pt(i,1.17);let anchor="middle";
    if(p[0]>cx+8)anchor="start";
    if(p[0]<cx-8)anchor="end";
    s+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+3).toFixed(1)+'" text-anchor="'+anchor+'">'+t.domainsShort[i]+'</text>';
  }
  s+='<text class="passlabel" x="'+cx+'" y="'+(cy-R*0.7-6)+'" text-anchor="middle">'+t.passLabel+'</text>';
  $("radar").innerHTML=s;
}
function drawBars(dom){
  const t=T();
  $("bars").innerHTML=dom.map((v,i)=>'<div class="bar"><span class="nm">'+t.domains[i]+'</span><span class="track'+(v<=CFG.WEAK?" low":"")+'"><i style="width:'+(v/CFG.Q*100)+'%"></i></span><span class="val">'+v+'/'+CFG.Q+'</span></div>').join("");
}
function drawAdvice(dom,score){
  const t=T(),weak=dom.map((v,i)=>({v:v,i:i})).filter(o=>o.v<=CFG.WEAK).map(o=>t.domains[o.i]);
  $("advice").innerHTML=weak.length===0?t.adviceOK:t.adviceNG(weak,score);
}
function renderReview(){
  const t=T(),box=$("review");box.innerHTML="";
  const nodes=paper.map((item,i)=>{
    const ok=answers[i]===item.a;
    if(reviewFilter==="miss"&&ok)return null;
    const d=document.createElement("div");d.className="rev"+(ok?"":" miss");
    const h=document.createElement("div");h.className="rq";
    h.textContent=t.qno(item.d+1,item.qn)+"　"+t.domains[item.d]+"　"+(ok?t.correct:t.wrong);
    const q=document.createElement("p");q.className="rt";q.textContent=item.q;
    const a=document.createElement("p");a.className="ra";
    const ab=document.createElement("b");ab.textContent=t.marks[item.a]+"　"+item.c[item.a];
    a.textContent=t.revAnswer;a.appendChild(ab);
    d.appendChild(h);d.appendChild(q);d.appendChild(a);
    if(!ok){
      const y=document.createElement("p");y.className="ra yours";
      y.textContent=t.revYours+(answers[i]===null?t.unansweredWord:t.marks[answers[i]]+"　"+item.c[answers[i]]);
      d.appendChild(y);
    }
    const e=document.createElement("p");e.className="re";e.textContent=item.e;
    d.appendChild(e);
    return d;
  }).filter(Boolean);
  if(nodes.length===0){const d=document.createElement("div");d.className="rev";const p=document.createElement("p");p.className="rt";p.textContent=t.noMiss;d.appendChild(p);box.appendChild(d);}
  else nodes.forEach(n=>box.appendChild(n));
}
$("f-all").onclick=()=>{reviewFilter="all";$("f-all").setAttribute("aria-pressed",true);$("f-miss").setAttribute("aria-pressed",false);renderReview();};
$("f-miss").onclick=()=>{reviewFilter="miss";$("f-all").setAttribute("aria-pressed",false);$("f-miss").setAttribute("aria-pressed",true);renderReview();};
$("retry").onclick=()=>start(slots,setIdx);
$("home").onclick=()=>{renderSets();show("s-start");};
$("copy").onclick=()=>{
  const t=T(),r=tally();
  const lines=[t.copyTitle+labelText(),t.copyScore(r.score,r.correct),t.copyDom]
    .concat(t.domains.map((d,i)=>d+"　"+r.dom[i]+"/"+CFG.Q));
  navigator.clipboard.writeText(lines.join("\n")).then(()=>toast(t.copied),()=>toast(t.copyFail));
};
setLang("en");
initApp();
</script>
<script type="module" src="./avatar.js"></script>
