<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CG Creator Certification Basic — Mock Exams</title>
<style>
:root{
  --paper:#E9EBF0; --surface:#FFFFFF; --line:#C9CEDA; --ink:#171A22; --muted:#666E80;
  --key:#D98A24; --fill:#2F7E97; --back:#A8477A; --ok:#2E7D5B; --ng:#B03A3A;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --gothic:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",Meiryo,sans-serif;
  --display:"Iowan Old Style",Georgia,"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:840px;margin:0 auto;padding:0 20px 96px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--fill);outline-offset:2px}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:11px 22px;border-radius:2px;letter-spacing:.02em;transition:opacity .15s}
.btn:hover{opacity:.82}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:rgba(23,26,34,.06);opacity:1}
.btn:disabled{opacity:.3;cursor:not-allowed}

header.masthead{border-bottom:1px solid var(--line);background:var(--surface);margin-bottom:40px}
header.masthead .wrap{padding-top:30px;padding-bottom:28px;position:relative}
h1{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.3;letter-spacing:.01em;margin:10px 0 6px}
.sub{color:var(--muted);font-size:13px;margin:0}
.lightbar{display:flex;height:3px;margin-top:22px}
.lightbar i{flex:1}
.lightbar i:nth-child(1){background:var(--key)}
.lightbar i:nth-child(2){background:var(--fill)}
.lightbar i:nth-child(3){background:var(--back)}
.langtoggle{position:fixed;right:18px;top:18px;z-index:50;display:flex;align-items:center;
  background:var(--surface);border:1px solid var(--ink);border-radius:999px;padding:3px;
  box-shadow:0 6px 20px rgba(23,26,34,.20)}
.langtoggle .knob{position:absolute;top:3px;left:3px;width:82px;height:calc(100% - 6px);
  background:var(--ink);border-radius:999px;transition:transform .22s cubic-bezier(.4,0,.2,1)}
.langtoggle[data-lang="en"] .knob{transform:translateX(82px)}
.langtoggle button{position:relative;z-index:1;width:82px;border:0;background:transparent;
  padding:9px 0;border-radius:999px;font-size:12.5px;letter-spacing:.04em;color:var(--muted);
  transition:color .2s}
.langtoggle button[aria-pressed="true"]{color:#fff;font-weight:600}

.spec{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);background:var(--surface);margin-bottom:34px}
.spec div{padding:13px 15px;border-right:1px solid var(--line)}
.spec div:last-child{border-right:none}
.spec dt{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);margin:0}
.spec dd{margin:4px 0 0;font-size:15px;font-weight:600}

h2{font-family:var(--display);font-size:19px;font-weight:600;margin:0 0 14px;letter-spacing:.02em}
.modes{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.mode{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:2px;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600;box-shadow:inset 0 -3px 0 var(--key)}
.modenote{color:var(--muted);font-size:13px;margin:0 0 30px}

.setgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.setbtn{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:14px 6px 11px;color:inherit;text-align:center;transition:border-color .15s,transform .15s}
.setbtn:hover{border-color:var(--ink);transform:translateY(-2px)}
.setbtn .n{display:block;font-family:var(--mono);font-size:20px;line-height:1}
.setbtn .l{display:block;font-size:11px;color:var(--muted);margin-top:5px}
.setbtn .b{display:block;font-family:var(--mono);font-size:11px;color:var(--fill);margin-top:3px;min-height:1.2em}
.setbtn.cleared{box-shadow:inset 0 -3px 0 var(--ok)}
.randombtn{width:100%;background:var(--surface);border:1px dashed var(--muted);border-radius:2px;padding:15px;color:inherit;margin-bottom:34px}
.randombtn:hover{border-color:var(--ink);border-style:solid}
.randombtn b{font-weight:600}
.randombtn span{color:var(--muted);font-size:13px;display:block}

.hud{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hud .wrap{display:flex;align-items:center;gap:16px;padding-top:12px;padding-bottom:12px}
.hud .set-label{font-family:var(--mono);font-size:12px;color:var(--muted)}
.clock{font-family:var(--mono);font-size:20px;margin-left:auto;letter-spacing:.06em}
.clock.warn{color:var(--ng)}
.progress{height:2px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--key);transition:width .25s}

.qhead{display:flex;align-items:baseline;gap:14px;margin:34px 0 6px;flex-wrap:wrap}
.qno{font-family:var(--mono);font-size:13px;color:var(--key);letter-spacing:.08em}
.qdomain{font-size:12px;color:var(--muted)}
.qtext{font-size:17px;line-height:1.75;margin:0 0 22px}
.choices{display:grid;gap:9px;margin-bottom:26px}
.choice{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);padding:14px 18px;text-align:left;color:inherit;border-radius:2px;transition:border-color .12s,background .12s;line-height:1.55}
.choice:hover{border-color:var(--muted)}
.choice .mark{font-family:var(--mono);color:var(--muted);min-width:1.2em}
.choice[aria-pressed="true"]{border-color:var(--ink);background:#FBF6EE}
.choice[aria-pressed="true"] .mark{color:var(--key);font-weight:700}
.choice.correct{border-color:var(--ok);background:#F0F7F3}
.choice.correct .mark{color:var(--ok)}
.choice.wrong{border-color:var(--ng);background:#FBF1F1}
.choice.wrong .mark{color:var(--ng)}
.feedback{border-left:3px solid var(--fill);background:var(--surface);padding:14px 18px;margin-bottom:24px;font-size:14px}
.feedback .verdict{font-weight:700;margin-right:10px}
.feedback .verdict.o{color:var(--ok)}
.feedback .verdict.x{color:var(--ng)}
.navrow{display:flex;gap:10px;align-items:center;margin-bottom:34px;flex-wrap:wrap}
.navrow .spacer{flex:1}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;padding:18px;background:var(--surface);border:1px solid var(--line)}
.grid button{aspect-ratio:1;border:1px solid var(--line);background:transparent;font-family:var(--mono);font-size:12px;color:var(--muted);border-radius:2px}
.grid button.answered{background:#EFE3D0;border-color:#D9C4A2;color:var(--ink)}
.grid button.current{border-color:var(--ink);border-width:2px;color:var(--ink);font-weight:700}
.gridnote{font-family:var(--mono);font-size:11px;color:var(--muted);margin:10px 0 0;letter-spacing:.06em}

.score{display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:26px;margin-bottom:34px}
.score .big{font-family:var(--mono);font-size:76px;line-height:.9;letter-spacing:-.02em}
.score .of{font-family:var(--mono);font-size:18px;color:var(--muted)}
.verdictpill{font-family:var(--mono);font-size:13px;letter-spacing:.1em;padding:7px 16px;border:1px solid currentColor;border-radius:2px}
.verdictpill.pass{color:var(--ok)}
.verdictpill.fail{color:var(--ng)}
.score .meta{margin-left:auto;text-align:right;color:var(--muted);font-size:13px;font-family:var(--mono)}
.radarwrap{background:var(--surface);border:1px solid var(--line);padding:22px 10px 10px;margin-bottom:14px}
.radar{display:block;width:100%;height:auto;max-width:540px;margin:0 auto}
.radar .ring{fill:none;stroke:var(--line);stroke-width:1}
.radar .pass-ring{fill:none;stroke:var(--key);stroke-width:1;stroke-dasharray:3 4}
.radar .axis{stroke:var(--line);stroke-width:1}
.radar .mesh{fill:rgba(47,126,151,.16);stroke:var(--fill);stroke-width:2;stroke-linejoin:round}
.radar .vert{fill:var(--fill)}
.radar text{font-family:var(--gothic);font-size:9.5px;fill:var(--muted)}
.radar .passlabel{font-family:var(--mono);font-size:8px;fill:var(--key)}
.bars{margin-bottom:34px}
.bar{display:grid;grid-template-columns:1fr 132px 42px;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.bar .nm{font-size:13.5px}
.bar .track{height:8px;background:#DDE1E9;position:relative}
.bar .track i{display:block;height:100%;background:var(--fill)}
.bar .track.low i{background:var(--ng)}
.bar .track::after{content:"";position:absolute;left:70%;top:-3px;bottom:-3px;width:1px;background:var(--key)}
.bar .val{font-family:var(--mono);font-size:13px;text-align:right;color:var(--muted)}
.review{display:grid;gap:12px;margin-bottom:30px}
.rev{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ok);padding:16px 18px}
.rev.miss{border-left-color:var(--ng)}
.rev .rq{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.rev .rt{font-size:14.5px;margin:0 0 10px;line-height:1.65}
.rev .ra{font-size:13.5px;margin:0 0 4px}
.rev .ra.yours{color:var(--ng)}
.rev .re{font-size:13.5px;color:var(--muted);margin:8px 0 0;line-height:1.7}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:2px;font-size:13px;color:var(--muted)}
.filters button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.hint{background:#FBF6EE;border:1px solid #E3D3B6;padding:16px 18px;font-size:13.5px;margin-bottom:30px;line-height:1.7}
.hint b{display:block;margin-bottom:4px}
footer{border-top:1px solid var(--line);margin-top:60px;padding-top:18px;color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 22px;border-radius:2px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.toast.show{opacity:1}
.screen{display:none}
.screen.active{display:block;animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:640px){
  h1{font-size:23px}
  .langtoggle{right:12px;top:12px}
  .langtoggle .knob,.langtoggle button{width:70px}
  .langtoggle[data-lang="en"] .knob{transform:translateX(70px)}
  .toast{bottom:76px}
  .spec{grid-template-columns:repeat(2,1fr)}
  .setgrid{grid-template-columns:repeat(4,1fr)}
  .grid{grid-template-columns:repeat(8,1fr)}
  .score .big{font-size:56px}
  .score .meta{margin-left:0;text-align:left;width:100%}
  .bar{grid-template-columns:1fr 80px 40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="./avatar.css">
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <p class="eyebrow" id="t-eyebrow"></p>
    <h1 id="t-title"></h1>
    <p class="sub" id="t-sub"></p>
    <div class="lightbar"><i></i><i></i><i></i></div>
  </div>
</header>

<section class="screen active" id="s-start">
  <div class="wrap">
    <dl class="spec" id="spec"></dl>
    <h2 id="t-h-mode"></h2>
    <div class="modes">
      <button class="mode" id="m-exam" aria-pressed="true"></button>
      <button class="mode" id="m-study" aria-pressed="false"></button>
    </div>
    <p class="modenote" id="modenote"></p>
    <h2 id="t-h-sets"></h2>
    <div class="setgrid" id="setgrid"></div>
    <button class="randombtn" id="rand"><b id="t-rand-b"></b><span id="t-rand-s"></span></button>
    <div class="hint" id="hint1"></div>
    <div class="hint" id="hint2"></div>
  </div>
</section>

<section class="screen" id="s-exam">
  <div class="hud">
    <div class="wrap">
      <span class="set-label" id="hud-set"></span>
      <span class="set-label" id="hud-count"></span>
      <span class="clock" id="clock">60:00</span>
    </div>
    <div class="progress"><i id="prog" style="width:0%"></i></div>
  </div>
  <div class="wrap">
    <div class="qhead"><span class="qno" id="qno"></span><span class="qdomain" id="qdomain"></span></div>
    <p class="qtext" id="qtext"></p>
    <div class="choices" id="choices"></div>
    <div id="feedback"></div>
    <div class="navrow">
      <button class="btn ghost" id="prev"></button>
      <button class="btn ghost" id="next"></button>
      <span class="spacer"></span>
      <button class="btn" id="submit"></button>
    </div>
    <div class="grid" id="grid"></div>
    <p class="gridnote" id="gridnote"></p>
    <p style="margin-top:22px"><button class="btn ghost" id="abort"></button></p>
  </div>
</section>

<section class="screen" id="s-result">
  <div class="wrap">
    <p class="eyebrow" id="r-eyebrow"></p>
    <div class="score">
      <div><span class="big" id="r-score">0</span><span class="of"> / 100</span></div>
      <span class="verdictpill" id="r-pill"></span>
      <div class="meta" id="r-meta"></div>
    </div>
    <h2 id="t-h-radar"></h2>
    <div class="radarwrap"><svg class="radar" id="radar" viewBox="0 0 540 470" role="img"></svg></div>
    <div class="bars" id="bars"></div>
    <div class="hint" id="advice"></div>
    <h2 id="t-h-review"></h2>
    <div class="filters">
      <button id="f-all" aria-pressed="true"></button>
      <button id="f-miss" aria-pressed="false"></button>
    </div>
    <div class="review" id="review"></div>
    <div class="navrow">
      <button class="btn" id="copy"></button>
      <button class="btn ghost" id="retry"></button>
      <button class="btn ghost" id="home"></button>
    </div>
    <footer id="t-footer"></footer>
  </div>
</section>

<div class="toast" id="toast"></div>

<div class="langtoggle" id="langtoggle" data-lang="en" role="group" aria-label="Language / 表示言語">
  <span class="knob" aria-hidden="true"></span>
  <button id="lang-ja" aria-pressed="false">日本語</button>
  <button id="lang-en" aria-pressed="true">English</button>
</div>

<!--
  Perxona Connect Kit integration: a floating avatar companion that reacts to
  the quiz (greeting on start, correct/wrong reactions, an on-demand deeper
  explanation via LLM, and a spoken summary on the result screen). See
  avatar.js — it only talks to the quiz engine above through the
  window.CGExamAvatar hook functions called from start()/renderQ()/showResult().
-->
<div class="avatar-panel" id="avatar-panel">
  <div class="avatar-stage">
    <sv-presenter class="avatar-presenter"></sv-presenter>
    <p class="avatar-status" id="avatar-status">Avatar loading…</p>
  </div>
  <p class="avatar-bubble" id="avatar-bubble" hidden></p>
</div>

<script>
const POOL={ja:[[{"q":"企画・シナリオが固まったあと、カット割り・構図・カメラワーク・セリフ・秒数などを絵と文字で示し、制作全体の設計図となるものはどれか。","c":["三面図","絵コンテ（ストーリーボード）","カラースクリプト","香盤表"],"a":1,"e":"絵コンテは映像の設計図。三面図はモデリング用の資料、カラースクリプトは作品全体の色調計画、香盤表は撮影の進行管理表。"},{"q":"絵コンテを時間軸上に並べ、仮の音声やセリフとともに再生して、尺やテンポを事前に検証する工程はどれか。","c":["アニマティクス（ビデオコンテ）","レイアウト","ラッシュ試写","コンフォーム"],"a":0,"e":"アニマティクスは絵コンテに「時間」を与えたもの。尺やテンポの問題を、コストの高いプロダクション工程に入る前に発見できる。"},{"q":"次のうち、プリプロダクションに含まれない作業はどれか。","c":["キャラクターデザイン","絵コンテ制作","予算・スケジュールの立案","カラーグレーディング"],"a":3,"e":"カラーグレーディングはポストプロダクションの工程。他の3つはいずれもプリプロダクションにあたる。"},{"q":"3次元CGによるキャラクターアニメーション制作の一般的な工程順序として、最も適切なものはどれか。","c":["モデリング → セットアップ → アニメーション → レンダリング → 合成・編集","モデリング → レンダリング → アニメーション → 合成・編集 → セットアップ","アニメーション → モデリング → セットアップ → 合成・編集 → レンダリング","セットアップ → モデリング → 合成・編集 → アニメーション → レンダリング"],"a":0,"e":"「作る→動かす準備→動かす→絵にする→仕上げる」という流れで覚える。"},{"q":"完成したモデルにボーンを入れ、コントローラを設定して動かせる状態にする工程はどれか。","c":["モデリング","セットアップ（リギング）","レイアウト","コンポジット"],"a":1,"e":"セットアップ（リギング）。アニメーターが扱いやすい操作系を用意することが目的で、動きそのものは付けない。"},{"q":"次のうち、プロダクション工程に含まれない作業はどれか。","c":["モデリング","ライティング","シナリオ執筆","アニメーション"],"a":2,"e":"シナリオ執筆はプリプロダクション。プロダクションは実際に素材を作る段階を指す。"},{"q":"レンダリングされたカットをつなぎ、尺やテンポを決めていく作業はどれか。","c":["レンダリング","編集（エディット）","モデリング","リギング"],"a":1,"e":"編集。ノンリニア編集では素材の順序や長さを何度でも組み替えられる。"},{"q":"制作の初期に、キャラクターの正面・側面・背面を描き、モデリングの資料とする図はどれか。","c":["絵コンテ","三面図（設定資料）","香盤表","カラースクリプト"],"a":1,"e":"三面図。モデラーが形状を正確に立ち上げるための基準となる。"},{"q":"絵コンテに基づき、3D空間にキャラクターと背景を仮配置してカメラアングルを決める工程はどれか。","c":["レイアウト","リギング","コンポジット","グレーディング"],"a":0,"e":"レイアウト。3D空間で構図とカメラを確定させる、絵コンテとアニメーションの橋渡し工程。"},{"q":"香盤表の目的として、最も適切なものはどれか。","c":["登場する要素や撮影・制作の順序を整理し、進行を管理する","完成映像の色調を設計する","モデルの寸法を規定する","音楽の構成を決める"],"a":0,"e":"香盤表は制作進行のための管理表。誰が・いつ・何を必要とするかを一覧化する。"},{"q":"次のうち、ポストプロダクションに含まれる作業はどれか。","c":["モデリング","絵コンテ制作","コンポジット（合成）","キャラクターデザイン"],"a":2,"e":"合成・編集・グレーディング・音の仕上げがポストプロダクション。"},{"q":"工程間でジオメトリやアニメーションをまとめて受け渡す、汎用の3Dデータ交換フォーマットはどれか。","c":["JPEG","FBX","MP3","CSV"],"a":1,"e":"FBXは代表的な3D中間フォーマット。用途によりAlembicやUSDなども使われる。"},{"q":"プリプロダクションを十分に行う最大の目的として、最も適切なものはどれか。","c":["完成イメージと段取りを事前に固め、後工程での大きな手戻りを防ぐ","レンダリング時間を短縮する","ポリゴン数を削減する","出演者の人数を減らす"],"a":0,"e":"手戻りのコストは工程が進むほど跳ね上がる。設計を前倒しで固めることがプリプロの本質。"},{"q":"シナリオ（脚本）が主に規定するものはどれか。","c":["物語の流れ、登場人物、セリフ","各カットのレンズと絞り","モデルのポリゴン数","レンダラーの設定"],"a":0,"e":"シナリオは物語の設計図。映像としての見せ方は絵コンテ以降で具体化する。"},{"q":"作品全体の場面ごとの色調計画を、時系列に沿って小さな画で並べたものはどれか。","c":["カラースクリプト","三面図","香盤表","モデルシート"],"a":0,"e":"カラースクリプト。物語の感情の起伏を色で設計し、作品全体のトーンを統一する。"},{"q":"企画段階で、世界観やキャラクターの方向性を探るために描かれる絵はどれか。","c":["コンセプトアート","レンダリング画像","ワイヤフレーム図","UVマップ"],"a":0,"e":"コンセプトアート。関係者の完成イメージを揃え、方向性の合意を得るために描かれる。"},{"q":"プリビジュアライゼーション（プレビズ）の目的として、最も適切なものはどれか。","c":["簡易な3Dでカメラや動きを事前に検証し、本番の段取りを決める","最終品質の映像を書き出す","テクスチャの解像度を決める","音楽を作曲する"],"a":0,"e":"低品質でよいので、構図・カメラワーク・尺を先に検証する。実写のVFXでも広く使われる。"},{"q":"制作途中の映像を関係者で確認し、修正点を洗い出す試写を何というか。","c":["ラッシュ（チェック試写）","コンフォーム","ベイク","リターゲティング"],"a":0,"e":"ラッシュ。早い段階で問題を共有することで、大きな作り直しを避けられる。"},{"q":"24fpsの映像で5秒のカットを作る場合、必要なフレーム数はどれか。","c":["24フレーム","48フレーム","120フレーム","240フレーム"],"a":2,"e":"24×5＝120フレーム。尺とフレーム数の換算は制作管理の基本。"},{"q":"複数人で3DCG制作を分担するとき、データの受け渡しで最も重要になるものはどれか。","c":["ファイル名やフォルダ構成などの命名規則を統一すること","各自が好きな単位系を使うこと","毎回同じファイルを上書きすること","バックアップを取らないこと"],"a":0,"e":"命名規則とフォルダ構成の統一は、分業の前提。差し替えや検索の事故を防ぐ。"},{"q":"作業ファイルを日付や連番付きで保存していく理由として、最も適切なものはどれか。","c":["問題が起きたときに以前の状態へ戻せるようにするため","レンダリングを速くするため","ポリゴン数を減らすため","色空間を変換するため"],"a":0,"e":"バージョン管理の基本。上書き保存だけでは、破綻した時点より前に戻れない。"},{"q":"多数のコンピュータで分担してレンダリングを行う仕組みはどれか。","c":["レンダーファーム","テクスチャアトラス","パーティクルシステム","ノンリニア編集"],"a":0,"e":"レンダーファーム。フレーム単位で分散処理することで、長尺の映像を現実的な時間で仕上げる。"},{"q":"制作の進行管理で、工程の区切りごとに設定される到達目標を何というか。","c":["マイルストーン","タイムコード","フレームレート","レンダーパス"],"a":0,"e":"マイルストーン。設定した節目で進捗を確認し、遅れを早期に検知する。"},{"q":"ディレクター（監督）の役割として、最も適切なものはどれか。","c":["作品の内容と表現の方向性について判断を下す","予算調達と契約の管理を行う","モデルのポリゴン数を最適化する","レンダリングサーバを保守する"],"a":0,"e":"内容面の最終責任がディレクター。予算やスケジュールなど制作全体の管理はプロデューサーの役割。"},{"q":"絵コンテとレイアウトの関係として、最も適切なものはどれか。","c":["絵コンテで決めた構図を、実際の3D空間で具体化したものがレイアウトである","レイアウトを描いたあとに絵コンテを起こす","両者はまったく無関係な工程である","レイアウトは編集後に作成する"],"a":0,"e":"絵 たりの表示回数"],"a":0,"e":"1インチあたりの密度。同じ画素数でもdpiが変われば印刷される物理的な大きさが変わる。"},{"q":"JPEGとPNGの説明として、最も適切なものはどれか。","c":["JPEGは可逆圧縮で、透明度を扱える","JPEGは非可逆圧縮で写真に向き、PNGは可逆圧縮で透明度を扱える","PNGは非可逆圧縮のため、保存を繰り返すと劣化する","どちらも非可逆圧縮で、違いは色数だけである"],"a":1,"e":"JPEGは非可逆で写真向き・アルファ非対応。PNGは可逆でアルファチャンネルを保持できる。"},{"q":"HSVカラーモデルの「H」が表すものはどれか。","c":["色相","明度","彩度","不透明度"],"a":0,"e":"H＝Hue（色相）、S＝Saturation（彩度）、V＝Value（明度）。"},{"q":"同じ大きさでも手前に大きく見えやすい色の傾向はどれか。","c":["明度・彩度が高い暖色","明度の低い寒色","無彩色のグレー","彩度0の黒"],"a":0,"e":"進出色・膨張色。暖色系で明るく鮮やかな色は前に出て見え、寒色系で暗い色は後退して見える。"},{"q":"sRGBの説明として、最も適切なものはどれか。","c":["一般的なディスプレイやWebで標準的に用いられる色空間","印刷専用のインク規格","動画の圧縮方式","解像度の単位"],"a":0,"e":"sRGBは標準的な色空間。より広い色域を扱う場合はAdobe RGBやRec.2020などが使われる。"},{"q":"アルファチャンネルを保持したまま静止画を書き出したい。最も適切な形式はどれか。","c":["JPEG","PNG","BMP（24ビット）","MP4"],"a":1,"e":"PNGは可逆圧縮でアルファチャンネルを保持できる。JPEGと24ビットBMPは透明度を持てない。"},{"q":"無彩色に分類される色はどれか。","c":["白・灰・黒","赤・青・黄","シアン・マゼンタ","肌色・空色"],"a":0,"e":"無彩色は彩度が0で色みをもたない色。明度だけで区別される。"},{"q":"1チャンネル8ビット、RGB3チャンネルのフルカラー画像が表現できる色数はどれか。","c":["約256色","約65,000色","約1,677万色","約42億色"],"a":2,"e":"256の3乗＝16,777,216色。いわゆる24ビットフルカラー。"},{"q":"8ビットのグレースケール画像が表現できる階調数はどれか。","c":["16階調","64階調","256階調","1024階調"],"a":2,"e":"2の8乗＝256階調。0が黒、255が白にあたる。"},{"q":"GIF形式が同時に扱える最大の色数はどれか。","c":["16色","256色","65,536色","約1,677万色"],"a":1,"e":"GIFはインデックスカラーで最大256色。写真には向かず、色数の少ない図版やアニメーションに使われる。"},{"q":"色温度を表す単位はどれか。","c":["ケルビン（K）","ルクス（lx）","ヘルツ（Hz）","デシベル（dB）"],"a":0,"e":"ケルビン。数値が低いほど赤みを帯び、高いほど青白くなる。"},{"q":"色料の三原色（CMY）をすべて重ねたとき、理論上どうなるか。","c":["白になる","黒（に近い色）になる","変化しない","透明になる"],"a":1,"e":"減法混色は重ねるほど暗くなる。実際のインクでは完全な黒にならないため、印刷では黒（K）を加える。"},{"q":"色相環でほぼ隣り合う色どうしを組み合わせた配色を何というか。","c":["類似色相配色","補色配色","無彩色配色","分裂補色配色"],"a":0,"e":"類似色相配色。まとまりのある穏やかな印象になる。対比を強めたいときは補色を使う。"},{"q":"レイヤーの合成モード「乗算」を適用したときの一般的な効果はどれか。","c":["全体が暗くなり、影を重ねる表現に向く","全体が明るくなり、光を足す表現に向く","色相だけが入れ替わる","解像度が上がる"],"a":0,"e":"乗算は色を掛け合わせるため暗くなる。明るくしたい場合はスクリーンや加算を使う。"},{"q":"印刷用のデータを作成する場合、一般に推奨される解像度に最も近いものはどれか。","c":["72dpi","150dpi","350dpi","1000dpi"],"a":2,"e":"商業印刷では原寸で350dpi程度が目 ,"a":0,"e":"頂点・稜線・面の3要素。2番目はNURBS、3番目はメタボール、4番目はソリッドモデリングの用語。"},{"q":"NURBSの説明として、最も適切なものはどれか。","c":["制御点に重みを設定でき、円や球などの2次曲線・曲面を厳密に表現できる","曲線が必ずすべての制御点を通過する","曲面を三角形の集合として近似的に表す手法である","空間中の濃度分布のしきい値によって形状を定義する"],"a":0,"e":"NURBS＝Non-Uniform Rational B-Spline。Rational（有理）＝制御点に重みをもつことが、円弧を厳密に表現できる理由。"},{"q":"粗いポリゴンメッシュを再帰的に分割し、滑らかな曲面を得る手法はどれか。","c":["メタボール","サブディビジョンサーフェス","スイープ","ブーリアン演算"],"a":1,"e":"サブディビジョンサーフェス。少ない制御メッシュで滑らかな曲面を扱えるため、キャラクター制作で広く使われる。"},{"q":"キャラクターモデリングで四角形ポリゴン（クワッド）主体の構成が推奨される理由はどれか。","c":["三角形より必ずデータ量が小さくなるため","変形時にメッシュが破綻しにくく、形状の流れに沿ったエッジループを作りやすいため","レンダラーが四角形ポリゴンしか処理できないため","UV展開の作業が不要になるため"],"a":1,"e":"四角形主体のトポロジーは変形に強く、エッジループを流れに沿わせやすい。データ量やUVの必要性とは関係しない。"},{"q":"ワイングラスのような回転対称の形状を、断面のカーブから作成する手法はどれか。","c":["回転体（ラース）","押し出し（エクストルード）","ロフト","ブーリアン演算"],"a":0,"e":"断面カーブを軸まわりに回転させて曲面を生成する。回転対称の器物に適する。"},{"q":"2つの立体の和・差・積によって新しい形状を作る演算はどれか。","c":["スイープ","ブーリアン演算","サブディビジョン","リトポロジー"],"a":1,"e":"ブーリアン演算（論理演算）。機械的な形状の作成に向くが、結果のトポロジーが乱れやすい点に注意。"},{"q":"メタボールの説明として、最も適切なものはどれか。","c":["制御点を通る曲線で輪郭を定義する","空間の濃度分布のしきい値を面として扱い、近づくと滑らかに融合する","三角形の集合で曲面を近似する","2次元画像から立体を推定する"],"a":1,"e":"メタボールは等値面で形状を定義するため、要素同士が近づくと自然に溶け合う。液体や有機的な形状に向く。"},{"q":"ハイポリゴンモデルのディテールをローポリゴンモデルに転写し、法線マップなどを作成する作業はどれか。","c":["ベイク（転写）","リトポロジー","スキニング","レンダリング"],"a":0,"e":"ベイク。高密度モデルの凹凸情報をテクスチャに焼き込むことで、軽いモデルでも精細に見せられる。"},{"q":"平面的な形状を一方向に押し出して立体を作る手法はどれか。","c":["押し出し（エクストルード）","回転体","メタボール","リトポロジー"],"a":0,"e":"エクストルード。文字や板状の形状、面の増設など幅広く使われる基本操作。"},{"q":"ポリゴンの表と裏を決定する情報はどれか。","c":["法線（ノーマル）の向き","UV座標","頂点カラー","マテリアルID"],"a":0,"e":"法線の向き。裏返っていると陰影がおかしくなったり、レンダリング時に面が消えたりする。"},{"q":"サブディビジョンサーフェスで、分割しても角のシャープさを保ちたい部分に行う処理として適切なものはどれか。","c":["エッジをクリース指定する、または近くにエッジを追加する","ポリゴンを三角形化する","法線を反転する","UVをリセットする"],"a":0,"e":"エッジを密にする（またはクリース値を与える）ことで、分割後もエッジが立つ。"},{"q":"スキャンなどで得られた高密度メッシュを、扱いやすい構造のポリゴンに整理し直す作業はどれか。","c":["リトポロジー","ベイク","スキニング","ブーリアン"],"a":0,"e":"リトポロジー。アニメーションやテクスチャ作業に適したトポロジーへ組み直す。"},{"q":"ベジェ曲線において、曲線の曲がり具合を調整するために用いられるものはどれか。","c":["制御点（ハンドル）","法線マップ","UV座標","ウェイト値"],"a":0,"e":"アンカーポイントから伸びるハンドルの向きと長さで曲率を調整する。"},{"q":"複数の断面形状を順に通過するように曲面を張る手法はどれか。","c":["ロフト（スキン）","回転体","押し出し","ブーリアン"],"a":0,"e":"ロフト。断面を並べて船体や翼のような滑らかに変化する形状を作る。"},{"q":"断面形状を、指定したパスに沿って移動させて立体を作る手法はどれか。","c":["スイープ","回転体","メタボール","リトポロジー"],"a":0,"e":"スイープ。パイプや手すりのような、経路に沿った形状の作成に向く。"},{"q":"ポリゴン数を増やしたときに一般に起こることとして、最も適切なものはどれか。","c":["形状は精細になるが、データ量と処理負荷が増える","形状は粗くなるが、処理は軽くなる","データ量は変わらない","テクスチャが不要になる"],"a":0,"e":"精細さと処理負荷はトレードオフ。用途に応じた適切な密度を選ぶことが重要。"},{"q":"キャラクターの関節や表情筋の周囲で、変形の流れに沿って輪状にエッジを配置したものはどれか。","c":["エッジループ","シーム","クリース","ピボット"],"a":0,"e":"エッジループ。変形の方向に沿わせることで、曲げたときに自然な形を保てる。"},{"q":"5角形以上のポリゴン（n-gon）が敬遠される理由として、最も適切なものはどれか。","c":["分割のされ方が不定で、変形やレンダリングで意図しない結果になりやすい","データ量が必ず大きくなる","色が付けられない","UV展開ができない"],"a":0,"e":"n-gonは内部で三角形に分割されるが、その分かれ方が保証されないため破綻の原因になる。"},{"q":"ソリッドモデルの説明として、最も適切なものはどれか。","c":["物体の内部が詰まっているものとして扱い、体積や質量を持つ","表面のみを面の集合として扱う","線分だけで形状を表す","画素の集合として形状を表す"],"a":0,"e":"ソリッドは中身のある立体。表面だけを扱うのがサーフェスモデル。CADで多く使われる。"},{"q":"レンダリングやゲームエンジンへの出力時に、四角形ポリゴンが三角形に分割される処理を何というか。","c":["トライアンギュレーション（三角形分割）","リトポロジー","テッセレーション制御","ベイク"],"a":0,"e":"最終的に描画されるのは三角形。分割のされ方によって陰影が変わることがある。"},{"q":"カメラからの距離に応じて、表示するモデルの精細さを切り替える仕組みはどれか。","c":["LOD（Level of Detail）","AO","IK","GI"],"a":0,"e":"遠くの物体には低ポリゴンのモデルを使うことで、見た目を保ちながら処理を軽くする。"},{"q":"左右対称のキャラクターをモデリングするとき、作業を効率化する機能はどれか。","c":["ミラー（対称）モデリング","ブーリアン演算","メタボール","LOD"],"a":0,"e":"片側だけ作れば反対側が自動生成される。最後に統合し、非対称な要素を加えるのが一般的。"},{"q":"球・立方体・円柱など、モデリングの出発点となる基本形状を何というか。","c":["プリミティブ","プロキシ","デカール","アトラス"],"a":0,"e":"プリミティブ。これらを変形・組み合わせて複雑な形状を作っていく。"},{"q":"重なっている複数の頂点を1つにまとめる操作はどれか。","c":["マージ（結合）","エクストルード","ベベル","スムーズ"],"a":0,"e":"頂点が分離したままだと、面がつながっておらず陰影や変形が破綻する原因になる。"},{"q":"粘土をこねるような感覚で、ブラシを使って形状を作り込む手法はどれか。","c":["スカルプトモデリング","ブーリアンモデリング","NURBSモデリング","プロシージャルモデリング"],"a":0,"e":"スカルプト。有機的な形状やしわ・筋肉のディテール表現に適する。"},{"q":"多数の写真から立体形状とテクスチャを復元する技術はどれか。","c":["フォトグラメトリ","レイトレーシング","リターゲティング","キーイング"],"a":0,"e":"フォトグラメトリ。実在の物体や地形を高精度に取り込めるが、そのままでは高密度で扱いにくい。"},{"q":"モデルを線だけで表示し、内部構造や面の分割を確認する表示方法はどれか。","c":[" かく分割されたメッシュとレンダリングコストが必要。"},{"q":"UV展開の際に、モデルを平面に開くために入れる切れ目はどれか。","c":["シーム","クリース","エッジループ","ケージ"],"a":0,"e":"シーム（縫い目）。目立たない位置に置くことで、テクスチャの継ぎ目が気になりにくくなる。"},{"q":"ノーマルマップの説明として、最も適切なものはどれか。","c":["RGB各成分に法線ベクトルの向きを記録し、細かな凹凸の陰影を表現する","グレースケールで高さを記録し、実際に形状を変位させる","不透明度を記録する","反射の強さのみを記録する"],"a":0,"e":"ノーマルマップは法線方向をカラー情報として保持する。バンプマップより方向の情報量が多い。"},{"q":"ガラスや水の中で、光が媒質の境界で進行方向を変える現象はどれか。","c":["屈折","回折","散乱","減衰"],"a":0,"e":"屈折。屈折率の設定により、ガラスや水の見え方が大きく変わる。"},{"q":"テクスチャを縮小表示したときのちらつきを防ぐため、あらかじめ段階的な縮小画像を用意しておく仕組みはどれか。","c":["ミップマップ","シームレステクスチャ","アトラス","デカール"],"a":0,"e":"ミップマップ。距離に応じて適切な解像度の画像を使うことで、遠景のちらつきを抑え処理も軽くなる。"},{"q":"スペキュラマップ（反射強度マップ）の役割として、最も適切なものはどれか。","c":["場所ごとに鏡面反射の強さを変え、濡れた部分や擦れた部分を描き分ける","場所ごとに透明度を変える","場所ごとに法線の向きを変える","場所ごとにポリゴン数を変える"],"a":0,"e":"1つのマテリアルの中で光沢の分布を変えることで、単調さがなくなり質感が豊かになる。"},{"q":"テクスチャ画像の解像度が512×512や1024×1024のように2のべき乗で作られることが多い理由はどれか。","c":["ミップマップの生成やGPUでの処理効率が良いため","色数が増えるため","ファイル形式が限定されるため","UV展開が不要になるため"],"a":0,"e":"2のべき乗サイズは縮小画像を段階的に作りやすく、リアルタイム描画で有利になる。"},{"q":"ライトマップをベイクする場合に、UVが重なっていると起こる問題はどれか。","c":["重なった箇所に同じ陰影が焼き込まれ、正しい影にならない","テクスチャの色数が減る","ポリゴン数が増える","法線が反転する"],"a":0,"e":"ベイク用のUVは重なりのないレイアウトが必要。色テクスチャと別UVを用意することが多い。"},{"q":"画像を用いず、計算式によって模様を生成するテクスチャはどれか。","c":["プロシージャルテクスチャ","ミップマップ","デカール","アトラス"],"a":0,"e":"プロシージャルテクスチャ。解像度に依存せず、パラメータで無限に模様を変えられる。"},{"q":"円筒形の物体にテクスチャを貼る際に適した投影方法はどれか。","c":["円筒投影（シリンドリカル）","平面投影","球投影","立方体投影"],"a":0,"e":"形状に近い投影方式を選ぶと歪みが少ない。缶やペットボトルなどは円筒投影が向く。"},{"q":"複数の小さなテクスチャを1枚の大きな画像にまとめたものはどれか。","c":["テクスチャアトラス","ミップマップ","ライトマップ","ノーマルマップ"],"a":0,"e":"アトラス化することでマテリアル数と描画呼び出しを減らせ、リアルタイム描画で有利になる。"},{"q":"PBR（物理ベースレンダリング）のマテリアル設定で、金属かどうかを指定するパラメータはどれか。","c":["メタリック","ラフネス","オパシティ","エミッシブ"],"a":0,"e":"メタリックで金属／非金属を、ラフネスで表面の粗さを指定するのがPBRの基本構成。"},{"q":"肌や大理石のように、光が表面下に入り込んで散乱してから出てくる現象を再現する表現はどれか。","c":["サブサーフェススキャタリング","アンビエントオクルージョン","コースティクス","異方性反射"],"a":0,"e":"サブサーフェススキャタリング（SSS）。これがないと肌がプラスチックのように見える。"},{"q":"モデル自体が光っているように見せるためのマテリアル設定はどれか。","c":["自己発光（エミッシブ）","ディスプレイスメント","オパシティ","アンビエントオクルージョン"],"a":0,"e":"エミッシブ。ネオンや画面の発光表現に使う。ただし設定だけでは周囲を照らさない場合がある。"},{"q":"ヘアラインの入った金属やCDの表面のように、一方向に伸びたハイライトが出る反射はどれか。","c":["異方性反射","拡散反射","全反射","再帰反射"],"a":0,"e":"異方性反射。表面の微細な溝の方向によって反射が伸びる。"},{"q":"物体の隙間や凹部の暗さをあらかじめ画像として焼き込んだテクスチャはどれか。","c":["AO（アンビエントオクルージョン）マップ","スペキュラマップ","アルファマップ","ミップマップ"],"a":0,"e":"AOマップ。毎回計算せずに接地感や陰影を加えられるため、リアルタイム描画で多用される。"},{"q":"モデルの表面に、汚れやマークを部分的に貼り付ける手法はどれか。","c":["デカール","ベイク","タイリング","マージ"],"a":0,"e":"デカール。ベースのテクスチャを描き直さずに、傷や刻印などを後から加えられる。"},{"q":"マテリアルとシェーダの関係として、最も適切なものはどれか。","c":["シェーダは表面の見え方を計算する仕組みで、マテリアルはそこに与えるパラメータの集まりである","マテリアルが計算を行い、シェーダはその設定値である","両者はまったく同じものである","シェーダはポリゴン数を決める"],"a":0,"e":"計算の仕組みがシェーダ、その具体的な設定がマテリアル、と整理すると分かりやすい。"},{"q":"広い壁に小さなレンガのテクスチャを敷き詰めたい。設定を変更すべき項目はどれか。","c":["タイリング（繰り返し）の倍率","法線の向き","ポリゴン数","レンダリング解像度"],"a":0,"e":"タイリング倍率でテクスチャの繰り返し回数を調整する。継ぎ目が目立たない画像を使うことが前提。"},{"q":"PBRのベースカラー（アルベド）テクスチャに、影やハイライトを描き込むべきでない理由はどれか。","c":["ライティングによる陰影と二重になり、どのような照明下でも不自然になるため","ファイルサイズが大きくなるため","UV展開ができなくなるため","色数が減るため"],"a":0,"e":"陰影はレンダリング時に計算される。ベースカラーは物体固有の色だけを持たせるのが原則。"},{"q":"一般的なノーマルマップが青紫がかった色をしている理由として、最も適切なものはどれか。","c":["凹凸のない平坦な部分では、法線が真上を向くことを示す色になるため","青系のインクが最も安価なため","圧縮率が高くなるため","人間の目が青に敏感なため"],"a":0,"e":"RGBが法線のXYZに対応し、平坦部はZ成分が最大となるため青紫色になる。"},{"q":"透明な物体に厚みのある質感を与えるために、屈折とあわせて設定すると効果的なものはどれか。","c":["吸収（濃度）による色付き","ポリゴン数","UVのタイリング","LODの段階数"],"a":0,"e":"厚みに応じて色が濃くなる設定を加えると、ガラスや液体の実在感が大きく増す。"},{"q":"同じ模様が繰り返される部分のUVを重ねて配置する利点として、最も適切なものはどれか。","c":["テクスチャ領域を節約でき、実質的な解像度を上げられる","ライトマップが正しく焼ける","法線が正しくなる","ポリゴン数が減る"],"a":0,"e":"色テクスチャでは有効な手法。ただしベイク用UVでは重なりが問題になるため使い分ける。"}],[{"q":"平行光源（ディレクショナルライト）の特徴として、最も適切なものはどれか。","c":["光源からの距離に応じて減衰し、裸電球の表現に適する","光線が平行に進み、距離による減衰がなく、太陽光の表現に適する","円錐状に照射され、コーン角で照射範囲を調整できる","シーン全体を一様に明るくするだけで、方向をもたない"],"a":1,"e":"平行光源は無限遠にあるとみなすため、位置ではなく「向き」だけが意味をもつ。他は順に点光源・スポットライト・環境光の説明。"},{"q":"3点照明において、被写体を背景から分離させ、輪郭を浮かび上がらせる役割をもつライトはどれか。","c":["キーライト","フィルライト","バックライト","アンビエントライト"],"a":2,"e":"バックライト（リムライト）は後方から当てて輪郭を光らせ、背景との分離をつくる。"},{"q":"フィルライトの主な役割として、最も適切なものはどれか。","c":["主光源として被写体の陰 "末端の位置を指定し、途中の関節角度を逆算する","頂点単位で形状を補間する","物理法則から動きを求める"],"a":0,"e":"FKは根元から末端へ。腕を振るような弧を描く動きに向く。末端を固定したいときはIKが有利。"},{"q":"アニメーションで、動作の前に逆方向へ少し動く「予備動作」を指す用語はどれか。","c":["アンティシペーション","フォロースルー","スクワッシュ＆ストレッチ","アークモーション"],"a":0,"e":"アンティシペーション（予備動作）。次に起こる動きを予感させ、動作に説得力を与える。"},{"q":"リップシンク（口の動きと音声の同期）で一般的に用いられる手法はどれか。","c":["音声に合わせて口の形のブレンドシェイプを切り替える","ボーンのIKで唇を引っ張る","パーティクルで口内を埋める","カメラをズームさせる"],"a":0,"e":"母音・子音に対応した口形状を用意し、タイミングを合わせて切り替えるのが基本。"},{"q":"あるキャラクターのモーションデータを、体格の異なる別のキャラクターに適用する作業はどれか。","c":["リターゲティング","ベイク","スキニング","レンダリング"],"a":0,"e":"モーションリターゲティング。骨の対応付けとスケールの補正を行い、既存のモーションを再利用する。"},{"q":"キーフレーム間の値の変化をカーブとして表示し、動きの緩急を細かく調整する画面はどれか。","c":["グラフエディタ（ファンクションカーブ）","UVエディタ","ノードエディタ","タイムコード表"],"a":0,"e":"カーブの傾きが速度に相当する。傾きを寝かせれば遅く、立てれば速くなる。"},{"q":"アニメーションの原則のうち、物体が押しつぶされたり伸びたりすることで質量と弾力を表現するものはどれか。","c":["スクワッシュ＆ストレッチ","アンティシペーション","フォロースルー","アピール"],"a":0,"e":"つぶれと伸びで柔らかさを表現する。変形しても体積が大きく変わらないようにするのが要点。"},{"q":"主要な動作が止まった後も、髪や衣服などが遅れて動き続ける表現を指す原則はどれか。","c":["フォロースルーとオーバーラッピングアクション","アンティシペーション","ステージング","ソリッドドローイング"],"a":0,"e":"すべてが同時に止まると機械的に見える。遅れと重なりが生きた動きをつくる。"},{"q":"人間や動物の自然な動きにおいて、手足の先端が描く軌跡の一般的な特徴はどれか。","c":["直線ではなく弧を描く","常に完全な直線になる","常にジグザグになる","静止したままである"],"a":0,"e":"アークの原則。関節で回転するため軌跡は弧になる。直線的な動きは不自然に見える。"},{"q":"アニメーションにおける「スペーシング」が主に決定するものはどれか。","c":["コマ間の移動量、すなわち動きの速さの変化","カットの尺","キャラクターの配置","色の設計"],"a":0,"e":"タイミングが全体の所要時間、スペーシングがその間の間隔配分。緩急はスペーシングで作る。"},{"q":"重要なポーズを先に置き、その間を後から埋めていく作り方を何というか。","c":["ポーズ・トゥ・ポーズ","ストレートアヘッド","リターゲティング","ベイク"],"a":0,"e":"構成を管理しやすく修正も容易。最初から順に描き進めるのがストレートアヘッド。"},{"q":"歩行や走行のように、一定区間を繰り返し再生できるように作られたアニメーションはどれか。","c":["ループアニメーション","プロシージャルアニメーション","ストップモーション","タイムラプス"],"a":0,"e":"最初と最後のポーズを一致させることで、繰り返し再生しても継ぎ目が分からなくなる。"},{"q":"崩れる箱や転がる岩など、変形しない物体の物理的な動きを計算するシミュレーションはどれか。","c":["剛体シミュレーション","流体シミュレーション","クロスシミュレーション","群集シミュレーション"],"a":0,"e":"剛体は形が変わらない前提で衝突と運動を解く。布は変形するのでクロスとして扱う。"},{"q":"水や煙の複雑な流れを計算によって生成する手法はどれか。","c":["流体シミュレーション","IK","モーフィング","リターゲティング"],"a":0,"e":"流体シミュレーション。解像度を上げるほど計算時間とメモリを大量に消費する。"},{"q":" に補間して階段状のギザギザを緩和する。"},{"q":"Zバッファ法の説明として、最も適切なものはどれか。","c":["画素ごとに奥行き値を保持し、視点に近い面を残す隠面消去法","光源から見た深度画像を作って影を判定する手法","拡散反射面の相互反射を解く手法","輪郭を中間色でならす処理"],"a":0,"e":"Zバッファ法は代表的な隠面消去アルゴリズム。リアルタイムCGでも広く使われる。"},{"q":"フォンシェーディングの説明として、最も適切なものはどれか。","c":["面ごとに一定の輝度を与える","頂点の輝度を面内で補間する","法線を補間し、ピクセルごとに輝度を計算する","陰影を数段階に区切る"],"a":2,"e":"フォンは法線を補間するためハイライトが滑らかに出る。頂点の輝度を補間するのがグーロー。"},{"q":"シャドウマッピングの説明として、最も適切なものはどれか。","c":["光源から見た深度情報を画像として保持し、影になる部分を判定する","影の部分だけを別レイヤーでレンダリングする","影の色をテクスチャとして描き込む","影を完全に無効化する"],"a":0,"e":"シャドウマップ。解像度が足りないと影の輪郭がギザつくため、解像度やバイアスの調整が必要になる。"},{"q":"トゥーンシェーディング（セルシェーディング）の目的として、最も適切なものはどれか。","c":["陰影を段階的に区切り、手描きアニメーションのような絵作りにする","光の物理的な挙動をより正確に再現する","ポリゴン数を削減する","被写界深度を表現する"],"a":0,"e":"階調を意図的に減らし、輪郭線を加えることでセル画調の見た目にする非写実的レンダリング。"},{"q":"フラットシェーディングの特徴として、最も適切なものはどれか。","c":["面ごとに一定の輝度になり、面の境界が目立つ","頂点の輝度を補間して滑らかに見せる","ピクセル単位で法線を補間する","陰影を2階調に区切る"],"a":0,"e":"フラットは面単位。ポリゴンの形がそのまま見えるため、ローポリ表現として意図的に使うこともある。"},{"q":"パストレーシングなどのレンダリングで、サンプリング数を増やすことで軽減できるものはどれか。","c":["画面全体に散る粒状のノイズ","テクスチャの解像度不足","法線の反転","UVの重なり"],"a":0,"e":"確率的に光線を飛ばすため、サンプル数が少ないとノイズが残る。時間とのトレードオフになる。"},{"q":"レンダリング結果の輝度を、ディスプレイの表示特性に合わせて補正する処理はどれか。","c":["ガンマ補正","アンチエイリアシング","ディザリング","キーイング"],"a":0,"e":"ガンマ補正。リニアな計算結果と表示装置の特性を合わせないと、中間調が暗すぎたり明るすぎたりする。"},{"q":"モーションブラーの効果として、最も適切なものはどれか。","c":["速く動く被写体に残像を与え、動きを滑らかに感じさせる","遠景をぼかして奥行きを表現する","輪郭のギザギザを消す","影を柔らかくする"],"a":0,"e":"モーションブラーは時間方向のぼけ。距離方向のぼけは被写界深度（デプスオブフィールド）。"},{"q":"隠面消去の目的として、最も適切なものはどれか。","c":["視点から見えない面を描画しないようにする","ポリゴン数を減らす","色数を減らす","影を柔らかくする"],"a":0,"e":"手前の物体に隠れる部分を正しく処理するための仕組み。代表的な手法がZバッファ法。"},{"q":"画面を水平の走査線ごとに処理していくレンダリング手法はどれか。","c":["スキャンライン法","レイトレーシング","ラジオシティ","フォトンマッピング"],"a":0,"e":"スキャンライン法。反射や屈折には弱いが高速で、かつてのCG映像で広く使われた。"},{"q":"完全拡散反射面を仮定し、光の入射角の余弦に比例して明るさが決まるシェーディングモデルはどれか。","c":["ランバートモデル","フォンモデル","ブリンモデル","トゥーンモデル"],"a":0,"e":"ランバート反射。視点によらず明るさが一定で、拡散反射成分の基本となる。"},{"q":"レンダリング時間に最も影響しにくい要素はどれか。","c":["ファイル名の長さ","出力解像度","サンプリング数","反射・屈折の計算回数"],"a":0,"e":"解像度・サンプル数・光の追跡回数はいずれも計算量に直結する。ファイル名は無関係。"},{"q":" ければならない","一度書き出すと修正できない","音声を扱えない"],"a":0,"e":"テープ時代のリニア編集と異なり、任意の位置を随時差し替えられる。現在の編集の標準。"},{"q":"画面を一定の形で区切りながら次のカットに切り替わる場面転換はどれか。","c":["ワイプ","ディゾルブ","カット","フェード"],"a":0,"e":"ワイプ。境界線が移動して画面を置き換える。時間や場所の転換を明示的に伝える。"},{"q":"画面が徐々に黒くなって消えていく処理はどれか。","c":["フェードアウト","ディゾルブ","ワイプ","キーイング"],"a":0,"e":"フェードは黒（または白）を経由する。場面や章の区切りを示すのに使われる。"},{"q":"動作の途中で別のカットに切り替え、動きの連続性でつなぐ編集技法はどれか。","c":["アクションつなぎ","ジャンプカット","ワイプ","ディゾルブ"],"a":0,"e":"動きが継続しているように見えるため、カットの切り替わりが自然に感じられる。"},{"q":"合成の「加算」ブレンドが特に適している表現はどれか。","c":["炎や光など、発光しているものを重ねる表現","影を落とす表現","輪郭を抜く表現","色を反転させる表現"],"a":0,"e":"加算は明るさを足し合わせるため、光の重なりの表現に向く。暗くしたい場合は乗算。"},{"q":"アルファチャンネルの扱いで、色情報にあらかじめアルファが乗算されている状態を何というか。","c":["プリマルチプライドアルファ","ストレートアルファ","インデックスカラー","クロマサブサンプリング"],"a":0,"e":"合成ソフト側で解釈を誤ると、輪郭に黒や白の縁が出る。素材の種類を正しく指定する必要がある。"},{"q":"クロマキー合成で、背景の緑色が被写体の髪や肩に反射して色かぶりする現象への対処はどれか。","c":["スピルサプレッション（色かぶり除去）","ミップマップ","トーンマッピング","リトポロジー"],"a":0,"e":"スピル（色かぶり）を抑える処理。これを行わないと合成後に緑の縁が残る。"},{"q":"クロマキー処理の前に、背景の余計な写り込みを大まかに切り取っておくマスクを何というか。","c":["ガベージマット","ライトマップ","ミップマップ","アトラス"],"a":0,"e":"ガベージマット。照明機材やスタジオの端など、キーイングでは抜けない部分をあらかじめ除去する。"},{"q":"インターレース方式とプログレッシブ方式の違いとして、最も適切なものはどれか。","c":["インターレースは1画面を2回の走査に分けて表示し、プログレッシブは一度に表示する","インターレースの方が常に解像度が高い","プログレッシブは音声を含まない","両者に違いはない"],"a":0,"e":"インターレースは走査線を飛び越して表示する方式。静止画として取り出すと櫛状の乱れが出る。"},{"q":"非可逆圧縮のコーデックを用いた場合に起こることはどれか。","c":["データ量は小さくなるが、元の情報が完全には復元できない","データ量が大きくなる","画質が必ず向上する","音声が失われる"],"a":0,"e":"非可逆は情報を捨てて圧縮する。編集を繰り返すほど劣化が蓄積するため、中間素材には向かない。"},{"q":"3DCGの出力を、動画ファイルではなく連番の静止画で書き出すことが多い理由はどれか。","c":["途中で中断しても再開でき、特定のフレームだけ差し替えられるため","ファイルサイズが必ず小さくなるため","音声を含められるため","再生が滑らかになるため"],"a":0,"e":"長時間のレンダリングでは、途中の失敗が致命傷になる。連番なら部分的な再レンダリングで済む。"},{"q":"カラーコレクションとカラーグレーディングの違いとして、最も適切なものはどれか。","c":["コレクションは素材の色を適正に整える作業、グレーディングは作品の印象を作る作業","コレクションは印象作り、グレーディングは補正作業","両者は同じ作業を指す","グレーディングは音声処理を指す"],"a":0,"e":"まず素材を揃え（コレクション）、その上で意図した色を作る（グレーディング）という順序になる。"},{"q":"映像に文字情報を重ねて表示する要素を一般に何というか。","c":["テロップ","マット","キーフレーム","コーデック"],"a":0,"e":"テロップ。可読性を確保するため、背景とのコントラストや表示時間の設計が必要になる。"},{"q":"動画のビットレートを上げた場合に起こることとして、最も適切なものはどれか。","c":["画質が向上する一方でファイルサイズが大きくなる","解像度が自動的に上がる","フレームレートが上がる","色空間が変わる"],"a":0,"e":"ビットレートは単位時間あたりのデータ量。配信では画質とサイズのバランスを取る必要がある。"},{"q":"4K（UHD）の画素数として一般的なものはどれか。","c":["1920×1080","2560×1440","3840×2160","7680×4320"],"a":2,"e":"3840×2160がUHDの4K。フルHDの縦横それぞれ2倍、画素数では4倍にあたる。"},{"q":"30fpsの映像で8秒のカットは何フレームか。","c":["120フレーム","180フレーム","240フレーム","300フレーム"],"a":2,"e":"30×8＝240フレーム。編集やレンダリングの見積もりで必要になる基本計算。"},{"q":"合成作業を後から調整しやすくするための考え方として、最も適切なものはどれか。","c":["調整可能なパラメータとして処理を重ね、素材そのものは書き換えない","処理のたびに素材を上書き保存する","中間データをすべて削除する","1枚の画像に統合してから作業する"],"a":0,"e":"非破壊的な作業。修正指示が入る前提の制作では、後戻りできる構成にしておくことが重要。"},{"q":"実写映像にCGを合成する際、なじませるために行う処理として適切でないものはどれか。","c":["CG素材の解像度だけを極端に上げる","実写素材のノイズ（グレイン）をCGにも加える","実写のカメラの被写界深度に合わせてぼかす","実写の色調に合わせて色を調整する"],"a":0,"e":"CGだけが鮮明すぎると浮いて見える。むしろ実写側の欠点に合わせにいくのがなじませる要点。"}],[{"q":"著作者人格権に含まれないものはどれか。","c":["公表権","氏名表示権","同一性保持権","複製権"],"a":3,"e":"複製権は著作権（財産権）に属する。著作者人格権は公表権・氏名表示権・同一性保持権の3つ。"},{"q":"著作者人格権の性質として正しいものはどれか。","c":["著作者の一身に専属し、他人に譲渡することができない","契約により自由に譲渡することができる","著作権（財産権）を譲渡すると必ず一緒に移転する","法人には一切認められない"],"a":0,"e":"著作者人格権は一身専属権で譲渡・相続の対象にならない。実務では「著作者人格権を行使しない」旨を契約に定めることが多い。"},{"q":"街頭で撮影した写真に通行人の顔がはっきり写り込んでいた。本人の許可なくWebで公開した場合、主に問題となる権利はどれか。","c":["著作権","肖像権","特許権","商標権"],"a":1,"e":"肖像権。有名人の顧客吸引力が問題になる場合はパブリシティ権が関わる。"},{"q":"産業財産権（工業所有権）に含まれないものはどれか。","c":["特許権","実用新案権","意匠権","著作権"],"a":3,"e":"産業財産権は特許権・実用新案権・意匠権・商標権の4つ。著作権は登録なしで発生する点も異なる。"},{"q":"著作権（財産権）に含まれるものはどれか。","c":["公表権","氏名表示権","同一性保持権","公衆送信権"],"a":3,"e":"公衆送信権は財産権の一つ。他の3つは著作者人格権にあたる。"},{"q":"日本において、著作物の保護期間は原則としてどれか。","c":["著作者の死後50年","著作者の死後70年","公表から10年","登録から20年"],"a":1,"e":"2018年の改正により、原則として著作者の死後70年に延長された。"},{"q":"会社の従業員が職務上作成した著作物について、一定の要件を満たす場合に著作者となるのは誰か。","c":["作成した従業員個人","法人等（会社）","発注元の顧客","著作権登録を行った者"],"a":1,"e":"職務著作（法人著作）。就業規則や契約で別段の定めがない場合、法人が著作者となる。"},{"q":"適法な「引用」と認められるための要件として、当てはまらないものはどれか。","c":["公表された著作物であること","引用部分が従で、自分の表現が主であること","出所を明示すること","著作権者から事前に許諾を得ること"],"a":3,"e":"引用は要件を満たせば許諾なしに行える。許諾が必要なら、それはもはや引用ではなく利用許諾。"},{"q":"既存のアニメキャラクターを無断で描いてグッズとして販売した場合、侵害するおそれが高い権利はどれか。","c":["著作権（複製権・翻案権など）","特許権","実用新案権","肖像権"],"a":0,"e":"キャラクターの絵柄は著作物として保護される。商品化には権利者の許諾が必要。"},{"q":"パブリシティ権の説明として、最も適切なものはどれか。","c":["著名人の氏名や肖像がもつ顧客吸引力を、排他的に利用できる権利","発明を独占的に実施できる権利","商品の目印を独占できる権利","作品の改変を拒める権利"],"a":0,"e":"パブリシティ権は経済的価値に着目した権利。一般人の私生活上の利益を守る肖像権とは観点が異なる。"},{"q":"「フリー素材」と表示された画像を作品に使う際、最初に確認すべきものはどれか。","c":["利用規約（ライセンス）で許される範囲","ファイルサイズ","画像の解像度","保存形式"],"a":0,"e":"無料でも商用利用不可・改変不可・クレジット表記必須など条件はさまざま。規約の確認が最優先。"},{"q":"商標権が保護の対象とするものはどれか。","c":["商品やサービスを識別するためのマークや名称","物品のデザイン","発明された技術","小説や音楽などの表現"],"a":0,"e":"商標は出所表示のための標識。物品のデザインは意匠権、技術的発明は特許権が守る。"},{"q":"著作権法における著作物の定義として、最も適切なものはどれか。","c":["思想または感情を創作的に表現したもの","販売されているすべての商品","登録されたすべての作品","公表されたすべての情報"],"a":0,"e":"創作的な表現であることが要件。単なるデータや事実の羅列は著作物にあたらない。"},{"q":"日本において著作権が発生する時点として正しいものはどれか。","c":["著作物を創作した時点で自動的に発生する","文化庁に登録した時点","公表した時点","販売した時点"],"a":0,"e":"無方式主義。登録や表示がなくても、創作した瞬間に権利が発生する。"},{"q":"著作権法の保護対象について、正しいものはどれか。","c":["表現されたものが保護され、アイデアそのものは保護されない","アイデアも表現も等しく保護される","アイデアのみが保護される","題名だけが保護される"],"a":0,"e":"アイデア・表現二分論。同じ着想からでも、異なる表現であれば別の著作物となる。"},{"q":"私的使用のための複製として認められる可能性が高いものはどれか。","c":["購入した音楽CDを自分のスマートフォンに取り込んで聴く","購入したCDの音源をSNSに投稿する","購入したCDをコピーして販売する","購入したCDの音源を店舗のBGMとして流す"],"a":0,"e":"個人的または家庭内での使用に限られる。公衆への提供や業務利用は範囲外。"},{"q":"既存の小説を原作としてアニメーション映像を制作する場合に関わる権利はどれか。","c":["翻案権（二次的著作物の創作に関する権利）","商標権","意匠権","実用新案権"],"a":0,"e":"原作を翻案するには許諾が必要。完成した映像は二次的著作物となり、原作者の権利も及ぶ。"},{"q":"著作隣接権が認められる者として適切なものはどれか。","c":["実演家やレコード製作者","作品を購入した消費者","作品を批評した評論家","作品を保管した図書館"],"a":0,"e":"著作物を伝達する立場の者に認められる権利。実演家・レコード製作者・放送事業者などが該当する。"},{"q":"市販の音楽CDの音源を、そのまま自主制作映像のBGMとして使用し公開する場合について、正しいものはどれか。","c":["作詞作曲者の著作権と、実演家やレコード製作者の著作隣接権の双方が関係する","著作権のみが関係する","著作隣接権のみが関係する","権利は一切関係しない"],"a":0,"e":"楽曲そのものの権利と、その録音物の権利は別。市販音源を使うには双方の処理が必要になる。"},{"q":"作品に使用するフォントについて、確認すべきこととして最も適切なものはどれか。","c":["商用利用や映像への埋め込みが許諾されているかライセンスを確認する","ファイルサイズを確認する","文字数を確認する","解像度を確認する"],"a":0,"e":"フォントは利用許諾契約に基づいて使うもの。用途によっては別途ライセンスが必要になる。"},{"q":"意匠権が保護の対象とするものはどれか。","c":["物品の形状や模様など、視覚を通じて美感を起こさせるデザイン","技術的な発明","商品やサービスの目印","小説や音楽などの表現"],"a":0,"e":"意匠権は工業的なデザインを保護する。産業財産権の一つで、特許庁への出願・登録が必要。"},{"q":"実用新案権が対象とするものとして、最も適切なものはどれか。","c":["物品の形状や構造に関する考案","文学作品","商品の目印","著名人の肖像"],"a":0,"e":"物品の形状・構造・組合せに関する考案が対象。特許より小規模な技術的アイデアを保護する。"},{"q":"日本における特許権の存続期間として正しいものはどれか。","c":["出願から20年","登録から5年","著作者の死後70年","無期限"],"a":0,"e":"原則として出願日から20年。著作権と異なり、出願・審査・登録の手続きが必要になる。"},{"q":"他社の著名な商品表示に似せた表示を用いて混同を生じさせる行為を規制する法律はどれか。","c":["不正競争防止法","著作権法","労働基準法","個人情報保護法"],"a":0,"e":"不正競争防止法。商標登録がない表示でも、著名性や周知性があれば保護されうる。"},{"q":"クリエイティブ・コモンズの「表示（CC BY）」ライセンスで求められることはどれか。","c":["著作者の氏名などクレジットを表示すること","改変を一切行わないこと","商用利用を行わないこと","同一のライセンスで公開すること"],"a":0,"e":"CC BYはクレジット表示のみを条件とする。NC（非営利）やND（改変禁止）は別の条件。"},{"q":"街頭で撮影した映像に、看板の絵柄が背景としてわずかに写り込んでいた。これについての考え方として最も適切なものはどれか。","c":["付随的に写り込んだもので、正当な範囲内であれば利用が認められる場合がある","いかなる場合も必ず権利侵害となる","撮影自体が禁止されている","権利は一切関係しない"],"a":0,"e":"いわゆる写り込み（付随対象著作物の利用）の規定。ただし主題として大きく扱えば範囲を超える。"},{"q":"屋外に恒常的に設置された彫刻を撮影して作品に使用する場合の一般的な扱いとして、適切なものはどれか。","c":["原則として利用できるが、複製物の販売など一部の利用は制限される","いかなる利用も自由である","いかなる利用も禁止されている","撮影のみ禁止されている"],"a":0,"e":"公開の美術の著作物には利用の例外規定があるが、彫刻の複製物を販売する行為などは対象外。"},{"q":"学校の授業で他人の著作物を複製して配布する場合の説明として、最も適切なものはどれか。","c":["必要な限度など一定の条件を満たす場合に、例外として認められることがある","いかなる場合も自由に利用できる","いかなる場合も必ず許諾が必要である","著作権法の対象外である"],"a":0,"e":"教育目的の例外規定はあるが無制限ではない。部数や範囲、権利者の利益を害しないことが前提。"},{"q":"業務委託でCG作品の制作を依頼された場合、著作権の帰属について正しいものはどれか。","c":["原則として制作者に帰属するため、譲渡する場合は契約で明確に定める必要がある","自動的に発注者に帰属する","著作権は発生しない","納品と同時に消滅する"],"a":0,"e":"従業員の職務著作と異なり、外部委託では原則として制作者側に権利が残る。契約での取り決めが必須。"},{"q":"商標権を取得するために必要なこととして、正しいものはどれか。","c":["特許庁に出願し、審査を経て登録を受ける","使用を開始すれば自動的に取得できる","著作物として公表する","文化庁に届け出る"],"a":0,"e":"商標は登録主義。使っているだけでは権利にならず、出願・登録の手続きが必要になる。"}]],en:[[{"a":1,"q":"After the concept and script are settled, which document lays out the shot breakdown, framing, camera work, dialogue and timing in pictures and text, serving as the blueprint for the whole production?","c":["Model sheet (three-view drawing)","Storyboard","Color script","Shooting schedule"],"e":"The storyboard（絵コンテ）is the blueprint of the film. A three-view drawing is modeling reference, a color script plans the overall tone, and a shooting schedule manages production order."},{"a":0,"q":"Which process lays storyboard panels out on a timeline with temporary audio so that pacing and duration can be checked in advance?","c":["Animatics (video storyboard)","Layout","Rushes screening","Conform"],"e":"Animatics（アニマティクス）give the storyboard a time axis, so timing problems surface before the expensive production stage begins."},{"a":3,"q":"Which of the following is NOT part of pre-production?","c":["Character design","Storyboarding","Budget and schedule planning","Color grading"],"e":"Color grading（カラーグレーディング）belongs to post-production. The other three are all pre-production tasks."},{"a":0,"q":"Which is the most appropriate order for a typical 3DCG character animation pipeline?","c":["Modeling → setup (rigging) → animation → rendering → compositing and editing","Modeling → rendering → animation → compositing → setup","Animation → modeling → setup → compositing → rendering","Setup → modeling → compositing → animation → rendering"],"e":"Remember it as: build it, prepare it to move, move it, turn it into images, then finish it."},{"a":1,"q":"Which process adds bones and control objects to a finished model so that it can be animated?","c":["Modeling","Setup (rigging)","Layout","Compositing"],"e":"Setup / rigging（セットアップ・リギング）builds controls that animators can use. It does not create the motion itself."},{"a":2,"q":"Which of the following is NOT part of production?","c":["Modeling","Lighting","Script writing","Animation"],"e":"Script writing（シナリオ執筆）is pre-production. Production is the stage where the actual assets and shots are made."},{"a":1,"q":"Which task joins rendered shots together and determines the pacing and length of the film?","c":["Rendering","Editing","Modeling","Rigging"],"e":"Editing（編集）. With non-linear editing the order and length of clips can be rearranged any number of times."},{"a":1,"q":"Which drawing shows a character from the front, side and back, and serves as reference for modeling?","c":["Storyboard","Model sheet (three-view drawing)","Shooting schedule","Color script"],"e":"The three-view model sheet（三面図）gives the modeler an accurate basis for building the form."},{"a":0,"q":"Which process places characters and sets in 3D space based on the storyboard, and fixes the camera angle?","c":["Layout","Rigging","Compositing","Grading"],"e":"Layout（レイアウト）establishes framing and camera in 3D. It bridges the storyboard and animation."},{"a":0,"q":"What is the main purpose of a shooting schedule (kouban-hyou)?","c":["To organize which elements are needed when, and manage production order","To design the color scheme of the finished film","To specify the dimensions of models","To decide the structure of the music"],"e":"The shooting schedule（香盤表）is a management table listing who needs what, and when."},{"a":2,"q":"Which of the following belongs to post-production?","c":["Modeling","Storyboarding","Compositing","Character design"],"e":"Compositing, editing, grading and audio finishing are post-production（ポストプロダクション）."},{"a":1,"q":"Which general-purpose interchange format is commonly used to pass geometry and animation between applications?","c":["JPEG","FBX","MP3","CSV"],"e":"FBX is a standard 3D interchange format. Depending on the task, Alembic or USD may also be used."},{"a":0,"q":"What is the greatest benefit of investing time in pre-production?","c":["Fixing the target image and the plan in advance, preventing large reworks later","Shortening render times","Reducing polygon counts","Reducing the number of performers"],"e":"The cost of rework rises sharply as production advances. Settling the design early is the essence of pre-production."},{"a":0,"q":"What does a script primarily define?","c":["The flow of the story, the characters and the dialogue","The lens and aperture for each shot","The polygon count of the models","The renderer settings"],"e":"The script（シナリオ）is the story blueprint. How it is shown visually is worked out from the storyboard onward."},{"a":0,"q":"Which document plans the color mood of each scene as a chronological series of small images?","c":["Color script","Three-view drawing","Shooting schedule","Model sheet"],"e":"The color script（カラースクリプト）designs the emotional arc of the film through color and unifies the overall tone."},{"a":0,"q":"Which artwork is produced at the planning stage to explore the look of the world and characters?","c":["Concept art","Rendered image","Wireframe diagram","UV map"],"e":"Concept art（コンセプトアート）aligns everyone's mental image of the finished work and secures agreement on direction."},{"a":0,"q":"What is the purpose of previsualization (previs)?","c":["To test camera work and staging in rough 3D and decide how the real shoot will be organized","To output the final-quality film","To decide texture resolution","To compose the music"],"e":"Quality does not matter; framing, camera work and timing are verified first. Previs（プレビズ）is widely used in live-action VFX as well."},{"a":0,"q":"What is the name for a screening where work in progress is reviewed by the team to identify problems?","c":["Rushes (review screening)","Conform","Bake","Retargeting"],"e":"Rushes（ラッシュ）. Sharing problems early avoids large-scale rebuilds later."},{"a":2,"q":"How many frames are needed for a five-second shot at 24 fps?","c":["24 frames","48 frames","120 frames","240 frames"],"e":"24 × 5 = 120 frames. Converting between duration and frame count is a basic production skill."},{"a":0,"q":"When several people share 3DCG work, what matters most when handing data between them?","c":["Using a common convention for file names and folder structure","Letting each person use their preferred unit system","Always overwriting the same file","Not making backups"],"e":"Consistent naming and folder structure（命名規則）is the precondition for division of labour. It prevents lost and mismatched files."},{"a":0,"q":"Why are working files saved with dates or sequential numbers?","c":["So that you can return to an earlier state when something goes wrong","To speed up rendering","To reduce polygon count","To convert the color space"],"e":"Basic version control. If you only ever overwrite, you cannot go back to the point before the file broke."},{"a":0,"q":"What is the system called in which many computers share the rendering workload?","c":["Render farm","Texture atlas","Particle system","Non-linear editing"],"e":"A render farm（レンダーファーム）distributes frames across machines so that long films can be finished in a realistic time."},{"a":0,"q":"In production management, what is the term for a target set at each major checkpoint?","c":["Milestone","Timecode","Frame rate","Render pass"],"e":"Milestones（マイルストーン）let you check progress at fixed points and detect delays early."},{"a":0,"q":"What is the role of the director?","c":["To make the decisions about the content and expression of the work","To raise the budget and manage contracts","To optimize the polygon count of models","To maintain the render servers"],"e":"The director（ディレクター・監督）holds final responsibility for content. Budget and schedule are the producer's domain."},{"a":0,"q":"What is the relationship between a storyboard and layout?","c":["Layout realizes, in actual 3D space, the framing decided in the storyboard","The storyboard is drawn after the layout","They are entirely unrelated processes","Layout is created after editing"],"e":"The storyboard is a 2D design; layout（レイアウト）is the process of making it work in three dimensions."},{"a":0,"q":"Why is a low-resolution test render made before the final render?","c":["To find problems with framing and lighting before spending a long time on output","To use it as the final delivered file","To increase polygon count","To check the audio"],"e":"High-quality rendering is slow. Checking at low resolution and low sample counts first is standard practice."},{"a":0,"q":"Which statement best describes the relationship between quality, cost and schedule in film production?","c":["The three are in a trade-off; prioritizing one affects the others","The three are independent and do not affect each other","Shortening the schedule always improves quality","Reducing cost always shortens the schedule"],"e":"A fundamental idea in production management: within fixed constraints, you must decide where to put the emphasis."},{"a":0,"q":"Which reference material is created so that a character's expressions and mouth shapes stay consistent across the whole production?","c":["Model sheet (character reference)","Timecode sheet","Render log","UV layout"],"e":"A shared reference（設定資料）keeps the character recognizable even when many artists work on it."},{"a":0,"q":"Which process finishes the sound of a film by balancing dialogue, effects and music?","c":["Audio mixing (MA)","Layout","Rigging","Bake"],"e":"Part of post-production. Sound is finalized once the picture is locked."},{"a":0,"q":"What is the term for redoing work in response to revision notes?","c":["Retake","Retopology","Retargeting","Rendering"],"e":"Retake（リテイク）. Confirming the intent of the notes and judging how far to go back is what keeps the workload under control."}],[{"a":0,"q":"Which combination is correct for the three primary colors of light (additive mixing)?","c":["R (red), G (green), B (blue)","C (cyan), M (magenta), Y (yellow)","R (red), Y (yellow), B (blue)","C (cyan), M (magenta), K (black)"],"e":"RGB is additive（加法混色）: the more you mix, the brighter it gets, and all three give white. CMY are the primaries of colorants and mix subtractively."},{"a":0,"q":"Which combination is correct for the three attributes of color?","c":["Hue, value (lightness), saturation","Hue, luminance, transparency","Value, saturation, luminous intensity","Color temperature, value, saturation"],"e":"Hue, value and saturation（色相・明度・彩度）. The HSV color model corresponds to these three attributes."},{"a":1,"q":"An RGB image is 1920 × 1080 pixels with 8 bits per channel. Which value is closest to its uncompressed data size?","c":["About 2 MB","About 6 MB","About 24 MB","About 50 MB"],"e":"1920 × 1080 × 3 channels × 1 byte ≈ 6,220,800 bytes ≈ 6 MB. The key point is that 8 bits equals 1 byte."},{"a":2,"q":"Which statement about raster (bitmap) and vector images is most appropriate?","c":["Vector images show jagged edges when enlarged","Raster images are resolution-independent and do not degrade when enlarged","Vector images describe points, lines and areas with numbers and equations, so edges stay smooth when enlarged","Raster images suit logos and icons, while vector images suit photographs"],"e":"Vector（ベクタ）is resolution-independent and suits logos; raster（ラスタ）is a grid of pixels and suits photographs. The other options state the reverse."},{"a":1,"q":"Which combination is correct for the three primary colors of colorants (subtractive mixing)?","c":["R, G, B","C, M, Y","R, Y, B","H, S, V"],"e":"Cyan, magenta and yellow. Mixing makes them darker, and printing adds black (K) to give CMYK."},{"a":1,"q":"Which statement correctly describes complementary colors?","c":["Colors that sit next to each other on the color wheel","Colors that sit roughly opposite each other on the color wheel","Colors with the same value","Colors with zero saturation"],"e":"Complementary colors（補色）sit opposite on the wheel. Placed together they intensify each other; mixed, they lose saturation and approach neutral."},{"a":0,"q":"What do the units dpi and ppi express?","c":["The number of pixels (dots) per inch","The total number of pixels in the image","The number of bits per pixel","The number of refreshes per second"],"e":"They express density per inch. With the same pixel count, changing dpi changes the physical printed size."},{"a":1,"q":"Which statement about JPEG and PNG is most appropriate?","c":["JPEG uses lossless compression and supports transparency","JPEG uses lossy compression and suits photographs; PNG uses lossless compression and supports transparency","PNG is lossy, so repeated saving degrades it","Both are lossy and differ only in the number of colors"],"e":"JPEG is lossy with no alpha. PNG is lossless and can carry an alpha channel."},{"a":0,"q":"What does the H in the HSV color model represent?","c":["Hue","Value (lightness)","Saturation","Opacity"],"e":"H = hue, S = saturation, V = value."},{"a":0,"q":"Which kind of color tends to appear closer and larger, even at the same physical size?","c":["A warm color with high value and high saturation","A dark cool color","A neutral gray","Fully desaturated black"],"e":"Advancing and expanding colors（進出色・膨張色）. Bright, vivid warm colors come forward; dark cool colors recede."},{"a":0,"q":"Which statement best describes sRGB?","c":["A color space used as the standard for general displays and the web","A standard for printing inks only","A video compression format","A unit of resolution"],"e":"sRGB is the standard color space. Wider gamuts such as Adobe RGB or Rec.2020 are used when a larger range is needed."},{"a":1,"q":"You need to export a still image while preserving the alpha channel. Which format is most appropriate?","c":["JPEG","PNG","BMP (24-bit)","MP4"],"e":"PNG is lossless and can hold an alpha channel. JPEG and 24-bit BMP cannot carry transparency."},{"a":0,"q":"Which colors are classified as achromatic?","c":["White, gray and black","Red, blue and yellow","Cyan and magenta","Skin tone and sky blue"],"e":"Achromatic colors（無彩色）have zero saturation and no hue. They differ only in value."},{"a":2,"q":"How many colors can a full-color image with 8 bits per channel and three RGB channels represent?","c":["About 256","About 65,000","About 16.77 million","About 4.2 billion"],"e":"256 cubed = 16,777,216 colors, known as 24-bit full color."},{"a":2,"q":"How many levels can an 8-bit grayscale image represent?","c":["16 levels","64 levels","256 levels","1024 levels"],"e":"2 to the 8th power = 256 levels, with 0 as black and 255 as white."},{"a":1,"q":"What is the maximum number of colors a GIF file can hold at one time?","c":["16","256","65,536","About 16.77 million"],"e":"GIF uses indexed color with up to 256 colors. It suits flat graphics and simple animation rather than photographs."},{"a":0,"q":"Which unit is used to express color temperature?","c":["Kelvin (K)","Lux (lx)","Hertz (Hz)","Decibel (dB)"],"e":"Kelvin. Lower values look redder; higher values look bluish white."},{"a":1,"q":"In theory, what happens when all three subtractive primaries (CMY) are overlaid?","c":["It becomes white","It becomes black, or close to it","Nothing changes","It becomes transparent"],"e":"Subtractive mixing gets darker as layers are added. Real inks never reach true black, so printing adds a black (K) plate."},{"a":0,"q":"What is the name for a color scheme built from hues that sit next to each other on the color wheel?","c":["Analogous color scheme","Complementary color scheme","Achromatic scheme","Split complementary scheme"],"e":"An analogous scheme（類似色相配色）gives a calm, unified impression. Use complementary colors when you want strong contrast."},{"a":0,"q":"What is the typical effect of applying the Multiply blend mode to a layer?","c":["The result becomes darker, suiting shadow work","The result becomes brighter, suiting added light","Only the hue is swapped","The resolution increases"],"e":"Multiply multiplies the colors, so it darkens. Use Screen or Add to brighten."},{"a":2,"q":"Which resolution is generally recommended for print data?","c":["72 dpi","150 dpi","350 dpi","1000 dpi"],"e":"Commercial printing usually targets about 350 dpi at final size. 72 dpi is a screen-display figure."},{"a":0,"q":"Which of the following is a vector file format?","c":["SVG","JPEG","BMP","TIFF"],"e":"SVG is vector. The other three are raster formats."},{"a":0,"q":"What is the benefit of raising an image from 8-bit to 16-bit depth?","c":["Tonal steps become finer, so banding in gradients is less likely","The file becomes smaller","The resolution doubles","The number of hues increases"],"e":"Finer tonal steps mean the image survives strong color correction. The trade-off is a larger file."},{"a":0,"q":"What characterizes the edges of an anti-aliased image?","c":["Pixels of intermediate colors are placed between foreground and background","The edge is a perfect staircase","The edge becomes transparent","Only the edge has higher resolution"],"e":"Intermediate colors make the visible stair-stepping far less noticeable."},{"a":0,"q":"Which statement best describes a highly saturated color?","c":["It has strong hue and appears vivid","It is bright","It is dark","It is achromatic"],"e":"Saturation（彩度）is the strength of hue. Lowering it eventually produces an achromatic color."},{"a":0,"q":"You want to increase the difference between light and dark in an image. Which setting should you adjust?","c":["Contrast","Hue","Resolution","Bit rate"],"e":"Contrast controls the light–dark difference. Raising it adds punch, but pushing too far destroys tonal detail."},{"a":0,"q":"Which statement best describes color universal design?","c":["Using cues other than color as well, so information reaches people who see color differently","Using only highly saturated colors","Working only in black and white","Always limiting the palette to three colors"],"e":"The principle is not to rely on color difference alone: shape, position and text should carry the information too."},{"a":0,"q":"An image keeps the same pixel count, but its resolution setting is lowered. What happens when it is printed?","c":["The printed size becomes larger and the image looks coarser","The number of colors decreases","The file format changes","Saturation increases"],"e":"With a fixed pixel count, lowering dpi makes each pixel physically larger, so the print grows and becomes coarser."},{"a":0,"q":"Which statement best describes a pixel in a digital image?","c":["The smallest unit making up the image, each carrying color information","The physical size of a printed dot","The number of dots per inch","The compression unit of an image file"],"e":"The pixel is the smallest unit of the image. The number of pixels per inch is the resolution (dpi/ppi)."},{"a":0,"q":"What psychological effect do warm colors generally produce?","c":["A warm, active impression","A cold, calm impression","Only a heavy, depressed impression","No effect on impression"],"e":"Warm colors such as red, orange and yellow feel warm and active; cool blues feel cold and quiet."}],[{"a":1,"q":"What is the effect of using a lens with a long focal length (telephoto)?","c":["The angle of view widens and perspective is exaggerated","The angle of view narrows and perspective appears compressed","Depth of field deepens so everything stays in focus","Strong barrel distortion stretches the edges of the frame"],"e":"Telephoto means a narrow angle of view, compressed perspective and shallow depth of field. Wide-angle does the opposite."},{"a":0,"q":"You want a portrait with a strongly blurred background. Which setting is most effective?","c":["Open the aperture (use a smaller f-number)","Close the aperture (use a larger f-number)","Use a faster shutter speed","Lower the ISO"],"e":"Depth of field becomes shallower when you open the aperture, use a longer focal length, or move closer to the subject."},{"a":1,"q":"What is the name for swinging the lens horizontally while the camera stays fixed on a tripod?","c":["Tilt","Pan","Dolly","Crane"],"e":"Pan is horizontal, tilt is vertical. Dolly and crane moves physically relocate the camera."},{"a":2,"q":"What impression does a low angle looking up at a person generally give?","c":["Weak and isolated","Objective and neutral","Imposing and powerful","Explanatory about the situation"],"e":"A low angle makes the subject look larger and stronger. A high angle suggests weakness or objectivity."},{"a":0,"q":"What is the effect of a wide-angle lens?","c":["The angle of view widens and perspective is exaggerated","The angle of view narrows and perspective is compressed","Depth of field becomes extremely shallow","The subject fills the frame with a heavily blurred background"],"e":"Wide-angle gives a broad view, exaggerated perspective and deep depth of field. It suits cramped interiors and dramatic framing."},{"a":1,"q":"Which compositional rule divides the frame into thirds vertically and horizontally and places the subject on those lines or intersections?","c":["Centered composition","Rule of thirds","Symmetrical composition","Radial composition"],"e":"The rule of thirds（三分割法）moves the subject off center, creating negative space and a stable yet dynamic frame."},{"a":1,"q":"Which move brings the camera body itself closer to the subject, as opposed to zooming in?","c":["Zoom in","Dolly in (track in)","Pan","Tilt"],"e":"A dolly moves the camera, so perspective changes. A zoom only changes the angle of view; the viewpoint stays put."},{"a":1,"q":"What impression does a high angle (bird's-eye view) generally give?","c":["It makes the subject look large and strong","It makes the subject look small and explains the situation","It creates an equal eye level with the subject","It distorts the subject severely"],"e":"A high angle suits situational explanation and makes the subject look weaker and smaller. It is the opposite of a low angle."},{"a":0,"q":"Which condition makes the depth of field deeper, so that both near and far stay in focus?","c":["Close the aperture (use a larger f-number)","Open the aperture (use a smaller f-number)","Use a longer focal length","Move extremely close to the subject"],"e":"A larger f-number deepens depth of field. The other three all make it shallower."},{"a":0,"q":"Which composition places the subject large in the center of the frame, giving stability but risking monotony?","c":["Centered composition","Rule of thirds","Diagonal composition","Tunnel composition"],"e":"Centered composition（日の丸構図）states things strongly, but the negative space becomes even and the frame lacks movement."},{"a":1,"q":"Which move swings the lens vertically while the camera stays fixed?","c":["Pan","Tilt","Dolly","Roll"],"e":"Tilt is vertical, used for moves such as travelling up a tall building from its base."},{"a":1,"q":"What impression does an eye-level (horizontal) angle generally give?","c":["Imposing and powerful","Objective, natural and equal with the viewer","Unstable and tense","Explanatory from above"],"e":"Eye level matches everyday vision, so it reads as neutral and natural."},{"a":0,"q":"Which shot size frames a person from the chest up?","c":["Bust shot","Knee shot","Long shot","Full shot"],"e":"The bust shot（バストショット）is the standard size for dialogue: both expression and gesture read clearly."},{"a":0,"q":"Which shot is used at the start of a scene to show the viewer the location and overall situation?","c":["Establishing shot (long shot)","Close-up","Bust shot","Macro shot"],"e":"Showing spatial relationships wide before moving in is the basic pattern for a scene transition."},{"a":0,"q":"What is the general role of a close-up?","c":["Emphasizing expression or detail to draw attention to emotion or key information","Explaining the whole location","Showing the positions of characters relative to each other","Indicating the passage of time"],"e":"A close-up forces the viewer's attention to one point. Overuse makes spatial relationships hard to follow."},{"a":0,"q":"Which shot size frames a person from the knees up?","c":["Knee shot","Bust shot","Waist shot","Close-up"],"e":"The knee shot（ニーショット）keeps some of the body's movement visible without pulling all the way back to full figure."},{"a":0,"q":"In a dialogue scene, which principle keeps the camera on one side so the characters' left–right relationship stays consistent?","c":["The imaginary line (180-degree rule)","The rule of thirds","The inverse square law","The golden ratio"],"e":"Crossing the imaginary line（イマジナリーライン）flips the on-screen positions and confuses the audience."},{"a":0,"q":"What is the name for the space left above a person's head in the frame?","c":["Head room","Nose room","Highlight","Margin light"],"e":"Head room（ヘッドルーム）. Too much feels slack; too little feels cramped."},{"a":0,"q":"What is the name for the extra space left in the direction a person is facing or looking?","c":["Nose room (lead room)","Head room","Foot room","Safe area"],"e":"Space ahead of the gaze. Without it the frame feels compressed and unstable."},{"a":0,"q":"Which composition arranges subjects or lines along the diagonal of the frame to emphasize depth and movement?","c":["Diagonal composition","Centered composition","Symmetrical composition","Frame-within-a-frame composition"],"e":"A diagonal composition（対角線構図）creates more movement than horizontals and verticals, and reads as deeper."},{"a":0,"q":"Which composition places elements with left–right symmetry to convey stillness or grandeur?","c":["Symmetrical composition","Rule of thirds","Diagonal composition","Tunnel composition"],"e":"Symmetry produces strong stability and a ceremonial feel. Breaking it deliberately can create unease."},{"a":0,"q":"What is the term for lines and shapes in the frame that guide the viewer's eye toward the subject?","c":["Leading lines","Lens flare","Vignette","Moire"],"e":"Roads, fences and bands of light lead the eye. Designing them is basic to deliberate composition."},{"a":0,"q":"Which piece of equipment is used to move the camera through a large vertical range, for example from a high angle down to eye level?","c":["Crane (boom)","Tripod","Slider","Gimbal"],"e":"A crane shot changes height as it moves, revealing the scale of a location in one continuous move."},{"a":0,"q":"What is the difference between zooming in and dollying in?","c":["A zoom only changes the angle of view, while a dolly moves the viewpoint so perspective changes","A zoom moves the viewpoint","A dolly only changes the angle of view","There is no difference"],"e":"Combining the two in opposite directions produces the dolly zoom（ドリーズーム）, or vertigo shot."},{"a":0,"q":"What is the general effect of shooting handheld?","c":["Slight shake creates a sense of immediacy or instability","Depth of field becomes deeper","Color temperature drops","Resolution increases"],"e":"Handheld gives documentary rawness; a locked-off tripod gives stability and objectivity."},{"a":0,"q":"What happens when a moving subject is shot with a slow shutter speed?","c":["The subject blurs, expressing the trail of movement","The subject freezes completely","The color temperature changes","The angle of view widens"],"e":"A slow shutter causes motion blur. In CG the equivalent is the motion blur setting."},{"a":0,"q":"What problem tends to appear when the ISO is raised?","c":["Noise (graininess) increases in the image","The angle of view narrows","Depth of field becomes shallower","The number of colors decreases"],"e":"Higher ISO enables shooting in low light, but noise becomes more visible as it rises."},{"a":1,"q":"Which focal length is closest to a standard lens, said to give perspective similar to human vision (35 mm equivalent)?","c":["About 14 mm","About 50 mm","About 200 mm","About 600 mm"],"e":"Around 50 mm is standard. Shorter is wide-angle, longer is telephoto."},{"a":0,"q":"Which move rotates the camera around its optical axis, tilting the horizon?","c":["Roll","Pan","Tilt","Dolly"],"e":"Roll. A tilted horizon can suggest instability or disorientation."},{"a":0,"q":"What is the effect of placing a heavily blurred object in the foreground of the frame?","c":["Depth increases and the shot feels like a glimpse from behind something","Depth of field becomes deeper","Color temperature rises","The angle of view widens"],"e":"Foreground blur. Building foreground, middle and background layers is the basis of depth in an image."}],[{"a":0,"q":"Which combination correctly lists the components of a polygon model?","c":["Vertices, edges and faces","Control points, knots and weights","Density function, isosurface and threshold","Primitives, booleans and CSG tree"],"e":"Vertices, edges and faces（頂点・稜線・面）. The second option describes NURBS, the third metaballs, the fourth solid modeling."},{"a":0,"q":"Which statement best describes NURBS?","c":["Control points can carry weights, so conics such as circles and spheres are represented exactly","The curve always passes through every control point","A method that approximates surfaces with a set of triangles","Shape is defined by a threshold on a density distribution"],"e":"NURBS stands for Non-Uniform Rational B-Spline. The word rational refers to weighted control points, which is why exact arcs are possible."},{"a":1,"q":"Which technique recursively subdivides a coarse polygon mesh to produce a smooth surface?","c":["Metaballs","Subdivision surfaces","Sweep","Boolean operation"],"e":"Subdivision surfaces（サブディビジョンサーフェス）let a small control mesh drive a smooth surface, which is why they are standard for characters."},{"a":1,"q":"Why is a mesh built mainly from quadrangular polygons recommended for character modeling?","c":["Because the data is always smaller than with triangles","Because the mesh deforms without breaking and edge loops can follow the form","Because renderers can only process quadrangles","Because it removes the need for UV unwrapping"],"e":"Quad-based topology deforms well and lets edge loops follow the anatomy. It has nothing to do with data size or UVs."},{"a":0,"q":"Which technique creates a rotationally symmetric object such as a wine glass from a profile curve?","c":["Lathe (surface of revolution)","Extrude","Loft","Boolean operation"],"e":"The profile curve is revolved around an axis. It suits rotationally symmetric vessels."},{"a":1,"q":"Which operation creates a new shape from the union, difference or intersection of two solids?","c":["Sweep","Boolean operation","Subdivision","Retopology"],"e":"Boolean operations（ブーリアン演算）suit mechanical shapes, but the resulting topology tends to be messy."},{"a":1,"q":"Which statement best describes metaballs?","c":["Outlines are defined by curves passing through control points","Shape is the isosurface of a density distribution, so elements merge smoothly as they approach","Surfaces are approximated with sets of triangles","Solids are inferred from 2D images"],"e":"Metaballs（メタボール）define form as an isosurface, so elements blend naturally. They suit liquids and organic shapes."},{"a":0,"q":"What is the process of transferring detail from a high-poly model onto a low-poly model to create maps such as normal maps?","c":["Baking","Retopology","Skinning","Rendering"],"e":"Baking（ベイク）burns the high-resolution detail into a texture so that a light model still looks detailed."},{"a":0,"q":"Which technique extrudes a flat shape in one direction to create a solid?","c":["Extrude","Lathe","Metaballs","Retopology"],"e":"Extrude（押し出し）is a basic operation used for text, panels and adding new faces."},{"a":0,"q":"Which information determines the front and back of a polygon?","c":["The direction of the normal","The UV coordinates","The vertex color","The material ID"],"e":"Normal direction（法線）. If it is flipped, shading looks wrong or the face disappears at render time."},{"a":0,"q":"With subdivision surfaces, what should you do where a sharp corner must be preserved after subdividing?","c":["Set a crease on the edge, or add supporting edges nearby","Triangulate the polygons","Flip the normals","Reset the UVs"],"e":"Tightening the edge spacing, or applying a crease value, keeps the corner sharp after subdivision."},{"a":0,"q":"What is the process of rebuilding a dense scanned mesh into a cleaner, more workable polygon structure?","c":["Retopology","Baking","Skinning","Boolean"],"e":"Retopology（リトポロジー）rebuilds the mesh into topology suited to animation and texturing."},{"a":0,"q":"In a Bezier curve, which element is used to adjust how the curve bends?","c":["Control handles","Normal map","UV coordinates","Weight value"],"e":"The direction and length of the handles extending from each anchor point set the curvature."},{"a":0,"q":"Which technique creates a surface that passes through a series of cross-section shapes?","c":["Loft (skin)","Lathe","Extrude","Boolean"],"e":"Loft（ロフト）builds a surface across ordered cross-sections, suiting hulls and wings that change smoothly."},{"a":0,"q":"Which technique moves a cross-section shape along a specified path to build a solid?","c":["Sweep","Lathe","Metaballs","Retopology"],"e":"Sweep（スイープ）suits pipes and handrails, where the form follows a path."},{"a":0,"q":"What generally happens when the polygon count is increased?","c":["The form becomes more detailed, but data size and processing load increase","The form becomes coarser but processing gets lighter","Data size stays the same","Textures become unnecessary"],"e":"Detail and processing load trade off against each other. Choosing an appropriate density for the purpose is what matters."},{"a":0,"q":"What is the name for rings of edges placed around joints and facial muscles, following the direction of deformation?","c":["Edge loops","Seams","Creases","Pivots"],"e":"Edge loops（エッジループ）aligned with the direction of deformation keep the shape natural when the mesh bends."},{"a":0,"q":"Why are polygons with five or more sides (n-gons) generally avoided?","c":["They are triangulated in an unpredictable way, causing unintended results in deformation and rendering","They always increase data size","They cannot be colored","They cannot be UV unwrapped"],"e":"An n-gon is split into triangles internally, but the way it splits is not guaranteed, which is why it causes problems."},{"a":0,"q":"Which statement best describes a solid model?","c":["The interior is treated as filled, so the object has volume and mass","Only the surface is treated as a set of faces","The shape is described only by line segments","The shape is described as a set of pixels"],"e":"A solid has an interior; a surface model has only a skin. Solid modeling is standard in CAD."},{"a":0,"q":"What is the name for the process that splits quadrangles into triangles when exporting to a renderer or game engine?","c":["Triangulation","Retopology","Tessellation control","Baking"],"e":"What is finally drawn is triangles. How the split happens can change the shading."},{"a":0,"q":"Which mechanism switches between models of different detail depending on distance from the camera?","c":["LOD (Level of Detail)","AO","IK","GI"],"e":"Using low-poly models in the distance keeps the look intact while reducing processing load."},{"a":0,"q":"Which feature speeds up modeling a bilaterally symmetric character?","c":["Mirror (symmetry) modeling","Boolean operation","Metaballs","LOD"],"e":"Build one side and the other is generated automatically. Usually the halves are merged at the end and asymmetric details added."},{"a":0,"q":"What is the term for basic shapes such as spheres, cubes and cylinders that serve as a starting point for modeling?","c":["Primitives","Proxies","Decals","Atlases"],"e":"Primitives（プリミティブ）are deformed and combined to build up more complex forms."},{"a":0,"q":"Which operation combines several overlapping vertices into one?","c":["Merge","Extrude","Bevel","Smooth"],"e":"If vertices stay separate, the faces are not actually connected, which breaks shading and deformation."},{"a":0,"q":"Which method shapes a model with brushes, much like working with clay?","c":["Sculpting","Boolean modeling","NURBS modeling","Procedural modeling"],"e":"Sculpting（スカルプト）suits organic forms and fine detail such as wrinkles and muscle."},{"a":0,"q":"Which technique reconstructs geometry and texture from a large number of photographs?","c":["Photogrammetry","Ray tracing","Retargeting","Keying"],"e":"Photogrammetry captures real objects and terrain accurately, but the raw result is too dense to use directly."},{"a":0,"q":"Which display mode shows the model as lines only, so the internal structure and face divisions can be checked?","c":["Wireframe display","Shaded display","Textured display","Render view"],"e":"Wireframe display（ワイヤフレーム）is used to check edge flow and polygon density."},{"a":0,"q":"Which coordinate system uses the object itself as its reference?","c":["Local coordinates","World coordinates","Screen coordinates","UV coordinates"],"e":"Local coordinates belong to the object; world coordinates are the reference for the whole scene."},{"a":0,"q":"What problem is likely when a model still has open edges or holes?","c":["Operations such as 3D printing or booleans do not work correctly","The number of texture colors decreases","The frame rate rises","The color temperature changes"],"e":"Many operations assume a closed solid. Holes and duplicate faces should be fixed beforehand."},{"a":0,"q":"Which operation chamfers an edge, creating a narrow face along the corner?","c":["Bevel","Merge","Mirror","Smooth"],"e":"Bevel（ベベル）. Perfectly sharp corners barely exist in reality, and a chamfer catches a highlight that reads as solidity."}],[{"a":0,"q":"Which statement best describes UV mapping (UV unwrapping)?","c":["Defining the correspondence between a 3D model's surface and a 2D texture image","Setting the range and falloff of a light","Automatically reducing the polygon count of a model","Flipping the direction of face normals"],"e":"The 3D surface is unfolded onto a plane and assigned texture coordinates (U, V)."},{"a":1,"q":"Which statement best describes bump mapping?","c":["Geometry is actually displaced, so the silhouette also shows the relief","Normals are perturbed so shading suggests relief, but the silhouette does not change","The surroundings are reflected on the surface","Per-pixel opacity is controlled"],"e":"Bump mapping（バンプマッピング）only perturbs normals, so the outline stays flat. Displacement mapping actually moves geometry."},{"a":1,"q":"
