Which technique fakes reflections of the surroundings on metal or glass without tracing rays?","c":["Bump mapping","Environment (reflection) mapping","Alpha mapping","Displacement mapping"],"e":"Environment mapping（環境マッピング）applies a prepared image as the reflection, which is far faster than ray tracing."},{"a":0,"q":"You have applied a leaf texture to a single quad and want everything outside the leaf shape to be transparent. What should you use?","c":["Opacity (alpha) map","Specular map","Normal map","Environment map"],"e":"An opacity map（透明度マップ）. Conventionally white is opaque and black is transparent."},{"a":0,"q":"Which statement best describes diffuse reflection?","c":["Light scatters almost evenly in all directions, so brightness barely changes with viewing angle","Light reflects strongly in one direction, so highlights move as the viewpoint changes","Light passes through the object and exits the other side","All incoming light is absorbed"],"e":"Diffuse reflection（拡散反射）determines the object's inherent color. The second option describes specular reflection."},{"a":1,"q":"A specular highlight becomes small and sharp when the surface is in which state?","c":["Rough (high roughness)","Smooth (low roughness)","Highly transparent","Normals flipped"],"e":"The smoother the surface, the smaller and sharper the highlight. Rough surfaces scatter it wide and weak."},{"a":0,"q":"What is the name for a texture image designed so that no seams show when it is tiled?","c":["Seamless texture","Normal map","Mipmap","Matte painting"],"e":"A seamless (tiling) texture（シームレステクスチャ）covers large surfaces with very little data."},{"a":1,"q":"Which statement best describes displacement mapping?","c":["It only perturbs normals, leaving the geometry unchanged","It actually displaces vertices, so the silhouette shows the relief, but sufficient subdivision is required","It reflects the surrounding environment","It controls only opacity"],"e":"Because it moves real geometry, it affects the silhouette. The price is a finely subdivided mesh and higher render cost."},{"a":0,"q":"What is the name for the cut made in a model so that it can be unfolded flat for UV mapping?","c":["Seam","Crease","Edge loop","Cage"],"e":"Seams（シーム）placed in inconspicuous locations keep texture joins from being noticeable."},{"a":0,"q":"Which statement best describes a normal map?","c":["It records the direction of surface normals in the RGB components to express fine relief through shading","It records height in grayscale and actually displaces the geometry","It records opacity","It records only the strength of reflection"],"e":"A normal map（ノーマルマップ）stores normal directions as color, carrying more directional information than a bump map."},{"a":0,"q":"What is the phenomenon called when light changes direction at the boundary between media, as in glass or water?","c":["Refraction","Diffraction","Scattering","Attenuation"],"e":"Refraction（屈折）. The index of refraction setting greatly changes how glass and water look."},{"a":0,"q":"Which mechanism stores pre-made reduced versions of a texture to prevent shimmering when it is displayed small?","c":["Mipmapping","Seamless texture","Atlas","Decal"],"e":"Mipmaps（ミップマップ）select an appropriately sized image for the distance, reducing shimmer and lightening processing."},{"a":0,"q":"What is the role of a specular map?","c":["Varying the strength of specular reflection across the surface, distinguishing wet or worn areas","Varying opacity across the surface","Varying normal direction across the surface","Varying polygon density across the surface"],"e":"Varying gloss within a single material removes flatness and makes the surface far more convincing."},{"a":0,"q":"Why are texture resolutions often powers of two, such as 512 × 512 or 1024 × 1024?","c":["Mipmap generation and GPU processing are more efficient","More colors become available","The file format is restricted","UV unwrapping becomes unnecessary"],"e":"Power-of-two sizes halve cleanly for mipmaps and are favourable for real-time rendering."},{"a":0,"q":"What problem occurs when baking a lightmap onto a model whose UVs overlap?","c":["The same shading is baked into the overlapping areas, so the lighting is wrong","The number of texture colors decreases","The polygon count increases","The normals flip"],"e":"Bake UVs must not overlap. Models often carry a second UV set separate from the color texture."},{"a":0,"q":"Which kind of texture generates its pattern by calculation rather than from an image?","c":["Procedural texture","Mipmap","Decal","Atlas"],"e":"Procedural textures（プロシージャルテクスチャ）are resolution-independent and can be varied endlessly through parameters."},{"a":0,"q":"Which projection method suits applying a texture to a cylindrical object?","c":["Cylindrical projection","Planar projection","Spherical projection","Cubic projection"],"e":"Choosing a projection close to the form minimizes distortion. Cans and bottles suit cylindrical projection."},{"a":0,"q":"What is the name for many small textures packed into a single large image?","c":["Texture atlas","Mipmap","Lightmap","Normal map"],"e":"An atlas reduces the number of materials and draw calls, which helps real-time rendering."},{"a":0,"q":"In PBR material settings, which parameter specifies whether a surface is metal?","c":["Metallic","Roughness","Opacity","Emissive"],"e":"Metallic sets metal versus non-metal and roughness sets surface finish. Together they form the basis of PBR."},{"a":0,"q":"Which effect reproduces light entering a surface, scattering beneath it and exiting again, as in skin or marble?","c":["Subsurface scattering","Ambient occlusion","Caustics","Anisotropic reflection"],"e":"Subsurface scattering (SSS) is what stops skin from looking like plastic."},{"a":0,"q":"Which material setting makes a model appear to glow by itself?","c":["Emissive (self-illumination)","Displacement","Opacity","Ambient occlusion"],"e":"Emissive（自己発光）suits neon and screens, though on its own it may not actually light the surroundings."},{"a":0,"q":"Which reflection stretches the highlight in one direction, as on brushed metal or a CD surface?","c":["Anisotropic reflection","Diffuse reflection","Total internal reflection","Retroreflection"],"e":"Anisotropic reflection（異方性反射）stretches along the direction of microscopic grooves in the surface."},{"a":0,"q":"Which texture bakes in the darkening found in crevices and contact areas?","c":["AO (ambient occlusion) map","Specular map","Alpha map","Mipmap"],"e":"An AO map adds contact shading without recalculating it every frame, which is why real-time engines use it heavily."},{"a":0,"q":"Which technique applies dirt or markings to part of a model's surface as an overlay?","c":["Decal","Bake","Tiling","Merge"],"e":"Decals（デカール）add scratches or stamps without repainting the base texture."},{"a":0,"q":"What is the relationship between a material and a shader?","c":["The shader is the program that calculates how the surface looks, and the material is the set of parameters fed to it","The material performs the calculation and the shader is its setting","They are exactly the same thing","The shader determines the polygon count"],"e":"Think of the shader as the mechanism and the material as its specific settings."},{"a":0,"q":"You want to tile a small brick texture across a large wall. Which setting should you change?","c":["The tiling (repeat) factor","The direction of the normals","The polygon count","The render resolution"],"e":"The tiling factor sets how many times the texture repeats. It assumes a seamless image."},{"a":0,"q":"In PBR, why should shadows and highlights not be painted into the base color (albedo) texture?","c":["They would double up with the shading from lighting, looking wrong under any illumination","The file would become larger","UV unwrapping would fail","The number of colors would drop"],"e":"Shading is calculated at render time. Base color should carry only the object's inherent color."},{"a":0,"q":"Why does a typical normal map look bluish purple?","c":["Because on flat areas the normal points straight up, which corresponds to that color","Because blue ink is the cheapest","Because it compresses better","Because human eyes are most sensitive to blue"],"e":"RGB corresponds to the normal's XYZ, and flat areas have a maximum Z component, giving the bluish purple."},{"a":0,"q":"Which setting, used together with refraction, most effectively gives a transparent object a sense of thickness?","c":["Color absorption with depth (density)","Polygon count","UV tiling","Number of LOD levels"],"e":"Making the color deepen with thickness greatly increases the realism of glass and liquids."},{"a":0,"q":"What is the advantage of overlapping the UVs of repeated identical parts?","c":["It saves texture space, effectively raising the available resolution","Lightmaps bake correctly","Normals become correct","The polygon count drops"],"e":"This works well for color textures, but overlapping breaks bake UVs, so the two must be handled separately."}],[{"a":1,"q":"Which statement best describes a directional light?","c":["It falls off with distance from the source, suiting a bare bulb","Its rays travel in parallel with no distance falloff, suiting sunlight","It emits in a cone whose spread is set by a cone angle","It brightens the whole scene evenly and has no direction"],"e":"A directional light（平行光源）is treated as infinitely far away, so only its direction matters, not its position. The others describe a point light, a spotlight and ambient light."},{"a":2,"q":"In three-point lighting, which light separates the subject from the background by picking out its outline?","c":["Key light","Fill light","Back light","Ambient light"],"e":"The back light (rim light)（バックライト）strikes from behind and lifts the subject away from the background."},{"a":1,"q":"What is the main role of the fill light?","c":["Acting as the main source and setting the direction of the shading","Softening the shadows cast by the key light and controlling contrast","Lighting only the background, leaving the subject untouched","Creating a thin rim of light around the subject"],"e":"The fill light（フィルライト）is set weaker than the key, keeping some shadow while controlling contrast."},{"a":0,"q":"Which technique uses a photographed HDR image as a light source to reproduce realistic ambient light and reflections?","c":["IBL (image-based lighting)","Ambient occlusion","Shadow mapping","Toon shading"],"e":"IBL uses high dynamic range images so that the amount and direction of light match live-action plates naturally."},{"a":0,"q":"Which statement best describes a point light?","c":["It emits in all directions from a single point and falls off with distance","Its rays are parallel and do not fall off","It illuminates only a conical region","It emits from an area, producing soft shadows"],"e":"A point light（点光源）behaves like a bare bulb. Because it falls off, its position strongly affects brightness."},{"a":0,"q":"Which spotlight parameter determines how wide the illuminated cone is?","c":["Cone angle","Intensity","Color temperature","Falloff exponent"],"e":"The cone angle sets the spread, and the penumbra (dropoff) softens the edge."},{"a":0,"q":"Which effect darkens crevices and areas where objects come close together and light struggles to reach?","c":["Ambient occlusion","Shadow mapping","Tone mapping","Anti-aliasing"],"e":"Ambient occlusion（アンビエントオクルージョン）adds contact and volume, removing the floating look typical of CG."},{"a":0,"q":"Which light color is most appropriate for evening sunlight?","c":["A low color temperature, toward orange","A high color temperature, bluish white","Fully desaturated white","Low-value gray"],"e":"The lower the color temperature, the redder the light. Daylight is bluish white; evening light and incandescent bulbs lean orange."},{"a":0,"q":"Which statement best describes an area light?","c":["Shadow edges become soft, giving natural shading","Shadow edges become extremely sharp","There is no falloff with distance at all","It has no direction and casts no shadow"],"e":"Because the emitting surface has area, a penumbra forms and shadow edges soften. It suits window light."},{"a":0,"q":"Which statement best describes global illumination (GI)?","c":["It calculates indirect light bounced off surfaces as well as direct light","It raises the brightness of the whole scene uniformly","It skips shadow calculation to speed things up","It limits the scene to one light source"],"e":"GI computes indirect light. Color bleed, where a colored wall tints a neighbouring surface, is also a GI effect."},{"a":0,"q":"Where is the key light generally placed in three-point lighting?","c":["Diagonally in front of the subject and slightly above, as seen from the camera","Directly behind the subject","Exactly at the camera lens position","Directly below the subject"],"e":"Lighting from diagonally above the front produces shading that reads as three-dimensional. Head-on light flattens the subject."},{"a":0,"q":"What tends to happen if all shadows are disabled in a render?","c":["The sense of contact is lost and objects appear to float","Colors invert","The polygon count increases","Textures stop displaying"],"e":"Shadows are a key cue to spatial relationships. Without cast shadows, position in space becomes unreadable."},{"a":0,"q":"Which statement best describes ambient light?","c":["It has no direction and brightens the scene uniformly, so on its own it flattens form","It emits from a point and falls off with distance","It illuminates a conical region","It always casts shadows"],"e":"It brightens everything easily but destroys form. GI and IBL are generally used instead nowadays."},{"a":0,"q":"Which statement correctly distinguishes the dark side of an object from the shadow it casts?","c":["Shade is the object's own unlit surface; a cast shadow is the darkness falling on other surfaces","Shade falls on other surfaces; a cast shadow is the object's own dark side","They are the same thing","Both refer to the color of the light"],"e":"Shade（陰）versus cast shadow（影）. Having both is what creates volume and a sense of contact with the ground."},{"a":0,"q":"Under which condition are soft shadows with blurred edges most likely?","c":["The light source is large in area, or the object is far from the surface receiving the shadow","The light is nearly a point and the object is touching the ground","The light source is infinitely distant","Shadows are disabled"],"e":"A larger source widens the penumbra. Overcast shadows are soft because the whole sky acts as a huge area light."},{"a":1,"q":"For a point light, what happens in theory to illuminance when the distance doubles?","c":["It halves","It becomes one quarter","It stays the same","It doubles"],"e":"The inverse square law: illuminance falls with the square of distance, so twice the distance gives a quarter of the light."},{"a":0,"q":"Which light traces a thin line along the subject's outline to lift it from the background?","c":["Rim light","Fill light","Ambient light","Volumetric light"],"e":"Rim light (edge light) is a form of back light that emphasizes the contour."},{"a":0,"q":"What is the name for a small reflection placed in a character's eyes to make them look alive?","c":["Eye light (catch light)","Key light","Bounce light","Volumetric light"],"e":"Without a catch light the eyes look dead and the character's expression fails to read."},{"a":2,"q":"Which value is closest to the color temperature of daylight on a clear day?","c":["About 2000 K","About 3000 K","About 5500 to 6500 K","Over 10000 K"],"e":"Daylight is roughly 5500 to 6500 K. Incandescent bulbs sit around 3000 K and look distinctly warm."},{"a":0,"q":"What is the advantage of an HDR image over an LDR image?","c":["It records a far wider range of luminance, from very bright to very dark","The file is smaller","It has fewer colors","Its resolution is always higher"],"e":"Holding a wide luminance range means it carries enough information to act as a light source, which is why it suits IBL."},{"a":0,"q":"Which light is generally set brightest in three-point lighting?","c":["Key light","Fill light","Back light","Ambient light"],"e":"The key light is the main source and the strongest. Fill supports it and back separates the subject."},{"a":0,"q":"What happens to the look of the image when the ratio between key and fill is increased?","c":["Contrast becomes strong, giving a dramatic, hard look","Contrast weakens, giving a soft look","Color temperature drops","Resolution rises"],"e":"A larger lighting ratio means higher contrast. Suspense scenes often push the ratio deliberately."},{"a":0,"q":"What is the effect of strong backlighting on a subject?","c":["The outline glows and the silhouette is emphasized","Detail on the subject's front is shown most clearly","Shadows disappear entirely","Color temperature rises"],"e":"Backlight creates silhouettes and a mysterious feel. Add fill if you need to see the front."},{"a":0,"q":"What is the name for the effect of light scattering through dust or mist to appear as visible shafts?","c":["Volumetric light (light shafts)","Caustics","Ambient occlusion","Lens distortion"],"e":"Volumetric light（ボリュームライト）adds depth and atmosphere, but it is expensive to compute."},{"a":0,"q":"Which feature makes a specific light affect only specific objects?","c":["Light linking","Shadow catcher","Lightmap","Tone mapping"],"e":"Light linking（ライトリンキング）allows physically impossible lighting, which makes it valuable for shaping an image."},{"a":0,"q":"When lighting an outdoor daytime scene, which light must be considered in addition to the sun?","c":["Diffuse light from the whole sky","Indoor fluorescent lighting","A flashlight beam","Light from a monitor"],"e":"Shadows are not black outdoors because skylight and ground bounce fill them. Sun alone looks unnatural."},{"a":0,"q":"Why are shadows sometimes given a slight blue tint rather than being pure black?","c":["Real shadows are filled by blue light from the sky","Black takes longer to render","Black cannot be printed","Blue uses less data"],"e":"A shadow is not an absence of light but a region lit indirectly. A touch of blue reads as natural."},{"a":0,"q":"What is the advantage of baking pre-calculated lighting into textures?","c":["It greatly reduces the calculation load at runtime","Lights become freely movable","The polygon count drops","The number of colors increases"],"e":"Lightmaps（ライトマップ）work well for static scenes, but break as soon as lights or objects move."},{"a":0,"q":"What is the name for light that bounces off a surface and faintly illuminates its surroundings?","c":["Bounce light","Specular highlight","Rim light","Key light"],"e":"Bounce light（反射光）. Without GI it is often faked by adding weak extra lights."},{"a":0,"q":"What problem is likely when a scene is lit with only a single light?","c":["Shadow areas crush to black and their form becomes unreadable","The whole frame blows out to white","The color temperature shifts","Polygons disappear"],"e":"Without fill, information in the dark areas is lost. Fill light or GI is used to lift the shadows."}],[{"a":0,"q":"Which statement best describes keyframe animation?","c":["States are specified at key moments and the in-between values are interpolated","A person's movement is recorded with sensors and applied to the model","Motion is generated purely by physical simulation","Every single frame must be specified by hand"],"e":"Keyframes plus interpolation is the basis. Adjusting the interpolation curve (ease in and ease out) changes the feel of the motion."},{"a":1,"q":"Which control method calculates the joint angles of the elbow and shoulder automatically when the position of the hand is specified?","c":["Forward kinematics (FK)","Inverse kinematics (IK)","Morphing","Dynamics"],"e":"IK solves backward from the end effector, which suits planted feet or a fixed hand. FK rotates joints from the root outward."},{"a":1,"q":"Which technique interpolates vertex by vertex between a base shape and target shapes, for example to change facial expression?","c":["Skinning","Morphing (blend shapes)","Particles","Motion retargeting"],"e":"Morphing / blend shapes（モーフィング・ブレンドシェイプ）is heavily used for expressions and lip sync."},{"a":0,"q":"What is the purpose of skinning (weight painting)?","c":["Making the model's surface mesh follow the movement of the skeleton","Reducing the polygon count","Hiding texture seams","Increasing shadow resolution"],"e":"Weights define how much each vertex is influenced by each bone. Poor weights cause the mesh to break at joints."},{"a":0,"q":"What is the name for adjusting the interpolation so that motion accelerates and decelerates smoothly around a key?","c":["Ease in and ease out","Retargeting","Skinning","Render passes"],"e":"Flattening the curve near the keys creates acceleration and deceleration. Constant speed reads as mechanical."},{"a":0,"q":"Which statement best describes optical motion capture?","c":["Markers are attached to the performer and several cameras compute their positions","Gyroscopic sensors on the joints measure angles","Position is derived from changes in a magnetic field","Footage is traced by hand frame by frame"],"e":"Optical capture uses markers and camera arrays. The last option describes rotoscoping."},{"a":0,"q":"Which technique is used for phenomena made of many tiny elements, such as smoke, fire or rain?","c":["Particles","Blend shapes","IK","Toon shading"],"e":"Particles（パーティクル）assign rules for birth, lifetime and velocity to each element, generating the behaviour of the group."},{"a":0,"q":"Which technique generates the swing of a character's hair and clothing automatically through physical calculation?","c":["Simulation (dynamics)","Morphing","Retopology","Keying"],"e":"Cloth and hair simulation produces secondary motion that would be laborious to key by hand."},{"a":0,"q":"Which statement best describes forward kinematics (FK)?","c":["Rotations are applied from the root joint outward and the end follows","The end position is specified and the intermediate joint angles are solved backward","Shapes are interpolated vertex by vertex","Motion is derived from physical laws"],"e":"FK works root to tip and suits arcing motion such as swinging an arm. IK is better when the end must stay planted."},{"a":0,"q":"Which principle of animation refers to a preparatory move in the opposite direction before the main action?","c":["Anticipation","Follow-through","Squash and stretch","Arc motion"],"e":"Anticipation（アンティシペーション）signals what is about to happen and makes the action convincing."},{"a":0,"q":"Which technique is generally used for lip sync?","c":["Switching blend shapes of mouth shapes in time with the audio","Pulling the lips with bone IK","Filling the mouth with particles","Zooming the camera"],"e":"Mouth shapes matching vowels and consonants are prepared and switched with the timing of the dialogue."},{"a":0,"q":"What is the process of applying one character's motion data to another character of different proportions?","c":["Retargeting","Baking","Skinning","Rendering"],"e":"Motion retargeting（リターゲティング）maps bones and corrects for scale so existing motion can be reused."},{"a":0,"q":"Which view displays value changes between keyframes as curves so that timing can be fine-tuned?","c":["Graph editor (function curves)","UV editor","Node editor","Timecode sheet"],"e":"The slope of the curve corresponds to speed: flatten it to slow down, steepen it to speed up."},{"a":0,"q":"Which principle of animation expresses mass and elasticity by compressing and stretching an object?","c":["Squash and stretch","Anticipation","Follow-through","Appeal"],"e":"Squash and stretch conveys softness. The key point is keeping the apparent volume roughly constant."},{"a":0,"q":"Which principle describes hair and clothing continuing to move after the main action has stopped?","c":["Follow-through and overlapping action","Anticipation","Staging","Solid drawing"],"e":"If everything stops at once the motion looks mechanical. Delay and overlap are what make it feel alive."},{"a":0,"q":"What is the typical shape of the path traced by the extremities in natural human or animal movement?","c":["An arc rather than a straight line","Always a perfect straight line","Always a zigzag","It remains stationary"],"e":"The arc principle: because limbs rotate around joints, their paths curve. Straight-line motion looks unnatural."},{"a":0,"q":"What does spacing primarily determine in animation?","c":["The distance moved between frames, and therefore how speed changes","The length of a shot","The placement of characters","The color design"],"e":"Timing sets the overall duration; spacing distributes the intervals within it. Acceleration comes from spacing."},{"a":0,"q":"What is the name for the working method of setting the important poses first and filling in between them afterwards?","c":["Pose to pose","Straight ahead","Retargeting","Baking"],"e":"Pose to pose is easy to control and revise. Working forward frame by frame is straight ahead."},{"a":0,"q":"What is the name for animation built so that a section can be played back repeatedly, as with a walk or run?","c":["Loop animation","Procedural animation","Stop motion","Time-lapse"],"e":"Matching the first and last poses makes the join invisible on repeat playback."},{"a":0,"q":"Which simulation calculates the physical motion of non-deforming objects, such as collapsing boxes or rolling rocks?","c":["Rigid body simulation","Fluid simulation","Cloth simulation","Crowd simulation"],"e":"Rigid bodies keep their shape while collisions and motion are solved. Cloth deforms, so it is handled separately."},{"a":0,"q":"Which technique generates the complex flow of water or smoke by calculation?","c":["Fluid simulation","IK","Morphing","Retargeting"],"e":"Fluid simulation（流体シミュレーション）consumes large amounts of computation time and memory as resolution rises."},{"a":0,"q":"Which technique gives individual rules to many characters and generates the behaviour of the group automatically?","c":["Crowd simulation","Particle emission","Skinning","Baking"],"e":"Crowd simulation（群集シミュレーション）gives each agent rules such as avoidance and following, producing collective behaviour."},{"a":0,"q":"Which mechanism makes one object's position or rotation follow another's?","c":["Constraint","Blend shape","Merge","Bevel"],"e":"Constraints（コンストレイント）are used constantly in rigging, for example to attach a prop to a hand."},{"a":0,"q":"Which statement about the parent-child hierarchy of a skeleton is correct?","c":["Rotating the parent moves the child too, but moving the child does not affect the parent","Rotating the child moves the parent","Parent and child do not affect each other","The hierarchy cannot be changed"],"e":"The parent's transform propagates to the child. This is why FK is animated from the root outward."},{"a":0,"q":"What is the name for the point that serves as the center of rotation and scaling for an object?","c":["Pivot","Seam","Crease","Anchor color"],"e":"If the pivot（ピボット）is misplaced, the object rotates along an unintended path."},{"a":0,"q":"Which feature overlays the poses of neighbouring frames semi-transparently to check the flow of motion?","c":["Onion skinning","Wireframe","Proxy display","Render preview"],"e":"Onion skinning（オニオンスキン）makes irregular paths and spacing visible at a glance."},{"a":0,"q":"What characterizes motion produced by linear interpolation between keyframes?","c":["It moves at constant speed and changes direction abruptly at keys, looking mechanical","It accelerates and decelerates naturally","It does not move","It moves randomly"],"e":"Linear means constant speed. It is unsuited to living things but often right for machinery."},{"a":0,"q":"Which post-process is normally required for captured motion data?","c":["Cleanup to fix noise and missing markers","UV unwrapping","Retopology","Color grading"],"e":"Raw capture contains noise and gaps. It cannot be used as is."},{"a":0,"q":"What is the advantage of combining multiple blend shapes when building facial expressions?","c":["A small number of shapes can be combined into a wide variety of expressions","The polygon count drops","Rendering becomes faster","UVs become unnecessary"],"e":"Splitting shapes by facial region multiplies the range of expressions available through combination."},{"a":0,"q":"What is the effect of building in a moment of hesitation before an action in character animation?","c":["The following action is emphasized, giving the movement punch and conviction","The action becomes faster","The data becomes smaller","Shadows become softer"],"e":"Loading up in a preparatory move and then releasing makes the action stand out. Constant speed leaves no impression."}],[{"a":1,"q":"Which shading method calculates brightness at each vertex and linearly interpolates it across the face?","c":["Flat shading","Gouraud shading","Phong shading","Toon shading"],"e":"Flat works per face, Gouraud calculates at vertices and interpolates, Phong interpolates normals and calculates per pixel. Phong reproduces highlights best."},{"a":0,"q":"Which rendering method traces rays backward from the viewpoint, calculating reflection and refraction, and excels at mirrors and glass?","c":["Ray tracing","Radiosity","Z-buffer method","Scanline method"],"e":"Ray tracing（レイトレーシング）follows rays from the eye and is strong on specular reflection, refraction and shadows."},{"a":1,"q":"Which method calculates interreflection between diffuse surfaces and suits the soft brightness of interior scenes?","c":["Ray tracing","Radiosity","Shadow mapping","Texture baking"],"e":"Radiosity（ラジオシティ）solves energy transfer between diffuse surfaces, expressing soft indirect illumination."},{"a":0,"q":"Which process reduces the staircase-like jaggedness on diagonal edges?","c":["Anti-aliasing","Sharpening","Dithering","Gamma correction"],"e":"Anti-aliasing（アンチエイリアシング）blends intermediate colors near edges to soften the stair-stepping."},{"a":0,"q":"Which statement best describes the Z-buffer method?","c":["A depth value is held per pixel and the surface nearest the viewpoint is kept","A depth image seen from the light is used to determine shadows","Interreflection between diffuse surfaces is solved","Edges are smoothed with intermediate colors"],"e":"The Z-buffer method（Zバッファ法）is a standard hidden surface removal algorithm, widely used in real-time CG as well."},{"a":2,"q":"Which statement best describes Phong shading?","c":["A constant brightness is given per face","Vertex brightness is interpolated across the face","Normals are interpolated and brightness is calculated per pixel","Shading is quantized into a few steps"],"e":"Phong interpolates normals, so highlights appear smooth. Interpolating vertex brightness is Gouraud shading."},{"a":0,"q":"Which statement best describes shadow mapping?","c":["Depth information seen from the light is stored as an image and used to determine which areas are shadowed","Shadows are rendered on a separate layer","Shadows are painted in as a texture","Shadows are disabled entirely"],"e":"If the shadow map resolution is too low the shadow edges become jagged, so resolution and bias need adjusting."},{"a":0,"q":"What is the purpose of toon (cel) shading?","c":["Quantizing shading into steps to give a hand-drawn animation look","Reproducing the physical behaviour of light more accurately","Reducing the polygon count","Expressing depth of field"],"e":"Deliberately reducing tonal steps and adding outlines produces a cel-animation look. It is non-photorealistic rendering."},{"a":0,"q":"What characterizes flat shading?","c":["Brightness is constant per face, so face boundaries are visible","Vertex brightness is interpolated for a smooth look","Normals are interpolated per pixel","Shading is quantized into two steps"],"e":"Flat shading works per face, so the polygon shapes show. This is sometimes used deliberately as a low-poly style."},{"a":0,"q":"In path tracing and similar methods, which artifact is reduced by increasing the sampling count?","c":["Grainy noise scattered across the image","Insufficient texture resolution","Flipped normals","Overlapping UVs"],"e":"Because rays are fired stochastically, too few samples leave noise. It is a trade-off against render time."},{"a":0,"q":"Which process adjusts rendered brightness to match the display characteristics of a monitor?","c":["Gamma correction","Anti-aliasing","Dithering","Keying"],"e":"Without matching linear calculation to display characteristics, midtones end up too dark or too bright."},{"a":0,"q":"What is the effect of motion blur?","c":["It adds a trail to fast-moving subjects, making motion feel smooth","It blurs the distance to express depth","It removes jagged edges","It softens shadows"],"e":"Motion blur is blur in time. Blur in distance is depth of field."},{"a":0,"q":"What is the purpose of hidden surface removal?","c":["Avoiding drawing surfaces that are not visible from the viewpoint","Reducing the polygon count","Reducing the number of colors","Softening shadows"],"e":"It handles parts hidden behind nearer objects correctly. The Z-buffer method is the representative algorithm."},{"a":0,"q":"Which rendering method processes the image one horizontal scan line at a time?","c":["Scanline method","Ray tracing","Radiosity","Photon mapping"],"e":"The scanline method（スキャンライン法）is weak on reflection and refraction but fast, and was widely used in earlier CG film work."},{"a":0,"q":"Which shading model assumes a perfectly diffuse surface, with brightness proportional to the cosine of the incident angle?","c":["Lambert model","Phong model","Blinn model","Toon model"],"e":"Lambert reflection（ランバート）looks equally bright from any viewpoint and forms the basis of the diffuse component."},{"a":0,"q":"Which factor has the least influence on rendering time?","c":["The length of the file name","The output resolution","The sampling count","The number of reflection and refraction calculations"],"e":"Resolution, samples and ray depth all bear directly on computation. The file name is irrelevant."},{"a":0,"q":"What is the difference between real-time rendering and pre-rendering?","c":["Real-time must draw a frame instantly, so speed takes priority over quality","Real-time is always higher quality","Pre-rendering always finishes within one second","There is no difference"],"e":"A game must draw dozens of frames per second. A film can spend minutes on a single frame."},{"a":0,"q":"Which rendering effect blurs the range that is out of focus for the camera?","c":["Depth of field","Motion blur","Volumetric light","Ambient occlusion"],"e":"Blur in distance is depth of field; blur in time is motion blur."},{"a":0,"q":"Which mechanism outputs elements such as shadows, reflections and depth as separate images?","c":["Render passes (AOVs)","Mipmaps","LOD","Tiling"],"e":"Separate outputs allow adjustment at the compositing stage without re-rendering."},{"a":0,"q":"You plan to composite CG elements over live action later. Which render setting is appropriate?","c":["Render with a transparent background and output an alpha channel","Fill the background with white","Drastically lower the resolution","Delete the alpha channel"],"e":"Outputting with alpha lets you swap backgrounds freely at the compositing stage."},{"a":1,"q":"If the output resolution is doubled in both width and height, by roughly how much does the pixel count increase?","c":["2 times","4 times","6 times","8 times"],"e":"Twice the width times twice the height gives four times the pixels, and render time rises roughly in proportion."},{"a":0,"q":"Why is an upper limit placed on the number of ray bounces in ray tracing?","c":["To stop the calculation running forever when mirrors face each other","To reduce the number of colors","To raise the resolution","To preserve the alpha channel"],"e":"Without a limit the calculation diverges. The depth is set according to what the shot actually needs."},{"a":0,"q":"What is the name for the bright patterns formed on a floor by light focused through glass or a water surface?","c":["Caustics","Distortion","Moire","Vignette"],"e":"Caustics（コースティクス）. The shifting bright pattern on the bottom of a swimming pool is the classic example."},{"a":0,"q":"Which process converts an HDR render into the luminance range a normal display can show?","c":["Tone mapping","Gamma correction","Anti-aliasing","Keying"],"e":"Tone mapping（トーンマッピング）compresses a wide luminance range into a displayable one while limiting clipping."},{"a":0,"q":"You want to keep maximum latitude for color adjustment in compositing. Which render output format is most appropriate?","c":["OpenEXR","JPEG","GIF","BMP (8-bit)"],"e":"EXR holds high bit depth HDR data and can store multiple passes in a single file."},{"a":0,"q":"What is the most direct way to improve anti-aliasing quality?","c":["Increase the number of samples per pixel","Reduce the polygon count","Lower the texture resolution","Disable shadows"],"e":"Sampling within each pixel more finely and averaging gives smoother edges, at the cost of render time."},{"a":0,"q":"What characterizes GPU rendering?","c":["It is fast thanks to parallel processing, but the data it can handle is limited by video memory","It is always slower than CPU rendering","It has no memory limits whatsoever","It cannot handle alpha channels"],"e":"GPUs excel at parallel computation, but the scene must fit in VRAM or the render fails."},{"a":0,"q":"Which statement best describes a shader?","c":["A program that calculates how surfaces and light appear","A feature that subdivides polygons","A feature that unwraps UVs","A video compression format"],"e":"A shader is a program that runs during drawing. Vertex shaders and pixel shaders are typical examples."},{"a":0,"q":"Some faces render black or appear inside out. What should you check first?","c":["Whether the normals are flipped","Whether the UVs overlap","The color temperature setting","The frame rate setting"],"e":"Flipped normals are a classic problem. Display the normal directions and reverse them where needed."},{"a":0,"q":"What is the purpose of a display mode that continuously recalculates the image on screen as settings are changed?","c":["Checking material and lighting adjustments without waiting for a final render","Producing the final delivered file","Reducing the polygon count","Unwrapping UVs automatically"],"e":"It exists to increase the number of iterations. Final quality is still confirmed with a full render."}],[{"a":1,"q":"Which technique makes a specific color range transparent so that a subject shot against a blue or green backdrop can be combined with another background?","c":["Rotoscoping","Chroma key","Matte painting","Morphing"],"e":"Chroma key（クロマキー）uses blue or green because they are furthest from skin and hair tones."},{"a":2,"q":"In an RGBA image, what information does the A channel carry?","c":["Value (lightness)","Saturation","Opacity","Depth from the viewpoint"],"e":"A is the alpha channel, meaning opacity. It is the basis of all compositing work."},{"a":1,"q":"Which transition has the previous shot fade away while the next one appears over it?","c":["Cut","Dissolve (overlap)","Wipe","Fade out"],"e":"A dissolve overlaps two shots. A fade passes through black (or white) instead."},{"a":0,"q":"Which task analyses the camera movement in live-action footage so that CG elements can be composited with matching movement?","c":["Match move (camera tracking)","Color grading","Keying","Conform"],"e":"Match move（マッチムーブ）reconstructs the live-action camera in 3D space and applies it to the CG camera."},{"a":0,"q":"Which method renders elements separately so that each can be adjusted individually and layered together in compositing?","c":["Layer (element) rendering","Single-pass rendering","Preview rendering","Texture baking"],"e":"Separate outputs let you adjust color and intensity in compositing without re-rendering."},{"a":0,"q":"Which task cuts out part of live-action footage by hand, frame by frame?","c":["Rotoscoping","Chroma key","Match move","Grading"],"e":"Rotoscoping（ロトスコープ）is used to extract subjects from footage where chroma key is not available."},{"a":0,"q":"Which task adjusts the overall color of the film to create the intended mood?","c":["Color grading","Keying","Conform","Retopology"],"e":"Color grading（カラーグレーディング）goes beyond simple correction and designs the impression of the work."},{"a":1,"q":"Which frame rate has been standard for theatrical films?","c":["12 fps","24 fps","50 fps","120 fps"],"e":"Film runs at 24 fps. Television broadcasting uses about 30 fps (29.97) or 60 fps."},{"a":0,"q":"Which black-and-white image is used to show or hide part of an element during compositing?","c":["Mask (matte)","Mipmap","Seam","Proxy"],"e":"In a mask（マスク）white shows and black hides, serving the same role as an alpha channel."},{"a":0,"q":"Which is the most basic edit, switching instantly between two shots with no effect?","c":["Cut","Dissolve","Wipe","Fade"],"e":"The cut is the basic unit of editing and also the strongest tool for controlling pace."},{"a":0,"q":"What does the timecode 00:01:23:15 represent?","c":["0 hours, 1 minute, 23 seconds, 15 frames","0 days, 1 hour, 23 minutes, 15 seconds","1 minute 23.15 seconds","1 frame, 23 seconds, 15 units"],"e":"The order is hours, minutes, seconds, frames. The upper limit of the frame field depends on the frame rate in use."},{"a":1,"q":"What is the aspect ratio of a 1920 × 1080 video source?","c":["4:3","16:9","1:1","2.35:1"],"e":"1920:1080 equals 16:9, the standard aspect ratio for Full HD."},{"a":0,"q":"What characterizes non-linear editing?","c":["The order and length of material can be rearranged freely, any number of times","Recording must always proceed from the beginning","Once exported, it cannot be revised","It c rt","The source is clearly indicated","Prior permission is obtained from the rightsholder"],"e":"Quotation is permitted without permission when the requirements are met. If permission were needed, it would no longer be quotation."},{"a":0,"q":"An existing anime character is drawn without permission and sold as merchandise. Which right is most likely infringed?","c":["Copyright (reproduction and adaptation rights)","Patent right","Utility model right","Portrait right"],"e":"A character's artwork is protected as a copyrighted work. Merchandising requires the rightsholder's permission."},{"a":0,"q":"Which statement best describes publicity rights?","c":["The exclusive right to exploit the commercial drawing power of a well-known person's name or likeness","The exclusive right to work an invention","The exclusive right to a mark identifying goods","The right to refuse alteration of a work"],"e":"Publicity rights（パブリシティ権）focus on economic value, unlike portrait rights, which protect private interests."},{"a":0,"q":"When using an image labelled as free material, what should be checked first?","c":["The scope permitted by the terms of use or licence","The file size","The image resolution","The file format"],"e":"Free does not mean unconditional: commercial use may be barred, modification restricted, or credit required. Check the terms first."},{"a":0,"q":"What do trademark rights protect?","c":["Marks and names that identify goods or services","The design of an article","An invented technology","Expression such as novels and music"],"e":"A trademark indicates origin. Article design is protected by design rights and technical inventions by patents."},{"a":0,"q":"How does copyright law define a work?","c":["A creative expression of thoughts or sentiments","Every product offered for sale","Every registered creation","All information that has been made public"],"e":"Creative expression is the requirement. A mere list of data or facts is not a work."},{"a":0,"q":"In Japan, at w let lang="en";
const T=()=>I18N[lang];

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffled(arr,rnd){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildSets(){
  const rnd=mulberry32(20260806);
  const use=POOL.ja.map(p=>p.map(()=>0));
  const sets=[];
  for(let s=0;s<NSETS;s++){
    const paper=[];
    for(let d=0;d<10;d++){
      const idx=shuffled(POOL.ja[d].map((_,i)=>i),rnd);
      idx.sort((a,b)=>use[d][a]-use[d][b]);
      const pick=idx.slice(0,4);
      pick.forEach(i=>{use[d][i]++;});
      pick.forEach(i=>paper.push({d:d,i:i,ord:shuffled([0,1,2,3],rnd)}));
    }
    sets.push(paper);
  }
  return sets;
}
function randomPaper(){
  const rnd=mulberry32(Math.floor(Math.random()*1e9));
  const paper=[];
  for(let d=0;d<10;d++)shuffled(POOL.ja[d].map((_,i)=>i),rnd).slice(0,4).forEach(i=>paper.push({d:d,i:i,ord:shuffled([0,1,2,3],rnd)}));
  return paper;
}

function view(slot){
  const src=POOL[lang][slot.d][slot.i];
  return {q:src.q,e:src.e,d:slot.d,c:slot.ord.map(k=>src.c[k]),a:slot.ord.indexOf(src.a)};
}

const SETS=buildSets();
const best=new Array(NSETS).fill(null);
let mode="exam",slots=null,paper=null,labelKey=null,setIdx=-1,cur=0,answers=[],timer=null,remain=3600,reviewFilter="all",graded=false;

const $=id=>document.getElementById(id);
const show=id=>{document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$(id).classList.add("active");window.scrollTo(0,0);};
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1900);}
function labelText(){return setIdx>=0?T().setLabel(setIdx+1):T().randomLabel;}

function applyStatic(){
  const t=T();
  document.documentElement.lang=t.htmlLang;
  $("t-eyebrow").textContent=t.eyebrow;
  $("t-title").innerHTML=t.title;
  $("t-sub").textContent=t.sub;
  $("spec").innerHTML=t.spec.map(p=>'<div><dt>'+p[0]+'</dt><dd>'+p[1]+'</dd></div>').join("");
  $("t-h-mode").textContent=t.hMode;
  $("t-h-sets").textContent=t.hSets;
  $("t-h-radar").textContent=t.hRadar;
  $("t-h-review").textContent=t.hReview;
  $("m-exam").textContent=t.modeExam;
  $("m-study").textContent=t.modeStudy;
  $("modenote").textContent=mode==="exam"?t.noteExam:t.noteStudy;
  $("t-rand-b").textContent=t.randB;
  $("t-rand-s").textContent=t.randS;
  $("hint1").innerHTML=t.hint1;
  $("hint2").innerHTML=t.hint2;
  $("prev").textContent=t.prev;
  $("next").textContent=t.next;
  $("submit").textContent=t.submit;
  $("abort").textContent=t.abort;
  $("f-all").textContent=t.fAll;
  $("f-miss").textContent=t.fMiss;
  $("copy").textContent=t.copy;
  $("retry").textContent=t.retry;
  $("home").textContent=t.home;
  $("t-footer").textContent=t.footer;
  renderSets();
}
function setLang(l){
  lang=l;
  $("langtoggle").setAttribute("data-lang",l);
  $("lang-en").setAttribute("aria-pressed",l==="en");
  $("lang-ja").setAttribute("aria-pressed",l==="ja");
  applyStatic();
  if(slots){paper=slots.map(view);$("hud-set").textContent=labelText();}
  if($("s-exam").classList.contains("active"))renderQ();
  if($("s-result").classList.contains("active"))showResult();
}
$("lang-en").onclick=()=>setLang("en");
$("lang-ja").onclick=()=>setLang("ja");

function renderSets(){
  const g=$("setgrid");g.innerHTML="";
  for(let i=0;i<NSETS;i++){
    const b=document.createElement("button");
    b.className="setbtn"+(best[i]!==null&&best[i]>=70?" cleared":"");
    b.innerHTML='<span class="n">'+(i+1)+'</span><span class="l">'+T().setLabel(i+1)+'</span><span class="b">'+(best[i]===null?"":best[i]+T().pt)+'</span>';
    b.onclick=()=>start(SETS[i],i);
    g.appendChild(b);
  }
}
$("rand").onclick=()=>start(randomPaper(),-1);
$("m-exam").onclick=()=>setMode("exam");
$("m-study").onclick=()=>setMode("study");
function setMode(m){
  mode=m;
  $("m-exam").setAttribute("aria-pressed",m==="exam");
  $("m-study").setAttribute("aria-pressed",m==="study");
  $("modenote").textContent=m==="exam"?T().noteExam:T().noteStudy;
}

function start(s,idx){
  slots=s;setIdx=idx;paper=slots.map(view);
  cur=0;reviewFilter="all";graded=false;
  answers=new Array(40).fill(null);
  $("hud-set").textContent=labelText();
  clearInterval(timer);
  if(mode==="exam"){remain=3600;$("clock").style.display="";tick();timer=setInterval(tick,1000);}
  else{$("clock").style.display="none";}
  buildGrid();renderQ();show("s-exam");
  window.CGExamAvatar?.onStart(lang);
}
function tick(){
  const m=String(Math.floor(remain/60)).padStart(2,"0"),s=String(remain%60).padStart(2,"0");
  $("clock").textContent=m+":"+s;
  $("clock").classList.toggle("warn",remain<=300);
  if(remain<=0){clearInterval(timer);toast(T().timeUp);grade();return;}
  remain--;
}
function buildGrid(){
  const g=$("grid");g.innerHTML="";
  for(let i=0;i<40;i++){const b=document.createElement("button");b.textContent=i+1;b.onclick=()=>{cur=i;renderQ();};g.appendChild(b);}
}
function refreshGrid(){
  [...$("grid").children].forEach((b,i)=>{b.classList.toggle("answered",answers[i]!==null);b.classList.toggle("current",i===cur);});
  const n=answers.filter(a=>a!==null).length;
  $("hud-count").textContent=T().answered(n);
  $("gridnote").textContent=T().unanswered(40-n);
  $("prog").style.width=(n/40*100)+"%";
}
function renderQ(){
  const t=T(),item=paper[cur];
  $("qno").textContent=t.qno(item.d+1,cur%4+1);
  $("qdomain").textContent=t.domains[item.d];
  $("qtext").textContent=item.q;
  const reveal=(mode==="study"&&answers[cur]!==null);
  const box=$("choices");box.innerHTML="";
  item.c.forEach((txt,i)=>{
    const b=document.createElement("button");
    b.className="choice";
    b.setAttribute("aria-pressed",answers[cur]===i);
    if(reveal){
      if(i===item.a)b.classList.add("correct");
      else if(answers[cur]===i)b.classList.add("wrong");
      b.disabled=true;
    }
    const m=document.createElement("span");m.className="mark";m.textContent=t.marks[i];
    const s=document.createElement("span");s.textContent=txt;
    b.appendChild(m);b.appendChild(s);
    b.onclick=()=>choose(i);
    box.appendChild(b);
  });
  const fb=$("feedback");fb.innerHTML="";
  if(reveal){
    const ok=answers[cur]===item.a;
    const d=document.createElement("div");d.className="feedback";
    const v=document.createElement("span");v.className="verdict "+(ok?"o":"x");v.textContent=ok?t.correct:t.wrong;
    const p=document.createElement("span");p.textContent=t.fbCorrect(t.marks[item.a]);
    const e=document.createElement("div");e.style.marginTop="8px";e.style.color="var(--muted)";e.textContent=item.e;
    d.appendChild(v);d.appendChild(p);d.appendChild(e);
    const why=document.createElement("button");
    why.className="btn ghost";why.style.marginTop="10px";why.style.fontSize="12px";
    why.textContent=lang==="ja"?"アバターにもっと聞く":"Ask the avatar more";
    why.onclick=()=>window.CGExamAvatar?.explain(item,ok,lang,t.domains[item.d]);
    d.appendChild(why);
    fb.appendChild(d);
    window.CGExamAvatar?.onReveal(item,ok,lang,t.domains[item.d]);
  }
  $("prev").disabled=cur===0;$("next").disabled=cur===39;
  refreshGrid();
}
function choose(i){
  if(mode==="study"&&answers[cur]!==null)return;
  answers[cur]=i;renderQ();
  if(mode==="exam"&&cur<39)setTimeout(()=>{cur++;renderQ();},180);
}
$("prev").onclick=()=>{if(cur>0){cur--;renderQ();}};
$("next").onclick=()=>{if(cur<39){cur++;renderQ();}};
$("abort").onclick=()=>{if(confirm(T().confirmAbort)){clearInterval(timer);renderSets();show("s-start");}};
$("submit").onclick=()=>{
  const un=answers.filter(a=>a===null).length;
  if(un>0&&!confirm(T().confirmSubmit(un)))return;
  grade();
};
document.addEventListener("keydown",e=>{
  if(!$("s-exam").classList.contains("active"))return;
  if(e.key==="ArrowRight"&&cur<39){cur++;renderQ();}
  if(e.key==="ArrowLeft"&&cur>0){cur--;renderQ();}
  const k=["1","2","3","4"].indexOf(e.key);
  if(k>=0)choose(k);
});

function tally(){
  const dom=new Array(10).fill(0);let correct=0;
  paper.forEach((item,i)=>{if(answers[i]===item.a){correct++;dom[item.d]++;}});
  return{dom:dom,correct:correct,score:correct*2.5};
}
let elapsedMin=0;
function grade(){
  clearInterval(timer);
  elapsedMin=Math.floor((3600-remain)/60);
  graded=true;
  const t=tally();
  if(setIdx>=0&&(best[setIdx]===null||t.score>best[setIdx]))best[setIdx]=t.score;
  showResult();show("s-result");
}
function showResult(){
  const t=T(),r=tally();
  $("r-eyebrow").textContent=labelText()+" / "+t.modeName(mode);
  $("r-score").textContent=(r.score%1===0)?r.score:r.score.toFixed(1);
  const pass=r.score>=70;
  $("r-pill").textContent=pass?t.pass:t.short((70-r.score).toFixed(1));
  $("r-pill").className="verdictpill "+(pass?"pass":"fail");
  $("r-meta").textContent=t.meta(r.correct,mode==="exam"?t.elapsed(elapsedMin):t.noLimit);
  drawRadar(r.dom);drawBars(r.dom);drawAdvice(r.dom,r.score);renderReview();
  window.CGExamAvatar?.onResult(r,t.domains,lang);
}
function drawRadar(dom){
  const t=T(),cx=270,cy=230,R=150,N=10;
  const pt=(i,r)=>{const ang=-Math.PI/2+i*2*Math.PI/N;return[cx+Math.cos(ang)*R*r,cy+Math.sin(ang)*R*r];};
  let s="";
  [0.25,0.5,0.75,1].forEach(r=>{let d="";for(let i=0;i<N;i++){const p=pt(i,r);d+=(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)+" ";}s+='<path class="ring" d="'+d+'Z"/>';});
  let dp="";for(let i=0;i<N;i++){const p=pt(i,0.7);dp+=(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)+" ";}
  s+='<path class="pass-ring" d="'+dp+'Z"/>';
  for(let i=0;i<N;i++){const p=pt(i,1);s+='<line class="axis" x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'"/>';}
  let mesh="";for(let i=0;i<N;i++){const p=pt(i,Math.max(dom[i]/4,0.02));mesh+=(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)+" ";}
  s+='<path class="mesh" d="'+mesh+'Z"/>';
  for(let i=0;i<N;i++){const p=pt(i,Math.max(dom[i]/4,0.02));s+='<circle class="vert" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3"/>';}
  for(let i=0;i<N;i++){
    const p=pt(i,1.17);let anchor="middle";
    if(p[0]>cx+8)anchor="start";
    if(p[0]<cx-8)anchor="end";
    s+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+3).toFixed(1)+'" text-anchor="'+anchor+'">'+t.short[i]+'</text>';
  }
  s+='<text class="passlabel" x="'+cx+'" y="'+(cy-R*0.7-6)+'" text-anchor="middle">'+t.passLabel+'</text>';
  $("radar").innerHTML=s;
}
function drawBars(dom){
  const t=T();
  $("bars").innerHTML=dom.map((v,i)=>'<div class="bar"><span class="nm">'+t.domains[i]+'</span><span class="track'+(v<=2?" low":"")+'"><i style="width:'+(v/4*100)+'%"></i></span><span class="val">'+v+'/4</span></div>').join("");
}
function drawAdvice(dom,score){
  const t=T(),weak=dom.map((v,i)=>({v:v,i:i})).filter(o=>o.v<=2).map(o=>t.domains[o.i]);
  $("advice").innerHTML=weak.length===0?t.adviceOK:t.adviceNG(weak,score);
}
function renderReview(){
  const t=T(),box=$("review");box.innerHTML="";
  const nodes=paper.map((item,i)=>{
    const ok=answers[i]===item.a;
    if(reviewFilter==="miss"&&ok)return null;
    const d=document.createElement("div");d.className="rev"+(ok?"":" miss");
    const h=document.createElement("div");h.className="rq";
    h.textContent=t.qno(item.d+1,i%4+1)+"　"+t.domains[item.d]+"　"+(ok?t.correct:t.wrong);
    const q=document.createElement("p");q.className="rt";q.textContent=item.q;
    const a=document.createElement("p");a.className="ra";
    const ab=document.createElement("b");ab.textContent=t.marks[item.a]+"　"+item.c[item.a];
    a.textContent=t.revAnswer;a.appendChild(ab);
    d.appendChild(h);d.appendChild(q);d.appendChild(a);
    if(!ok){
      const y=document.createElement("p");y.className="ra yours";
      y.textContent=t.revYours+(answers[i]===null?t.unansweredWord:t.marks[answers[i]]+"　"+item.c[answers[i]]);
      d.appendChild(y);
    }
    const e=document.createElement("p");e.className="re";e.textContent=item.e;
    d.appendChild(e);
    return d;
  }).filter(Boolean);
  if(nodes.length===0){const d=document.createElement("div");d.className="rev";const p=document.createElement("p");p.className="rt";p.textContent=t.noMiss;d.appendChild(p);box.appendChild(d);}
  else nodes.forEach(n=>box.appendChild(n));
}
$("f-all").onclick=()=>{reviewFilter="all";$("f-all").setAttribute("aria-pressed",true);$("f-miss").setAttribute("aria-pressed",false);renderReview();};
$("f-miss").onclick=()=>{reviewFilter="miss";$("f-all").setAttribute("aria-pressed",false);$("f-miss").setAttribute("aria-pressed",true);renderReview();};
$("retry").onclick=()=>start(slots,setIdx);
$("home").onclick=()=>{renderSets();show("s-start");};
$("copy").onclick=()=>{
  const t=T(),r=tally();
  const lines=[t.copyTitle+labelText(),t.copyScore(r.score,r.correct),t.copyDom]
    .concat(t.domains.map((d,i)=>d+"　"+r.dom[i]+"/4"));
  navigator.clipboard.writeText(lines.join("\n")).then(()=>toast(t.copied),()=>toast(t.copyFail));
};
setLang("en");
</script>
<script type="module" src="./avatar.js"></script>
</body>
