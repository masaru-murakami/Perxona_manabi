<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>質問ログ分析 — CG検定模擬試験</title>
<style>
:root{
  --paper:#E9EBF0; --surface:#FFFFFF; --line:#C9CEDA; --ink:#171A22; --muted:#666E80;
  --key:#D98A24; --fill:#2F7E97; --back:#A8477A; --ok:#2E7D5B; --ng:#B03A3A;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --gothic:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",Meiryo,sans-serif;
  --display:"Iowan Old Style",Georgia,"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 60px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.3;margin:8px 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
h2{font-family:var(--display);font-size:16px;font-weight:600;margin:0 0 12px}
.gate{max-width:360px;margin:60px auto 0}
.gate input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:var(--mono);margin-bottom:10px}
.gate button, .btn{padding:9px 16px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-size:13px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.err{color:var(--ng);font-size:12.5px;margin-top:8px}
.hint{color:var(--muted);font-size:12.5px;margin-top:8px}
.back-link{color:var(--muted);text-decoration:none;font-family:var(--mono);font-size:12px;letter-spacing:.04em}
.back-link:hover{color:var(--fill);text-decoration:underline}
[hidden]{display:none!important}

.langtoggle{position:fixed;right:18px;top:18px;z-index:50;display:flex;align-items:center;
  background:var(--surface);border:1px solid var(--ink);border-radius:999px;padding:3px;
  box-shadow:0 6px 20px rgba(23,26,34,.20)}
.langtoggle .knob{position:absolute;top:3px;left:3px;width:82px;height:calc(100% - 6px);
  background:var(--ink);border-radius:999px;transition:transform .22s cubic-bezier(.4,0,.2,1)}
.langtoggle[data-lang="en"] .knob{transform:translateX(82px)}
.langtoggle button{position:relative;z-index:1;width:82px;border:0;background:transparent;
  padding:9px 0;border-radius:999px;font-size:12.5px;letter-spacing:.04em;color:var(--muted);
  cursor:pointer;transition:color .2s}
.langtoggle button[aria-pressed="true"]{color:#fff;font-weight:600}
@media (max-width:480px){
  .langtoggle{right:12px;top:12px}
  .langtoggle .knob,.langtoggle button{width:70px}
  .langtoggle[data-lang="en"] .knob{transform:translateX(70px)}
}

.stat-row{display:flex;gap:14px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat .n{font-family:var(--mono);font-size:26px;font-weight:600}
.stat .l{font-size:11px;color:var(--muted);letter-spacing:.04em}

.bar-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12.5px}
.bar-row .label{flex:0 0 150px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .track{flex:1;background:var(--paper);border-radius:5px;height:14px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--fill);border-radius:5px}
.bar-row .count{flex:0 0 34px;text-align:right;font-family:var(--mono);color:var(--muted)}

.days-scroll{overflow-x:auto;margin-top:6px}
.days{display:flex;align-items:flex-end;gap:4px;height:100px;min-width:min-content}
.days .day{flex:0 0 36px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.days .day .col{width:100%;background:var(--key);border-radius:3px 3px 0 0;min-height:2px}
.days .day .lbl{font-family:var(--mono);font-size:9px;color:var(--muted);white-space:nowrap}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar input[type=search]{flex:1;min-width:180px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.toolbar .count-note{font-size:12px;color:var(--muted)}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
td.q, td.r{max-width:280px}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.ng{color:var(--ng);border-color:var(--ng)}
.tag.hint{color:var(--back);border-color:var(--back)}
.tag.ask{color:var(--fill);border-color:var(--fill)}
.table-wrap{overflow-x:auto}
</style>
</head>
<body>
<div class="langtoggle" id="langtoggle" data-lang="ja" role="group" aria-label="Language / 表示言語">
  <span class="knob" aria-hidden="true"></span>
  <button id="lang-ja" aria-pressed="true">日本語</button>
  <button id="lang-en" aria-pressed="false">English</button>
</div>
<div class="wrap">
  <div class="eyebrow">CG-ARTS EXAM PREP / INTERNAL</div>
  <h1 id="t-h1"></h1>
  <p class="sub" id="t-sub"></p>
  <p><a class="back-link" id="back-link" href="./" target="_blank" rel="noopener"></a></p>

  <div class="gate card" id="gate">
    <h2 id="t-gate-h2"></h2>
    <input type="password" id="gate-pw" placeholder="ANALYTICS_PASSWORD" autocomplete="off">
    <button class="btn" id="gate-submit"></button>
    <p class="err" id="gate-err" hidden></p>
    <p class="hint" id="gate-hint" hidden></p>
  </div>

  <div id="view" hidden>
    <div class="stat-row">
      <div class="stat"><div class="n" id="stat-total">–</div><div class="l" id="t-stat-total"></div></div>
      <div class="stat"><div class="n" id="stat-ask">–</div><div class="l" id="t-stat-ask"></div></div>
      <div class="stat"><div class="n" id="stat-hint">–</div><div class="l" id="t-stat-hint"></div></div>
      <div class="stat"><div class="n" id="stat-success">–</div><div class="l" id="t-stat-success"></div></div>
      <div class="stat"><div class="n" id="stat-ja">–</div><div class="l" id="t-stat-ja"></div></div>
      <div class="stat"><div class="n" id="stat-en">–</div><div class="l" id="t-stat-en"></div></div>
    </div>

    <div class="card">
      <h2 id="t-h-domain"></h2>
      <div id="by-domain"></div>
    </div>

    <div class="card">
      <h2 id="t-h-days"></h2>
      <div class="days-scroll" id="by-day-scroll"><div class="days" id="by-day"></div></div>
    </div>

    <div class="card">
      <h2 id="t-h-table"></h2>
      <div class="toolbar">
        <input type="search" id="search">
        <span class="count-note" id="table-count"></span>
        <button class="btn ghost" id="refresh"></button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th id="t-col-ts"></th><th id="t-col-kind"></th><th id="t-col-lang"></th>
              <th id="t-col-domain"></th><th id="t-col-q"></th><th id="t-col-r"></th><th id="t-col-result"></th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "cg-exam-analytics-pw";
const TABLE_ROW_LIMIT = 300; // render cap after filtering — keeps the DOM light on a large log

const I18N = {
  ja: {
    docTitle: "質問ログ分析 — CG検定模擬試験",
    h1: "質問ログ分析",
    sub: "「AIに質問する」フォームに学習者が送った質問を集計・一覧します。",
    backLink: "検定選択ページを開く（別タブ）",
    gateH2: "パスワード",
    gateSubmit: "見る",
    gateErrWrong: "パスワードが違います。",
    gateErrLoad: (m) => `読み込みに失敗しました: ${m}`,
    gateHintNotSet:
      "ANALYTICS_PASSWORD がサーバーに設定されていません。.env（本番は Netlify の環境変数）に設定し、サーバーを再起動/再デプロイしてください。",
    statTotal: "総件数", statAsk: "自由質問", statHint: "ヒント", statSuccess: "回答成功",
    statJa: "日本語", statEn: "English",
    hDomain: "分野別", hDays: "日別件数(直近14日)", hTable: "質問一覧",
    searchPh: "質問・回答をキーワード検索…", refresh: "更新",
    colTs: "日時", colKind: "種別", colLang: "言語", colDomain: "分野", colQ: "質問", colR: "回答", colResult: "結果",
    tagHint: "ヒント", tagAsk: "質問", tagOk: "成功", tagNg: "失敗",
    noData: "まだデータがありません。",
    uncategorized: "(未分類)",
    countShown: (shown, filtered, total) => `${shown} / ${filtered} 件を表示（全 ${total} 件）`,
    countAll: (filtered, total) => `${filtered} 件（全 ${total} 件）`,
    locale: "ja-JP",
  },
  en: {
    docTitle: "Question Log Analytics — CG Exam Mock Tests",
    h1: "Question Log Analytics",
    sub: 'Aggregates and lists the questions learners sent through the "Ask the AI" form.',
    backLink: "Open the certification picker (new tab)",
    gateH2: "Password",
    gateSubmit: "View",
    gateErrWrong: "Incorrect password.",
    gateErrLoad: (m) => `Failed to load: ${m}`,
    gateHintNotSet:
      "ANALYTICS_PASSWORD isn't set on the server. Set it in .env (or Netlify's environment variables in production), then restart or redeploy the server.",
    statTotal: "Total", statAsk: "Free questions", statHint: "Hints", statSuccess: "Successful replies",
    statJa: "Japanese", statEn: "English",
    hDomain: "By domain", hDays: "Daily count (last 14 days)", hTable: "Question log",
    searchPh: "Search questions and replies…", refresh: "Refresh",
    colTs: "Date", colKind: "Kind", colLang: "Lang", colDomain: "Domain", colQ: "Question", colR: "Reply", colResult: "Result",
    tagHint: "Hint", tagAsk: "Ask", tagOk: "OK", tagNg: "Failed",
    noData: "No data yet.",
    uncategorized: "(Uncategorized)",
    countShown: (shown, filtered, total) => `Showing ${shown} / ${filtered} (of ${total} total)`,
    countAll: (filtered, total) => `${filtered} (of ${total} total)`,
    locale: "en-US",
  },
};
let lang = "ja";
const t = () => I18N[lang];

// Logged entries carry whatever domain NAME string was on screen at the
// time (e.g. "映像制作のワークフロー" or "Production workflow") — there's no
// stable domain id in the log. To show "By domain" and the table's Domain
// column in the *current* UI language regardless of which language a given
// question was actually asked in, build a ja<->en name map from every
// certification's own data file (data/manifest.json + data/<id>.json,
// same files the exam picker reads) and use it to canonicalize + relabel.
// Domain names not found in any exam file (e.g. from a retired exam) are
// left exactly as logged.
let domainJaToEn = {};
let domainEnToJa = {};
const domainMapsReady = (async () => {
  try {
    const manifest = await fetch("data/manifest.json").then((r) => r.json());
    for (const exam of manifest.exams ?? []) {
      const data = await fetch("data/" + exam.file).then((r) => r.json());
      const ja = data.domains?.ja ?? [];
      const en = data.domains?.en ?? [];
      ja.forEach((j, i) => {
        const e = en[i];
        if (j && e) {
          domainJaToEn[j] = e;
          domainEnToJa[e] = j;
        }
      });
    }
  } catch {
    // Best effort — dashboard still works, just shows raw logged strings.
  }
})();
// Canonicalizes a logged domain string to its ja form (the map's key side),
// so entries logged in either language merge into one count.
function canonicalDomain(raw) {
  if (!raw) return null;
  if (raw in domainJaToEn) return raw;
  if (raw in domainEnToJa) return domainEnToJa[raw];
  return raw; // unmapped — keep as originally logged
}
// Renders a canonical (ja-keyed) domain name in the current UI language.
function displayDomain(canonicalJa) {
  if (lang === "en" && canonicalJa in domainJaToEn) return domainJaToEn[canonicalJa];
  return canonicalJa;
}

const gate = document.getElementById("gate");
const gatePw = document.getElementById("gate-pw");
const gateSubmit = document.getElementById("gate-submit");
const gateErr = document.getElementById("gate-err");
const gateHint = document.getElementById("gate-hint");
const view = document.getElementById("view");
const searchInput = document.getElementById("search");
const refreshBtn = document.getElementById("refresh");
const tableBody = document.getElementById("table-body");
const tableCount = document.getElementById("table-count");
const langtoggle = document.getElementById("langtoggle");

let entries = [];
// Tracks which gate message (if any) is currently showing, so switching
// language while the gate is up re-renders the same message in the new
// language instead of leaving it stale or clearing it.
let gateState = null; // null | "wrong" | { load: message } | "notset"

function applyStatic() {
  const s = t();
  document.documentElement.lang = lang;
  document.title = s.docTitle;
  document.getElementById("t-h1").textContent = s.h1;
  document.getElementById("t-sub").textContent = s.sub;
  document.getElementById("back-link").textContent = s.backLink;
  document.getElementById("t-gate-h2").textContent = s.gateH2;
  gateSubmit.textContent = s.gateSubmit;
  document.getElementById("t-stat-total").textContent = s.statTotal;
  document.getElementById("t-stat-ask").textContent = s.statAsk;
  document.getElementById("t-stat-hint").textContent = s.statHint;
  document.getElementById("t-stat-success").textContent = s.statSuccess;
  document.getElementById("t-stat-ja").textContent = s.statJa;
  document.getElementById("t-stat-en").textContent = s.statEn;
  document.getElementById("t-h-domain").textContent = s.hDomain;
  document.getElementById("t-h-days").textContent = s.hDays;
  document.getElementById("t-h-table").textContent = s.hTable;
  searchInput.placeholder = s.searchPh;
  refreshBtn.textContent = s.refresh;
  document.getElementById("t-col-ts").textContent = s.colTs;
  document.getElementById("t-col-kind").textContent = s.colKind;
  document.getElementById("t-col-lang").textContent = s.colLang;
  document.getElementById("t-col-domain").textContent = s.colDomain;
  document.getElementById("t-col-q").textContent = s.colQ;
  document.getElementById("t-col-r").textContent = s.colR;
  document.getElementById("t-col-result").textContent = s.colResult;

  if (gateState === "wrong") showGateError(s.gateErrWrong, false);
  else if (gateState && gateState.load) showGateError(s.gateErrLoad(gateState.load), false);
  else if (gateState === "notset") showGateHint(s.gateHintNotSet, false);
}

function setLang(l) {
  lang = l;
  langtoggle.dataset.lang = l;
  document.getElementById("lang-ja").setAttribute("aria-pressed", l === "ja");
  document.getElementById("lang-en").setAttribute("aria-pressed", l === "en");
  applyStatic();
  if (!view.hidden) render();
}
document.getElementById("lang-ja").onclick = () => setLang("ja");
document.getElementById("lang-en").onclick = () => setLang("en");

async function fetchAnalytics(password) {
  const res = await fetch("/api/analytics", {
    headers: { "x-analytics-password": password },
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(body.error ?? res.statusText);
    err.status = res.status;
    throw err;
  }
  return body;
}

function showGateError(message, remember = true) {
  if (remember) gateState = { load: message };
  gateErr.textContent = message;
  gateErr.hidden = false;
  gateHint.hidden = true;
}

function showGateHint(message, remember = true) {
  if (remember) gateState = "notset";
  gateHint.textContent = message;
  gateHint.hidden = false;
  gateErr.hidden = true;
}

async function tryLoad(password) {
  gateErr.hidden = true;
  gateHint.hidden = true;
  gateState = null;
  try {
    const data = await fetchAnalytics(password);
    try {
      sessionStorage.setItem(STORAGE_KEY, password);
    } catch {
      // sessionStorage unavailable — fine, just re-prompt next reload.
    }
    entries = data.entries ?? [];
    await domainMapsReady;
    gate.hidden = true;
    view.hidden = false;
    render();
  } catch (error) {
    try {
      sessionStorage.removeItem(STORAGE_KEY);
    } catch {}
    if (error.status === 501) {
      gateState = "notset";
      showGateHint(t().gateHintNotSet, false);
    } else if (error.status === 401) {
      gateState = "wrong";
      showGateError(t().gateErrWrong, false);
    } else {
      gateState = { load: error.message };
      showGateError(t().gateErrLoad(error.message), false);
    }
  }
}

gateSubmit.addEventListener("click", () => {
  const pw = gatePw.value.trim();
  if (!pw) return;
  tryLoad(pw);
});
gatePw.addEventListener("keydown", (e) => {
  if (e.key === "Enter") gateSubmit.click();
});

refreshBtn.addEventListener("click", () => {
  const pw = (() => {
    try {
      return sessionStorage.getItem(STORAGE_KEY);
    } catch {
      return null;
    }
  })();
  if (pw) tryLoad(pw);
});

searchInput.addEventListener("input", () => renderTable());

function barList(container, counts, total) {
  container.innerHTML = "";
  const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (rows.length === 0) {
    container.innerHTML = `<p class="hint">${escapeHtml(t().noData)}</p>`;
    return;
  }
  const max = rows[0][1];
  for (const [label, count] of rows) {
    const row = document.createElement("div");
    row.className = "bar-row";
    const pct = total > 0 ? Math.round((count / max) * 100) : 0;
    row.innerHTML = `
      <span class="label">${escapeHtml(label)}</span>
      <span class="track"><span class="fill" style="width:${pct}%"></span></span>
      <span class="count">${count}</span>`;
    container.appendChild(row);
  }
}

function renderDays(container, entries) {
  container.innerHTML = "";
  const days = [];
  const now = new Date();
  for (let i = 13; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    days.push(d.toISOString().slice(0, 10));
  }
  const counts = Object.fromEntries(days.map((d) => [d, 0]));
  for (const e of entries) {
    const day = (e.ts ?? "").slice(0, 10);
    if (day in counts) counts[day]++;
  }
  const max = Math.max(1, ...Object.values(counts));
  for (const day of days) {
    const el = document.createElement("div");
    el.className = "day";
    const h = Math.max(2, Math.round((counts[day] / max) * 90));
    const mmdd = day.slice(5).replace("-", "/");
    el.innerHTML = `<span class="lbl">${counts[day] || ""}</span><span class="col" style="height:${h}px"></span><span class="lbl">${mmdd}</span>`;
    container.appendChild(el);
  }
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function formatTs(iso) {
  try {
    return new Date(iso).toLocaleString(t().locale, {
      month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit",
    });
  } catch {
    return iso ?? "";
  }
}

function renderTable() {
  const s = t();
  const q = searchInput.value.trim().toLowerCase();
  const filtered = q
    ? entries.filter(
        (e) =>
          (e.question ?? "").toLowerCase().includes(q) ||
          (e.reply ?? "").toLowerCase().includes(q) ||
          (e.domain ?? "").toLowerCase().includes(q),
      )
    : entries;
  const shown = filtered.slice(0, TABLE_ROW_LIMIT);
  tableCount.textContent =
    filtered.length > shown.length
      ? s.countShown(shown.length, filtered.length, entries.length)
      : s.countAll(filtered.length, entries.length);
  tableBody.innerHTML = shown
    .map(
      (e) => `
    <tr>
      <td>${formatTs(e.ts)}</td>
      <td>${e.kind === "hint" ? `<span class="tag hint">${escapeHtml(s.tagHint)}</span>` : `<span class="tag ask">${escapeHtml(s.tagAsk)}</span>`}</td>
      <td>${e.lang === "en" ? "EN" : "JA"}</td>
      <td>${escapeHtml(e.domain ? displayDomain(canonicalDomain(e.domain)) : "—")}</td>
      <td class="q">${escapeHtml(e.question)}</td>
      <td class="r">${escapeHtml(e.reply ?? (e.errorMessage ?? "—"))}</td>
      <td>${e.success ? `<span class="tag ok">${escapeHtml(s.tagOk)}</span>` : `<span class="tag ng">${escapeHtml(s.tagNg)}</span>`}</td>
    </tr>`,
    )
    .join("");
}

function render() {
  const total = entries.length;
  const askCount = entries.filter((e) => e.kind !== "hint").length;
  const hintCount = entries.filter((e) => e.kind === "hint").length;
  const success = entries.filter((e) => e.success).length;
  const ja = entries.filter((e) => e.lang !== "en").length;
  const en = entries.filter((e) => e.lang === "en").length;
  document.getElementById("stat-total").textContent = total;
  document.getElementById("stat-ask").textContent = askCount;
  document.getElementById("stat-hint").textContent = hintCount;
  document.getElementById("stat-success").textContent = success;
  document.getElementById("stat-ja").textContent = ja;
  document.getElementById("stat-en").textContent = en;

  // Group by canonical (ja) domain first so the same domain logged in
  // either language merges into one count, then label each group in the
  // current UI language for display.
  const UNCATEGORIZED = "__uncategorized__";
  const canonicalCounts = {};
  for (const e of entries) {
    const key = e.domain ? canonicalDomain(e.domain) : UNCATEGORIZED;
    canonicalCounts[key] = (canonicalCounts[key] ?? 0) + 1;
  }
  const domainCounts = {};
  for (const [key, count] of Object.entries(canonicalCounts)) {
    const label = key === UNCATEGORIZED ? t().uncategorized : displayDomain(key);
    domainCounts[label] = (domainCounts[label] ?? 0) + count;
  }
  barList(document.getElementById("by-domain"), domainCounts, total);
  renderDays(document.getElementById("by-day"), entries);
  // Scroll the day chart to the right so today is visible by default when
  // the 14-day chart is wider than the card (narrow viewports).
  const daysScroll = document.getElementById("by-day-scroll");
  daysScroll.scrollLeft = daysScroll.scrollWidth;
  renderTable();
}

applyStatic();

// Auto-load if a password was already entered earlier this tab session.
(() => {
  let saved = null;
  try {
    saved = sessionStorage.getItem(STORAGE_KEY);
  } catch {}
  if (saved) tryLoad(saved);
})();
</script>
</body>
